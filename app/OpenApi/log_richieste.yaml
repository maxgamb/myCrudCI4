        'log_ric_notti':
          type: integer
          format: int32
        'log_ric_wind':
          type: integer
          format: int32
        'log_ric_utente_id':
          type: integer
          format: int32
    LogRichiesteListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/LogRichiesteRead'
        meta: { type: object }
        links: { type: object }
    LogRichiesteCreatedResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            'log_ric_id':
              type: integer
              format: int32
        meta: { type: object }
        links: { type: object }
