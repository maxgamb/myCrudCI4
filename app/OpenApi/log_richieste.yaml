openapi: 3.0.3
info:
  title: 'log_richieste API'
  version: 1.0.0
paths:
  /api/v1/log_richieste:
    get:
      summary: 'Elenco log_richieste'
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: 'filter[log_ric_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[log_ric_hotel_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: sort
          in: query
          schema: { type: string, enum: ['log_ric_id', 'log_ric_hotel_id'] }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: Elenco paginato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogRichiesteListResponse'
    post:
      summary: Crea record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogRichiesteCreate'
      responses:
        '201':
          description: Record creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogRichiesteCreatedResponse'
        '422': { description: Errore di validazione }
  /api/v1/log_richieste/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Dettaglio record
      responses:
        '200':
          description: Record trovato
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/LogRichiesteRead'
        '404': { description: Record non trovato }
    put:
      summary: Aggiornamento completo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogRichiesteUpdate'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    patch:
      summary: Aggiornamento parziale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogRichiestePatch'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    delete:
      summary: Elimina record
      responses:
        '204': { description: Record eliminato }
components:
  schemas:
    LogRichiesteRead:
      type: object
      properties:
        'log_ric_id':
          type: integer
          format: int32
        'log_ric_hotel_id':
          type: integer
          format: int32
        'log_ric_dal':
          type: string
          format: date
        'log_ric_al':
          type: string
          format: date
        'log_ric_data':
          type: string
          format: date
        'log_ric_notti':
          type: integer
          format: int32
        'log_ric_wind':
          type: integer
          format: int32
        'log_ric_utente_id':
          type: integer
          format: int32
    LogRichiesteCreate:
      type: object
      required:
        - 'log_ric_hotel_id'
        - 'log_ric_dal'
        - 'log_ric_al'
        - 'log_ric_data'
        - 'log_ric_notti'
        - 'log_ric_wind'
        - 'log_ric_utente_id'
      properties:
        'log_ric_hotel_id':
          type: integer
          format: int32
        'log_ric_dal':
          type: string
          format: date
        'log_ric_al':
          type: string
          format: date
        'log_ric_data':
          type: string
          format: date
        'log_ric_notti':
          type: integer
          format: int32
        'log_ric_wind':
          type: integer
          format: int32
        'log_ric_utente_id':
          type: integer
          format: int32
    LogRichiesteUpdate:
      type: object
      required:
        - 'log_ric_hotel_id'
        - 'log_ric_dal'
        - 'log_ric_al'
        - 'log_ric_data'
        - 'log_ric_notti'
        - 'log_ric_wind'
        - 'log_ric_utente_id'
      properties:
        'log_ric_hotel_id':
          type: integer
          format: int32
        'log_ric_dal':
          type: string
          format: date
        'log_ric_al':
          type: string
          format: date
        'log_ric_data':
          type: string
          format: date
        'log_ric_notti':
          type: integer
          format: int32
        'log_ric_wind':
          type: integer
          format: int32
        'log_ric_utente_id':
          type: integer
          format: int32
    LogRichiestePatch:
      type: object
