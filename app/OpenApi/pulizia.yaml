openapi: 3.0.3
info:
  title: 'pulizia API'
  version: 1.0.0
paths:
  /api/v1/pulizia:
    get:
      summary: 'Elenco pulizia'
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: 'filter[pulizia_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[hotel_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[conto_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[camera_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[pulizia_data]'
          in: query
          schema:
            type: string
            format: date
        - name: sort
          in: query
          schema: { type: string, enum: ['pulizia_id', 'hotel_id', 'conto_id', 'camera_id', 'pulizia_data'] }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: Elenco paginato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PuliziaListResponse'
    post:
      summary: Crea record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PuliziaCreate'
      responses:
        '201':
          description: Record creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PuliziaCreatedResponse'
        '422': { description: Errore di validazione }
  /api/v1/pulizia/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Dettaglio record
      responses:
        '200':
          description: Record trovato
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PuliziaRead'
        '404': { description: Record non trovato }
    put:
      summary: Aggiornamento completo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PuliziaUpdate'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    patch:
      summary: Aggiornamento parziale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PuliziaPatch'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    delete:
      summary: Elimina record
      responses:
        '204': { description: Record eliminato }
components:
  schemas:
    PuliziaRead:
      type: object
      properties:
        'pulizia_id':
          type: integer
          format: int32
        'hotel_id':
          type: integer
          format: int32
        'conto_id':
          type: integer
          format: int32
        'camera_id':
          type: integer
          format: int32
        'cambio_biancheria':
          type: integer
          format: int32
          nullable: true
        'pulizia_stato':
          type: integer
          format: int32
        'pulizia_data':
          type: string
          format: date
          nullable: true
        'pulizia_note':
          type: string
          nullable: true
          maxLength: 255
        'utente_id':
          type: integer
          format: int32
        'conti_trattamento_sog':
          type: string
          nullable: true
    PuliziaCreate:
      type: object
      required:
        - 'hotel_id'
        - 'conto_id'
        - 'camera_id'
        - 'pulizia_stato'
        - 'utente_id'
      properties:
        'hotel_id':
          type: integer
          format: int32
        'conto_id':
          type: integer
          format: int32
        'camera_id':
          type: integer
          format: int32
        'cambio_biancheria':
          type: integer
          format: int32
          nullable: true
        'pulizia_stato':
          type: integer
          format: int32
        'pulizia_data':
          type: string
          format: date
          nullable: true
        'pulizia_note':
          type: string
          nullable: true
          maxLength: 255
        'utente_id':
          type: integer
          format: int32
    PuliziaUpdate:
      type: object
      required:
        - 'hotel_id'
        - 'conto_id'
        - 'camera_id'
        - 'pulizia_stato'
        - 'utente_id'
      properties:
        'hotel_id':
          type: integer
          format: int32
        'conto_id':
          type: integer
          format: int32
        'camera_id':
          type: integer
          format: int32
        'cambio_biancheria':
          type: integer
          format: int32
          nullable: true
        'pulizia_stato':
          type: integer
          format: int32
        'pulizia_data':
          type: string
          format: date
          nullable: true
        'pulizia_note':
          type: string
          nullable: true
          maxLength: 255
        'utente_id':
          type: integer
          format: int32
    PuliziaPatch:
      type: object
      properties:
        'hotel_id':
          type: integer
          format: int32
        'conto_id':
          type: integer
          format: int32
        'camera_id':
          type: integer
          format: int32
        'cambio_biancheria':
          type: integer
          format: int32
          nullable: true
        'pulizia_stato':
          type: integer
          format: int32
        'pulizia_data':
          type: string
          format: date
          nullable: true
        'pulizia_note':
          type: string
          nullable: true
          maxLength: 255
        'utente_id':
          type: integer
          format: int32
    PuliziaListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PuliziaRead'
        meta: { type: object }
        links: { type: object }
    PuliziaCreatedResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            'pulizia_id':
              type: integer
              format: int32
        meta: { type: object }
        links: { type: object }
