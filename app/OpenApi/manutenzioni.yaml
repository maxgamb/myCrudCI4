openapi: 3.0.3
info:
  title: 'manutenzioni API'
  version: 1.0.0
paths:
  /api/v1/manutenzioni:
    get:
      summary: 'Elenco manutenzioni'
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: 'filter[manutenzione_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: sort
          in: query
          schema: { type: string, enum: ['manutenzione_id'] }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: Elenco paginato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManutenzioniListResponse'
    post:
      summary: Crea record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManutenzioniCreate'
      responses:
        '201':
          description: Record creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManutenzioniCreatedResponse'
        '422': { description: Errore di validazione }
  /api/v1/manutenzioni/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Dettaglio record
      responses:
        '200':
          description: Record trovato
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ManutenzioniRead'
        '404': { description: Record non trovato }
    put:
      summary: Aggiornamento completo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManutenzioniUpdate'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    patch:
      summary: Aggiornamento parziale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManutenzioniPatch'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    delete:
      summary: Elimina record
      responses:
        '204': { description: Record eliminato }
components:
  schemas:
    ManutenzioniRead:
      type: object
      properties:
        'manutenzione_id':
          type: integer
          format: int32
        'hotel_id':
          type: integer
          format: int32
        'manut_priorita':
          type: string
          maxLength: 10
        'manut_area_guasto':
          type: string
          maxLength: 10
        'manut_piano':
          type: string
          nullable: true
          maxLength: 10
        'manut_camera':
          type: string
          nullable: true
          maxLength: 10
        'manut_descrizione':
          type: string
          nullable: true
          maxLength: 4294967295
        'manut_data_segnalazione':
          type: string
          format: date
        'manut_stato':
          type: string
          maxLength: 2
    ManutenzioniCreate:
      type: object
      required:
        - 'manut_data_segnalazione'
      properties:
        'hotel_id':
          type: integer
          format: int32
        'manut_priorita':
          type: string
          maxLength: 10
        'manut_area_guasto':
          type: string
          maxLength: 10
        'manut_piano':
          type: string
          nullable: true
          maxLength: 10
        'manut_camera':
          type: string
          nullable: true
          maxLength: 10
        'manut_descrizione':
          type: string
          nullable: true
          maxLength: 4294967295
        'manut_data_segnalazione':
          type: string
          format: date
        'manut_stato':
          type: string
          maxLength: 2
    ManutenzioniUpdate:
      type: object
      required:
        - 'manut_data_segnalazione'
      properties:
        'hotel_id':
          type: integer
          format: int32
        'manut_priorita':
          type: string
          maxLength: 10
        'manut_area_guasto':
          type: string
          maxLength: 10
        'manut_piano':
          type: string
          nullable: true
          maxLength: 10
        'manut_camera':
          type: string
          nullable: true
          maxLength: 10
        'manut_descrizione':
          type: string
          nullable: true
          maxLength: 4294967295
        'manut_data_segnalazione':
          type: string
          format: date
        'manut_stato':
          type: string
          maxLength: 2
    ManutenzioniPatch:
      type: object
      properties:
        'hotel_id':
          type: integer
          format: int32
        'manut_priorita':
          type: string
          maxLength: 10
        'manut_area_guasto':
          type: string
          maxLength: 10
        'manut_piano':
          type: string
          nullable: true
          maxLength: 10
        'manut_camera':
          type: string
          nullable: true
          maxLength: 10
        'manut_descrizione':
          type: string
          nullable: true
          maxLength: 4294967295
        'manut_data_segnalazione':
          type: string
          format: date
        'manut_stato':
          type: string
          maxLength: 2
    ManutenzioniListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ManutenzioniRead'
        meta: { type: object }
        links: { type: object }
    ManutenzioniCreatedResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            'manutenzione_id':
              type: integer
              format: int32
        meta: { type: object }
        links: { type: object }
