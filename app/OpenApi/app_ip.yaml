openapi: 3.0.3
info:
  title: 'app_ip API'
  version: 1.0.0
paths:
  /api/v1/app_ip:
    get:
      summary: 'Elenco app_ip'
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: 'filter[app_ip_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: sort
          in: query
          schema: { type: string, enum: ['app_ip_id'] }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: Elenco paginato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppIpListResponse'
    post:
      summary: Crea record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppIpCreate'
      responses:
        '201':
          description: Record creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppIpCreatedResponse'
        '422': { description: Errore di validazione }
  /api/v1/app_ip/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Dettaglio record
      responses:
        '200':
          description: Record trovato
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AppIpRead'
        '404': { description: Record non trovato }
    put:
      summary: Aggiornamento completo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppIpUpdate'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    patch:
      summary: Aggiornamento parziale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppIpPatch'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    delete:
      summary: Elimina record
      responses:
        '204': { description: Record eliminato }
components:
  schemas:
    AppIpRead:
      type: object
      properties:
        'app_ip_id':
          type: integer
          format: int32
        'ip_aderss':
          type: string
          maxLength: 200
        'Livello':
          type: integer
          format: int32
        'data':
          type: string
          format: date-time
    AppIpCreate:
      type: object
      required:
        - 'ip_aderss'
        - 'Livello'
      properties:
        'ip_aderss':
          type: string
          maxLength: 200
        'Livello':
          type: integer
          format: int32
        'data':
          type: string
          format: date-time
    AppIpUpdate:
      type: object
      required:
        - 'ip_aderss'
        - 'Livello'
      properties:
        'ip_aderss':
          type: string
          maxLength: 200
        'Livello':
          type: integer
          format: int32
        'data':
          type: string
          format: date-time
    AppIpPatch:
      type: object
      properties:
        'ip_aderss':
          type: string
          maxLength: 200
        'Livello':
          type: integer
          format: int32
        'data':
          type: string
          format: date-time
    AppIpListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AppIpRead'
        meta: { type: object }
        links: { type: object }
    AppIpCreatedResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            'app_ip_id':
              type: integer
              format: int32
        meta: { type: object }
        links: { type: object }
