openapi: 3.0.3
info:
  title: 'adebiti API'
  version: 1.0.0
paths:
  /api/v1/adebiti:
    get:
      summary: 'Elenco adebiti'
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: 'filter[adebito_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[conto_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[hotel_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[prodotto_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: sort
          in: query
          schema: { type: string, enum: ['adebito_id', 'conto_id', 'hotel_id', 'prodotto_id'] }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: Elenco paginato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdebitiListResponse'
    post:
      summary: Crea record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdebitiCreate'
      responses:
        '201':
          description: Record creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdebitiCreatedResponse'
        '422': { description: Errore di validazione }
  /api/v1/adebiti/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Dettaglio record
      responses:
        '200':
          description: Record trovato
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AdebitiRead'
        '404': { description: Record non trovato }
    put:
      summary: Aggiornamento completo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdebitiUpdate'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    patch:
      summary: Aggiornamento parziale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdebitiPatch'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    delete:
      summary: Elimina record
      responses:
        '204': { description: Record eliminato }
components:
  schemas:
    AdebitiRead:
      type: object
      properties:
        'adebito_id':
          type: integer
          format: int32
        'conto_id':
          type: integer
          format: int32
        'hotel_id':
          type: integer
          format: int32
        'prodotto_id':
          type: integer
          format: int32
        'descrizione':
          type: string
          maxLength: 100
        'prezzo':
          type: number
          format: double
        'quantita':
          type: integer
          format: int32
        'adebiti_utente_id':
          type: integer
          format: int32
          nullable: true
        'preno_id':
          type: integer
          format: int32
          nullable: true
        'prodotti__prodotto_id__label':
          type: string
          nullable: true
    AdebitiCreate:
      type: object
      required:
        - 'conto_id'
        - 'hotel_id'
        - 'prodotto_id'
        - 'prezzo'
        - 'quantita'
      properties:
        'conto_id':
          type: integer
          format: int32
        'hotel_id':
          type: integer
          format: int32
        'prodotto_id':
          type: integer
          format: int32
        'descrizione':
          type: string
          maxLength: 100
        'prezzo':
          type: number
          format: double
        'quantita':
          type: integer
          format: int32
        'adebiti_utente_id':
          type: integer
          format: int32
          nullable: true
        'preno_id':
          type: integer
          format: int32
          nullable: true
    AdebitiUpdate:
      type: object
      required:
        - 'conto_id'
        - 'hotel_id'
        - 'prodotto_id'
        - 'prezzo'
        - 'quantita'
      properties:
        'conto_id':
          type: integer
          format: int32
        'hotel_id':
          type: integer
          format: int32
        'prodotto_id':
          type: integer
          format: int32
        'descrizione':
          type: string
          maxLength: 100
        'prezzo':
          type: number
          format: double
        'quantita':
          type: integer
          format: int32
        'adebiti_utente_id':
          type: integer
          format: int32
          nullable: true
        'preno_id':
          type: integer
          format: int32
          nullable: true
    AdebitiPatch:
      type: object
      properties:
        'conto_id':
          type: integer
          format: int32
        'hotel_id':
          type: integer
          format: int32
        'prodotto_id':
          type: integer
          format: int32
        'descrizione':
          type: string
          maxLength: 100
        'prezzo':
          type: number
          format: double
        'quantita':
          type: integer
          format: int32
        'adebiti_utente_id':
          type: integer
          format: int32
          nullable: true
        'preno_id':
          type: integer
          format: int32
          nullable: true
    AdebitiListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdebitiRead'
        meta: { type: object }
        links: { type: object }
    AdebitiCreatedResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            'adebito_id':
              type: integer
              format: int32
        meta: { type: object }
        links: { type: object }
