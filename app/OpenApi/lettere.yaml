        'es':
          type: string
          maxLength: 4294967295
        'fr':
          type: string
          maxLength: 4294967295
        'de':
          type: string
          maxLength: 4294967295
        'data_stamp':
          type: string
          format: date-time
    LetterePatch:
      type: object
