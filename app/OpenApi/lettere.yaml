        'contoller':
          type: string
          maxLength: 100
        'en':
          type: string
          maxLength: 4294967295
        'it':
          type: string
          maxLength: 4294967295
        'es':
          type: string
          maxLength: 4294967295
        'fr':
          type: string
          maxLength: 4294967295
        'de':
          type: string
          maxLength: 4294967295
        'data_stamp':
          type: string
          format: date-time
    LettereUpdate:
      type: object
      required:
        - 'etichetta'
        - 'hotel_id'
        - 'titolo'
        - 'reparto'
        - 'contoller'
        - 'en'
        - 'it'
        - 'es'
        - 'fr'
        - 'de'
      properties:
        'etichetta':
          type: string
          maxLength: 50
        'hotel_id':
