openapi: 3.0.3
info:
  title: 'lettere API'
  version: 1.0.0
paths:
  /api/v1/lettere:
    get:
      summary: 'Elenco lettere'
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: 'filter[lettere_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[etichetta]'
          in: query
          schema:
            type: string
        - name: 'filter[reparto]'
          in: query
          schema:
            type: string
        - name: sort
          in: query
          schema: { type: string, enum: ['lettere_id', 'etichetta', 'reparto'] }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: Elenco paginato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LettereListResponse'
    post:
      summary: Crea record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LettereCreate'
      responses:
        '201':
          description: Record creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LettereCreatedResponse'
        '422': { description: Errore di validazione }
  /api/v1/lettere/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Dettaglio record
      responses:
        '200':
          description: Record trovato
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/LettereRead'
        '404': { description: Record non trovato }
    put:
      summary: Aggiornamento completo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LettereUpdate'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    patch:
      summary: Aggiornamento parziale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LetterePatch'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    delete:
      summary: Elimina record
      responses:
        '204': { description: Record eliminato }
components:
  schemas:
    LettereRead:
      type: object
      properties:
        'lettere_id':
          type: integer
          format: int32
        'etichetta':
          type: string
          maxLength: 50
        'hotel_id':
          type: integer
          format: int32
        'titolo':
          type: string
          maxLength: 100
        'reparto':
          type: string
          maxLength: 50
        'contoller':
          type: string
          maxLength: 100
        'en':
          type: string
          maxLength: 4294967295
        'it':
          type: string
          maxLength: 4294967295
        'es':
          type: string
          maxLength: 4294967295
        'fr':
          type: string
          maxLength: 4294967295
        'de':
          type: string
          maxLength: 4294967295
        'data_stamp':
          type: string
          format: date-time
    LettereCreate:
      type: object
      required:
        - 'etichetta'
        - 'hotel_id'
        - 'titolo'
        - 'reparto'
        - 'contoller'
        - 'en'
        - 'it'
        - 'es'
        - 'fr'
        - 'de'
      properties:
        'etichetta':
          type: string
          maxLength: 50
        'hotel_id':
          type: integer
          format: int32
        'titolo':
