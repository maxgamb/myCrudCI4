openapi: 3.0.3
info:
  title: 'log_in API'
  version: 1.0.0
paths:
  /api/v1/log_in:
    get:
      summary: 'Elenco log_in'
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: 'filter[log_in_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: sort
          in: query
          schema: { type: string, enum: ['log_in_id'] }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: Elenco paginato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogInListResponse'
    post:
      summary: Crea record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogInCreate'
      responses:
        '201':
          description: Record creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogInCreatedResponse'
        '422': { description: Errore di validazione }
  /api/v1/log_in/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Dettaglio record
      responses:
        '200':
          description: Record trovato
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/LogInRead'
        '404': { description: Record non trovato }
    put:
      summary: Aggiornamento completo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogInUpdate'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    patch:
      summary: Aggiornamento parziale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogInPatch'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    delete:
      summary: Elimina record
      responses:
        '204': { description: Record eliminato }
components:
  schemas:
    LogInRead:
      type: object
      properties:
        'log_in_id':
          type: integer
          format: int32
        'log_nome':
          type: string
          nullable: true
          maxLength: 250
        'log_pass':
          type: string
          nullable: true
          maxLength: 250
        'log_ip':
          type: string
          nullable: true
          maxLength: 250
        'log_out':
          type: string
          nullable: true
          maxLength: 250
        'log_time':
          type: string
          format: date-time
    LogInCreate:
      type: object
      properties:
        'log_nome':
          type: string
          nullable: true
          maxLength: 250
        'log_pass':
          type: string
          nullable: true
          maxLength: 250
        'log_ip':
          type: string
          nullable: true
          maxLength: 250
        'log_out':
          type: string
          nullable: true
          maxLength: 250
        'log_time':
          type: string
          format: date-time
    LogInUpdate:
      type: object
      properties:
        'log_nome':
          type: string
          nullable: true
          maxLength: 250
        'log_pass':
          type: string
          nullable: true
          maxLength: 250
        'log_ip':
          type: string
          nullable: true
          maxLength: 250
        'log_out':
          type: string
          nullable: true
          maxLength: 250
        'log_time':
          type: string
          format: date-time
    LogInPatch:
      type: object
      properties:
        'log_nome':
          type: string
          nullable: true
          maxLength: 250
        'log_pass':
          type: string
          nullable: true
          maxLength: 250
        'log_ip':
          type: string
          nullable: true
          maxLength: 250
        'log_out':
          type: string
          nullable: true
          maxLength: 250
        'log_time':
          type: string
          format: date-time
    LogInListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/LogInRead'
        meta: { type: object }
        links: { type: object }
    LogInCreatedResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            'log_in_id':
              type: integer
              format: int32
        meta: { type: object }
        links: { type: object }
