openapi: 3.0.3
info:
  title: 'wreh_suppliers API'
  version: 1.0.0
paths:
  /api/v1/wreh_suppliers:
    get:
      summary: 'Elenco wreh_suppliers'
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: 'filter[supplier_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: sort
          in: query
          schema: { type: string, enum: ['supplier_id'] }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: Elenco paginato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WrehSuppliersListResponse'
    post:
      summary: Crea record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WrehSuppliersCreate'
      responses:
        '201':
          description: Record creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WrehSuppliersCreatedResponse'
        '422': { description: Errore di validazione }
  /api/v1/wreh_suppliers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Dettaglio record
      responses:
        '200':
          description: Record trovato
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/WrehSuppliersRead'
        '404': { description: Record non trovato }
    put:
      summary: Aggiornamento completo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WrehSuppliersUpdate'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    patch:
      summary: Aggiornamento parziale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WrehSuppliersPatch'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    delete:
      summary: Elimina record
      responses:
        '204': { description: Record eliminato }
components:
  schemas:
    WrehSuppliersRead:
      type: object
      properties:
        'supplier_id':
          type: integer
          format: int32
        'company':
          type: string
          maxLength: 255
        'contact_name':
          type: string
          nullable: true
          maxLength: 255
        'phone':
          type: string
          nullable: true
          maxLength: 50
        'email':
          type: string
          maxLength: 50
        'address':
          type: string
          nullable: true
          maxLength: 65535
        'utente_id':
          type: integer
          format: int32
          nullable: true
    WrehSuppliersCreate:
      type: object
      required:
        - 'company'
        - 'email'
      properties:
        'company':
          type: string
          maxLength: 255
        'contact_name':
          type: string
          nullable: true
          maxLength: 255
        'phone':
          type: string
          nullable: true
          maxLength: 50
        'email':
          type: string
          maxLength: 50
        'address':
          type: string
          nullable: true
          maxLength: 65535
        'utente_id':
          type: integer
          format: int32
          nullable: true
    WrehSuppliersUpdate:
      type: object
      required:
        - 'company'
        - 'email'
      properties:
        'company':
          type: string
          maxLength: 255
        'contact_name':
          type: string
          nullable: true
          maxLength: 255
        'phone':
          type: string
          nullable: true
          maxLength: 50
        'email':
          type: string
          maxLength: 50
        'address':
          type: string
          nullable: true
          maxLength: 65535
        'utente_id':
          type: integer
          format: int32
          nullable: true
    WrehSuppliersPatch:
      type: object
      properties:
        'company':
          type: string
          maxLength: 255
        'contact_name':
          type: string
          nullable: true
          maxLength: 255
        'phone':
          type: string
          nullable: true
          maxLength: 50
        'email':
          type: string
          maxLength: 50
        'address':
          type: string
          nullable: true
          maxLength: 65535
        'utente_id':
          type: integer
          format: int32
          nullable: true
    WrehSuppliersListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WrehSuppliersRead'
        meta: { type: object }
        links: { type: object }
    WrehSuppliersCreatedResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            'supplier_id':
              type: integer
              format: int32
        meta: { type: object }
        links: { type: object }
