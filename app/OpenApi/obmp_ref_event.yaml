openapi: 3.0.3
info:
  title: 'obmp_ref_event API'
  version: 1.0.0
paths:
  /api/v1/obmp_ref_event:
    get:
      summary: 'Elenco obmp_ref_event'
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: 'filter[ref_event_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[ref_site_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[hotel_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[listino_nome_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[agenzia_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: sort
          in: query
          schema: { type: string, enum: ['ref_event_id', 'ref_site_id', 'hotel_id', 'listino_nome_id', 'agenzia_id'] }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: Elenco paginato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObmpRefEventListResponse'
    post:
      summary: Crea record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObmpRefEventCreate'
      responses:
        '201':
          description: Record creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObmpRefEventCreatedResponse'
        '422': { description: Errore di validazione }
  /api/v1/obmp_ref_event/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Dettaglio record
      responses:
        '200':
          description: Record trovato
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ObmpRefEventRead'
        '404': { description: Record non trovato }
    put:
      summary: Aggiornamento completo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObmpRefEventUpdate'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    patch:
      summary: Aggiornamento parziale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObmpRefEventPatch'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    delete:
      summary: Elimina record
      responses:
        '204': { description: Record eliminato }
components:
  schemas:
    ObmpRefEventRead:
      type: object
      properties:
        'ref_event_id':
          type: integer
          format: int32
        'ref_site_id':
          type: integer
          format: int32
        'hotel_id':
          type: integer
          format: int32
        'listino_nome_id':
          type: integer
          format: int32
        'agenzia_id':
          type: integer
          format: int32
          nullable: true
        'ref_event_nome':
          type: string
          nullable: true
          maxLength: 250
        'event_dal':
          type: string
          format: date
        'event_al':
          type: string
          format: date
        'ref_event_note':
          type: string
          nullable: true
          maxLength: 250
        'agenzie__agenzia_id__label':
          type: string
          nullable: true
        'listino_nome_obmp__listino_nome_id__label':
          type: string
          nullable: true
        'obmp_ref_site__ref_site_id__label':
          type: string
          nullable: true
    ObmpRefEventCreate:
      type: object
      required:
        - 'event_dal'
        - 'event_al'
      properties:
        'ref_site_id':
          type: integer
          format: int32
        'hotel_id':
          type: integer
          format: int32
        'listino_nome_id':
          type: integer
          format: int32
        'agenzia_id':
          type: integer
          format: int32
          nullable: true
        'ref_event_nome':
          type: string
          nullable: true
          maxLength: 250
        'event_dal':
          type: string
          format: date
        'event_al':
          type: string
          format: date
        'ref_event_note':
          type: string
          nullable: true
          maxLength: 250
    ObmpRefEventUpdate:
      type: object
      required:
        - 'event_dal'
        - 'event_al'
      properties:
        'ref_site_id':
          type: integer
          format: int32
        'hotel_id':
          type: integer
          format: int32
        'listino_nome_id':
          type: integer
          format: int32
        'agenzia_id':
          type: integer
          format: int32
          nullable: true
        'ref_event_nome':
          type: string
          nullable: true
          maxLength: 250
        'event_dal':
          type: string
          format: date
        'event_al':
          type: string
          format: date
        'ref_event_note':
          type: string
          nullable: true
          maxLength: 250
    ObmpRefEventPatch:
      type: object
      properties:
        'ref_site_id':
          type: integer
          format: int32
        'hotel_id':
          type: integer
          format: int32
        'listino_nome_id':
          type: integer
          format: int32
        'agenzia_id':
          type: integer
          format: int32
          nullable: true
        'ref_event_nome':
          type: string
          nullable: true
          maxLength: 250
        'event_dal':
          type: string
          format: date
        'event_al':
          type: string
          format: date
        'ref_event_note':
          type: string
          nullable: true
          maxLength: 250
    ObmpRefEventListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ObmpRefEventRead'
        meta: { type: object }
        links: { type: object }
    ObmpRefEventCreatedResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            'ref_event_id':
              type: integer
              format: int32
        meta: { type: object }
        links: { type: object }
