openapi: 3.0.3
info:
  title: 'question_rew API'
  version: 1.0.0
paths:
  /api/v1/question_rew:
    get:
      summary: 'Elenco question_rew'
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: 'filter[question_rew_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[question_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: sort
          in: query
          schema: { type: string, enum: ['question_rew_id', 'question_id'] }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: Elenco paginato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionRewListResponse'
    post:
      summary: Crea record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionRewCreate'
      responses:
        '201':
          description: Record creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionRewCreatedResponse'
        '422': { description: Errore di validazione }
  /api/v1/question_rew/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Dettaglio record
      responses:
        '200':
          description: Record trovato
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/QuestionRewRead'
        '404': { description: Record non trovato }
    put:
      summary: Aggiornamento completo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionRewUpdate'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    patch:
      summary: Aggiornamento parziale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionRewPatch'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    delete:
      summary: Elimina record
      responses:
        '204': { description: Record eliminato }
components:
  schemas:
    QuestionRewRead:
      type: object
      properties:
        'question_rew_id':
          type: integer
          format: int32
        'question_id':
          type: integer
          format: int32
          nullable: true
        'hotel_id':
          type: integer
          format: int32
          nullable: true
        'conto_id':
          type: integer
          format: int32
          nullable: true
        'clienti_id':
          type: integer
          format: int32
          nullable: true
        'valore':
          type: string
          nullable: true
          maxLength: 45
        'data':
          type: string
          format: date-time
          nullable: true
        'question__question_id__label':
          type: string
          nullable: true
    QuestionRewCreate:
      type: object
      properties:
        'question_id':
          type: integer
          format: int32
          nullable: true
        'hotel_id':
          type: integer
          format: int32
          nullable: true
        'conto_id':
          type: integer
          format: int32
          nullable: true
        'clienti_id':
          type: integer
          format: int32
          nullable: true
        'valore':
          type: string
          nullable: true
          maxLength: 45
        'data':
          type: string
          format: date-time
          nullable: true
    QuestionRewUpdate:
      type: object
      properties:
        'question_id':
          type: integer
          format: int32
          nullable: true
        'hotel_id':
          type: integer
          format: int32
          nullable: true
        'conto_id':
          type: integer
          format: int32
          nullable: true
        'clienti_id':
          type: integer
          format: int32
          nullable: true
        'valore':
          type: string
          nullable: true
          maxLength: 45
        'data':
          type: string
          format: date-time
          nullable: true
    QuestionRewPatch:
      type: object
      properties:
        'question_id':
          type: integer
          format: int32
          nullable: true
        'hotel_id':
          type: integer
          format: int32
          nullable: true
        'conto_id':
          type: integer
          format: int32
          nullable: true
        'clienti_id':
          type: integer
          format: int32
          nullable: true
        'valore':
          type: string
          nullable: true
          maxLength: 45
        'data':
          type: string
          format: date-time
          nullable: true
    QuestionRewListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/QuestionRewRead'
        meta: { type: object }
        links: { type: object }
    QuestionRewCreatedResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            'question_rew_id':
              type: integer
              format: int32
        meta: { type: object }
        links: { type: object }
