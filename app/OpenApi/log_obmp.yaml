      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: 'filter[log_obmp_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[preno_dal]'
          in: query
          schema:
            type: string
            format: date
        - name: 'filter[preno_al]'
          in: query
          schema:
            type: string
            format: date
        - name: 'filter[hotel_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[ref_site]'
          in: query
          schema:
            type: string
        - name: 'filter[ref_agency]'
          in: query
          schema:
            type: string
        - name: 'filter[ref_event]'
          in: query
          schema:
            type: string
        - name: 'filter[ref_session]'
          in: query
          schema:
            type: string
        - name: 'filter[ref_cookie]'
          in: query
          schema:
            type: string
        - name: sort
          in: query
          schema: { type: string, enum: ['log_obmp_id', 'preno_dal', 'preno_al', 'hotel_id', 'ref_site', 'ref_agency', 'ref_event', 'ref_session', 'ref_cookie'] }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: Elenco paginato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogObmpListResponse'
    post:
      summary: Crea record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogObmpCreate'
      responses:
        '201':
          description: Record creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogObmpCreatedResponse'
        '422': { description: Errore di validazione }
  /api/v1/log_obmp/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Dettaglio record
      responses:
        '200':
          description: Record trovato
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/LogObmpRead'
        '404': { description: Record non trovato }
    put:
      summary: Aggiornamento completo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogObmpUpdate'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    patch:
      summary: Aggiornamento parziale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogObmpPatch'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    delete:
      summary: Elimina record
      responses:
        '204': { description: Record eliminato }
