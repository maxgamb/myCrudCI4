openapi: 3.0.3
info:
  title: 'pratiche API'
  version: 1.0.0
paths:
  /api/v1/pratiche:
    get:
      summary: 'Elenco pratiche'
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: 'filter[pratica_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[hotel_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[pratica_agenzia_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: sort
          in: query
          schema: { type: string, enum: ['pratica_id', 'hotel_id', 'pratica_agenzia_id'] }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: Elenco paginato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PraticheListResponse'
    post:
      summary: Crea record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PraticheCreate'
      responses:
        '201':
          description: Record creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PraticheCreatedResponse'
        '422': { description: Errore di validazione }
  /api/v1/pratiche/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Dettaglio record
      responses:
        '200':
          description: Record trovato
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PraticheRead'
        '404': { description: Record non trovato }
    put:
      summary: Aggiornamento completo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PraticheUpdate'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    patch:
      summary: Aggiornamento parziale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PratichePatch'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    delete:
      summary: Elimina record
      responses:
        '204': { description: Record eliminato }
components:
  schemas:
    PraticheRead:
      type: object
      properties:
        'pratica_id':
          type: integer
          format: int32
        'hotel_id':
          type: integer
          format: int32
        'pratica_nome':
          type: string
          maxLength: 250
        'pratica_agenzia_id':
          type: integer
          format: int32
          nullable: true
        'pratica_1':
          type: string
          nullable: true
          maxLength: 50
        'pratica_2':
          type: string
          nullable: true
          maxLength: 50
        'pratica_note':
          type: string
          nullable: true
          maxLength: 4294967295
        'pratica_stato':
          type: integer
          format: int32
        'pratiche_utente_id':
          type: integer
          format: int32
          nullable: true
        'agenzie_agenzia_tipologia':
          type: string
          nullable: true
    PraticheCreate:
      type: object
      properties:
        'hotel_id':
          type: integer
          format: int32
        'pratica_nome':
          type: string
          maxLength: 250
        'pratica_agenzia_id':
          type: integer
          format: int32
          nullable: true
        'pratica_1':
          type: string
          nullable: true
          maxLength: 50
        'pratica_2':
          type: string
          nullable: true
          maxLength: 50
        'pratica_note':
          type: string
          nullable: true
          maxLength: 4294967295
        'pratica_stato':
          type: integer
          format: int32
        'pratiche_utente_id':
          type: integer
          format: int32
          nullable: true
    PraticheUpdate:
      type: object
      properties:
        'hotel_id':
          type: integer
          format: int32
        'pratica_nome':
          type: string
          maxLength: 250
        'pratica_agenzia_id':
          type: integer
          format: int32
          nullable: true
        'pratica_1':
          type: string
          nullable: true
          maxLength: 50
        'pratica_2':
          type: string
          nullable: true
          maxLength: 50
        'pratica_note':
          type: string
          nullable: true
          maxLength: 4294967295
        'pratica_stato':
          type: integer
          format: int32
        'pratiche_utente_id':
          type: integer
          format: int32
          nullable: true
    PratichePatch:
      type: object
      properties:
        'hotel_id':
          type: integer
          format: int32
        'pratica_nome':
          type: string
          maxLength: 250
        'pratica_agenzia_id':
          type: integer
          format: int32
          nullable: true
        'pratica_1':
          type: string
          nullable: true
          maxLength: 50
        'pratica_2':
          type: string
          nullable: true
          maxLength: 50
        'pratica_note':
          type: string
          nullable: true
          maxLength: 4294967295
        'pratica_stato':
          type: integer
          format: int32
        'pratiche_utente_id':
          type: integer
          format: int32
          nullable: true
    PraticheListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PraticheRead'
        meta: { type: object }
        links: { type: object }
    PraticheCreatedResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            'pratica_id':
              type: integer
              format: int32
        meta: { type: object }
        links: { type: object }
