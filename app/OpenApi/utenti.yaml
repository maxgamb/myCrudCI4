openapi: 3.0.3
info:
  title: 'utenti API'
  version: 1.0.0
paths:
  /api/v1/utenti:
    get:
      summary: 'Elenco utenti'
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: 'filter[Utente_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[staff_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[hotel_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: sort
          in: query
          schema: { type: string, enum: ['Utente_id', 'staff_id', 'hotel_id'] }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: Elenco paginato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UtentiListResponse'
    post:
      summary: Crea record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UtentiCreate'
      responses:
        '201':
          description: Record creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UtentiCreatedResponse'
        '422': { description: Errore di validazione }
  /api/v1/utenti/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Dettaglio record
      responses:
        '200':
          description: Record trovato
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/UtentiRead'
        '404': { description: Record non trovato }
    put:
      summary: Aggiornamento completo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UtentiUpdate'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    patch:
      summary: Aggiornamento parziale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UtentiPatch'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    delete:
      summary: Elimina record
      responses:
        '204': { description: Record eliminato }
components:
  schemas:
    UtentiRead:
      type: object
      properties:
        'Utente_id':
          type: integer
          format: int32
        'staff_id':
          type: integer
          format: int32
          nullable: true
        'Nome_Utente':
          type: string
          maxLength: 50
        'Pass_Utente':
          type: string
          maxLength: 50
        'Email_Utente':
          type: string
          nullable: true
          maxLength: 50
        'hotel_id':
          type: integer
          format: int32
        'utenti_livello':
          type: integer
          format: int32
        'utenti_Utente_id':
          type: integer
          format: int32
        'staff__staff_id__label':
          type: string
          nullable: true
    UtentiCreate:
      type: object
      required:
        - 'utenti_Utente_id'
      properties:
        'staff_id':
          type: integer
          format: int32
          nullable: true
        'Nome_Utente':
          type: string
          maxLength: 50
        'Pass_Utente':
          type: string
          maxLength: 50
        'Email_Utente':
          type: string
          nullable: true
          maxLength: 50
        'hotel_id':
          type: integer
          format: int32
        'utenti_livello':
          type: integer
          format: int32
        'utenti_Utente_id':
          type: integer
          format: int32
    UtentiUpdate:
      type: object
      required:
        - 'utenti_Utente_id'
      properties:
        'staff_id':
          type: integer
          format: int32
          nullable: true
        'Nome_Utente':
          type: string
          maxLength: 50
        'Pass_Utente':
          type: string
          maxLength: 50
        'Email_Utente':
          type: string
          nullable: true
          maxLength: 50
        'hotel_id':
          type: integer
          format: int32
        'utenti_livello':
          type: integer
          format: int32
        'utenti_Utente_id':
          type: integer
          format: int32
    UtentiPatch:
      type: object
      properties:
        'staff_id':
          type: integer
          format: int32
          nullable: true
        'Nome_Utente':
          type: string
          maxLength: 50
        'Pass_Utente':
          type: string
          maxLength: 50
        'Email_Utente':
          type: string
          nullable: true
          maxLength: 50
        'hotel_id':
          type: integer
          format: int32
        'utenti_livello':
          type: integer
          format: int32
        'utenti_Utente_id':
          type: integer
          format: int32
    UtentiListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/UtentiRead'
        meta: { type: object }
        links: { type: object }
    UtentiCreatedResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            'Utente_id':
              type: integer
              format: int32
        meta: { type: object }
        links: { type: object }
