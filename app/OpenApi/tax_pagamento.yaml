openapi: 3.0.3
info:
  title: 'tax_pagamento API'
  version: 1.0.0
paths:
  /api/v1/tax_pagamento:
    get:
      summary: 'Elenco tax_pagamento'
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: 'filter[tax_pagamento_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[hotel_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[conto_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[pratica_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[importo]'
          in: query
          schema:
            type: number
            format: double
        - name: 'filter[data_pagamento]'
          in: query
          schema:
            type: string
            format: date
        - name: sort
          in: query
          schema: { type: string, enum: ['tax_pagamento_id', 'hotel_id', 'conto_id', 'pratica_id', 'importo', 'data_pagamento'] }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: Elenco paginato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxPagamentoListResponse'
    post:
      summary: Crea record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaxPagamentoCreate'
      responses:
        '201':
          description: Record creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxPagamentoCreatedResponse'
        '422': { description: Errore di validazione }
  /api/v1/tax_pagamento/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Dettaglio record
      responses:
        '200':
          description: Record trovato
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/TaxPagamentoRead'
        '404': { description: Record non trovato }
    put:
      summary: Aggiornamento completo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaxPagamentoUpdate'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    patch:
      summary: Aggiornamento parziale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaxPagamentoPatch'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    delete:
      summary: Elimina record
      responses:
        '204': { description: Record eliminato }
components:
  schemas:
    TaxPagamentoRead:
      type: object
      properties:
        'tax_pagamento_id':
          type: integer
          format: int32
        'hotel_id':
          type: integer
          format: int32
        'conto_id':
          type: integer
          format: int32
          nullable: true
        'pratica_id':
          type: integer
          format: int32
          nullable: true
        'importo':
          type: number
          format: double
          nullable: true
        'pagamento_forma':
          type: string
          maxLength: 5
        'tassa_stato':
          type: integer
          format: int32
        'data_pagamento':
          type: string
          format: date
        'tax_pagamento_utente_id':
          type: integer
          format: int32
          nullable: true
        'conti__conto_id__label':
          type: string
          nullable: true
    TaxPagamentoCreate:
      type: object
      required:
        - 'hotel_id'
        - 'pagamento_forma'
        - 'tassa_stato'
        - 'data_pagamento'
      properties:
        'hotel_id':
          type: integer
          format: int32
        'conto_id':
          type: integer
          format: int32
          nullable: true
        'pratica_id':
          type: integer
          format: int32
          nullable: true
        'importo':
          type: number
          format: double
          nullable: true
        'pagamento_forma':
          type: string
          maxLength: 5
        'tassa_stato':
          type: integer
          format: int32
        'data_pagamento':
          type: string
          format: date
        'tax_pagamento_utente_id':
          type: integer
          format: int32
          nullable: true
    TaxPagamentoUpdate:
      type: object
      required:
        - 'hotel_id'
        - 'pagamento_forma'
        - 'tassa_stato'
        - 'data_pagamento'
      properties:
        'hotel_id':
          type: integer
          format: int32
        'conto_id':
          type: integer
          format: int32
          nullable: true
        'pratica_id':
          type: integer
          format: int32
          nullable: true
        'importo':
          type: number
          format: double
          nullable: true
        'pagamento_forma':
          type: string
          maxLength: 5
        'tassa_stato':
          type: integer
          format: int32
        'data_pagamento':
          type: string
          format: date
        'tax_pagamento_utente_id':
          type: integer
          format: int32
          nullable: true
    TaxPagamentoPatch:
      type: object
      properties:
        'hotel_id':
          type: integer
          format: int32
        'conto_id':
          type: integer
          format: int32
          nullable: true
        'pratica_id':
          type: integer
          format: int32
          nullable: true
        'importo':
          type: number
          format: double
          nullable: true
        'pagamento_forma':
          type: string
          maxLength: 5
        'tassa_stato':
          type: integer
          format: int32
        'data_pagamento':
          type: string
          format: date
        'tax_pagamento_utente_id':
          type: integer
          format: int32
          nullable: true
    TaxPagamentoListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TaxPagamentoRead'
        meta: { type: object }
        links: { type: object }
    TaxPagamentoCreatedResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            'tax_pagamento_id':
              type: integer
              format: int32
        meta: { type: object }
        links: { type: object }
