openapi: 3.0.3
info:
  title: 'modifica_agenda API'
  version: 1.0.0
paths:
  /api/v1/modifica_agenda:
    get:
      summary: 'Elenco modifica_agenda'
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: 'filter[mod_agenda_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[mod_preno_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: sort
          in: query
          schema: { type: string, enum: ['mod_agenda_id', 'mod_preno_id'] }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: Elenco paginato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModificaAgendaListResponse'
    post:
      summary: Crea record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModificaAgendaCreate'
      responses:
        '201':
          description: Record creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModificaAgendaCreatedResponse'
        '422': { description: Errore di validazione }
  /api/v1/modifica_agenda/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Dettaglio record
      responses:
        '200':
          description: Record trovato
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ModificaAgendaRead'
        '404': { description: Record non trovato }
    put:
      summary: Aggiornamento completo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModificaAgendaUpdate'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    patch:
      summary: Aggiornamento parziale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModificaAgendaPatch'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    delete:
      summary: Elimina record
      responses:
        '204': { description: Record eliminato }
components:
  schemas:
    ModificaAgendaRead:
      type: object
      properties:
        'mod_agenda_id':
          type: integer
          format: int32
        'mod_preno_id':
          type: integer
          format: int32
        'mod_agenda_valori':
          type: string
          maxLength: 4294967295
        'mod_preno_data_records':
          type: string
          format: date-time
        'modifica_agenda_adebiti_utente_id':
          type: integer
          format: int32
          nullable: true
        'agenda__mod_agenda_id__label':
          type: string
          nullable: true
    ModificaAgendaCreate:
      type: object
      required:
        - 'mod_agenda_valori'
      properties:
        'mod_preno_id':
          type: integer
          format: int32
        'mod_agenda_valori':
          type: string
          maxLength: 4294967295
        'mod_preno_data_records':
          type: string
          format: date-time
        'modifica_agenda_adebiti_utente_id':
          type: integer
          format: int32
          nullable: true
    ModificaAgendaUpdate:
      type: object
      required:
        - 'mod_agenda_valori'
      properties:
        'mod_preno_id':
          type: integer
          format: int32
        'mod_agenda_valori':
          type: string
          maxLength: 4294967295
        'mod_preno_data_records':
          type: string
          format: date-time
        'modifica_agenda_adebiti_utente_id':
          type: integer
          format: int32
          nullable: true
    ModificaAgendaPatch:
      type: object
      properties:
        'mod_preno_id':
          type: integer
          format: int32
        'mod_agenda_valori':
          type: string
          maxLength: 4294967295
        'mod_preno_data_records':
          type: string
          format: date-time
        'modifica_agenda_adebiti_utente_id':
          type: integer
          format: int32
          nullable: true
    ModificaAgendaListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ModificaAgendaRead'
        meta: { type: object }
        links: { type: object }
    ModificaAgendaCreatedResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            'mod_agenda_id':
              type: integer
              format: int32
        meta: { type: object }
        links: { type: object }
