openapi: 3.0.3
info:
  title: 'sospesi API'
  version: 1.0.0
paths:
  /api/v1/sospesi:
    get:
      summary: 'Elenco sospesi'
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: 'filter[sospeso_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[hotel_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[pagamento_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[sospeso_data]'
          in: query
          schema:
            type: string
            format: date
        - name: 'filter[sospeso_conto_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[sospeso_pratica_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[sopeso_societa]'
          in: query
          schema:
            type: integer
            format: int32
        - name: sort
          in: query
          schema: { type: string, enum: ['sospeso_id', 'hotel_id', 'pagamento_id', 'sospeso_data', 'sospeso_conto_id', 'sospeso_pratica_id', 'sopeso_societa'] }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: Elenco paginato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SospesiListResponse'
    post:
      summary: Crea record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SospesiCreate'
      responses:
        '201':
          description: Record creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SospesiCreatedResponse'
        '422': { description: Errore di validazione }
  /api/v1/sospesi/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Dettaglio record
      responses:
        '200':
          description: Record trovato
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/SospesiRead'
        '404': { description: Record non trovato }
    put:
      summary: Aggiornamento completo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SospesiUpdate'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    patch:
      summary: Aggiornamento parziale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SospesiPatch'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    delete:
      summary: Elimina record
      responses:
        '204': { description: Record eliminato }
