openapi: 3.0.3
info:
  title: 'wreh_products API'
  version: 1.0.0
paths:
  /api/v1/wreh_products:
    get:
      summary: 'Elenco wreh_products'
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: 'filter[product_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[costi_area_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[supplier_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: sort
          in: query
          schema: { type: string, enum: ['product_id', 'costi_area_id', 'supplier_id'] }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: Elenco paginato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WrehProductsListResponse'
    post:
      summary: Crea record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WrehProductsCreate'
      responses:
        '201':
          description: Record creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WrehProductsCreatedResponse'
        '422': { description: Errore di validazione }
  /api/v1/wreh_products/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Dettaglio record
      responses:
        '200':
          description: Record trovato
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/WrehProductsRead'
        '404': { description: Record non trovato }
    put:
      summary: Aggiornamento completo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WrehProductsUpdate'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    patch:
      summary: Aggiornamento parziale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WrehProductsPatch'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    delete:
      summary: Elimina record
      responses:
        '204': { description: Record eliminato }
components:
  schemas:
    WrehProductsRead:
      type: object
      properties:
        'product_id':
          type: integer
          format: int32
        'costi_area_id':
          type: integer
          format: int32
        'name':
          type: string
          maxLength: 255
        'description':
          type: string
          nullable: true
          maxLength: 65535
        'price':
          type: number
          format: double
        'stock_quantity':
          type: integer
          format: int32
        'supplier_id':
          type: integer
          format: int32
          nullable: true
        'costi_area__costi_area_id__label':
          type: string
          nullable: true
        'wreh_suppliers__supplier_id__label':
          type: string
          nullable: true
    WrehProductsCreate:
      type: object
      required:
        - 'costi_area_id'
        - 'name'
        - 'price'
        - 'stock_quantity'
      properties:
        'costi_area_id':
          type: integer
          format: int32
        'name':
          type: string
          maxLength: 255
        'description':
          type: string
          nullable: true
          maxLength: 65535
        'price':
          type: number
          format: double
        'stock_quantity':
          type: integer
          format: int32
        'supplier_id':
          type: integer
          format: int32
          nullable: true
    WrehProductsUpdate:
      type: object
      required:
        - 'costi_area_id'
        - 'name'
        - 'price'
        - 'stock_quantity'
      properties:
        'costi_area_id':
          type: integer
          format: int32
        'name':
          type: string
          maxLength: 255
        'description':
          type: string
          nullable: true
          maxLength: 65535
        'price':
          type: number
          format: double
        'stock_quantity':
          type: integer
          format: int32
        'supplier_id':
          type: integer
          format: int32
          nullable: true
    WrehProductsPatch:
      type: object
      properties:
        'costi_area_id':
          type: integer
          format: int32
        'name':
          type: string
          maxLength: 255
        'description':
          type: string
          nullable: true
          maxLength: 65535
        'price':
          type: number
          format: double
        'stock_quantity':
          type: integer
          format: int32
        'supplier_id':
          type: integer
          format: int32
          nullable: true
    WrehProductsListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WrehProductsRead'
        meta: { type: object }
        links: { type: object }
    WrehProductsCreatedResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            'product_id':
              type: integer
              format: int32
        meta: { type: object }
        links: { type: object }
