openapi: 3.0.3
info:
  title: 'customer API'
  version: 1.0.0
paths:
  /api/v1/customer:
    get:
      summary: 'Elenco customer'
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: 'filter[customer_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[store_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[last_name]'
          in: query
          schema:
            type: string
        - name: 'filter[address_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: sort
          in: query
          schema: { type: string, enum: ['customer_id', 'store_id', 'last_name', 'address_id'] }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: Elenco paginato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerListResponse'
    post:
      summary: Crea record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerCreate'
      responses:
        '201':
          description: Record creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerCreatedResponse'
        '422': { description: Errore di validazione }
  /api/v1/customer/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Dettaglio record
      responses:
        '200':
          description: Record trovato
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CustomerRead'
        '404': { description: Record non trovato }
    put:
      summary: Aggiornamento completo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerUpdate'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    patch:
      summary: Aggiornamento parziale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerPatch'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    delete:
      summary: Elimina record
      responses:
        '204': { description: Record eliminato }
components:
  schemas:
    CustomerRead:
      type: object
      properties:
        'customer_id':
          type: integer
          format: int32
        'store_id':
          type: integer
          format: int32
        'first_name':
          type: string
          maxLength: 45
        'last_name':
          type: string
          maxLength: 45
        'email':
          type: string
          nullable: true
          maxLength: 50
        'address_id':
          type: integer
          format: int32
        'active':
          type: boolean
        'create_date':
          type: string
          format: date-time
        'last_update':
          type: string
          format: date-time
          nullable: true
        'address_id__label':
          type: string
          nullable: true
        'store_id__label':
          type: string
          nullable: true
    CustomerCreate:
      type: object
      required:
        - 'store_id'
        - 'first_name'
        - 'last_name'
        - 'address_id'
        - 'create_date'
      properties:
        'store_id':
          type: integer
          format: int32
        'first_name':
          type: string
          maxLength: 45
        'last_name':
          type: string
          maxLength: 45
        'email':
          type: string
          nullable: true
          maxLength: 50
        'address_id':
          type: integer
          format: int32
        'active':
          type: boolean
        'create_date':
          type: string
          format: date-time
    CustomerUpdate:
      type: object
      required:
        - 'store_id'
        - 'first_name'
        - 'last_name'
        - 'address_id'
        - 'create_date'
      properties:
        'store_id':
          type: integer
          format: int32
        'first_name':
          type: string
          maxLength: 45
        'last_name':
          type: string
          maxLength: 45
        'email':
          type: string
          nullable: true
          maxLength: 50
        'address_id':
          type: integer
          format: int32
        'active':
          type: boolean
        'create_date':
          type: string
          format: date-time
    CustomerPatch:
      type: object
      properties:
        'store_id':
          type: integer
          format: int32
        'first_name':
          type: string
          maxLength: 45
        'last_name':
          type: string
          maxLength: 45
        'email':
          type: string
          nullable: true
          maxLength: 50
        'address_id':
          type: integer
          format: int32
        'active':
          type: boolean
        'create_date':
          type: string
          format: date-time
    CustomerListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CustomerRead'
        meta: { type: object }
        links: { type: object }
    CustomerCreatedResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            'customer_id':
              type: integer
              format: int32
        meta: { type: object }
        links: { type: object }
