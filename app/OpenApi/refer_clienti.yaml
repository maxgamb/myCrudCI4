openapi: 3.0.3
info:
  title: 'refer_clienti API'
  version: 1.0.0
paths:
  /api/v1/refer_clienti:
    get:
      summary: 'Elenco refer_clienti'
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: 'filter[conto_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[clienti_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[hotel_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: sort
          in: query
          schema: { type: string, enum: ['conto_id', 'clienti_id', 'hotel_id'] }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: Elenco paginato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferClientiListResponse'
    post:
      summary: Crea record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReferClientiCreate'
      responses:
        '201':
          description: Record creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferClientiCreatedResponse'
        '422': { description: Errore di validazione }
  /api/v1/refer_clienti/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Dettaglio record
      responses:
        '200':
          description: Record trovato
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ReferClientiRead'
        '404': { description: Record non trovato }
    put:
      summary: Aggiornamento completo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReferClientiUpdate'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    patch:
      summary: Aggiornamento parziale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReferClientiPatch'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    delete:
      summary: Elimina record
      responses:
        '204': { description: Record eliminato }
components:
  schemas:
    ReferClientiRead:
      type: object
      properties:
        'conto_id':
          type: integer
          format: int32
        'clienti_id':
          type: integer
          format: int32
        'hotel_id':
          type: integer
          format: int32
        'ps_valore':
          type: integer
          format: int32
        'refer_clienti_utente_id':
          type: integer
          format: int32
          nullable: true
        'refer_clienti_conto_id':
          type: integer
          format: int32
        'conti_trattamento_sog':
          type: string
          nullable: true
    ReferClientiCreate:
      type: object
      required:
        - 'conto_id'
        - 'clienti_id'
        - 'hotel_id'
        - 'ps_valore'
        - 'refer_clienti_conto_id'
      properties:
        'conto_id':
          type: integer
          format: int32
        'clienti_id':
          type: integer
          format: int32
        'hotel_id':
          type: integer
          format: int32
        'ps_valore':
          type: integer
          format: int32
        'refer_clienti_utente_id':
          type: integer
          format: int32
          nullable: true
        'refer_clienti_conto_id':
          type: integer
          format: int32
    ReferClientiUpdate:
      type: object
      required:
        - 'conto_id'
        - 'clienti_id'
        - 'hotel_id'
        - 'ps_valore'
        - 'refer_clienti_conto_id'
      properties:
        'conto_id':
          type: integer
          format: int32
        'clienti_id':
          type: integer
          format: int32
        'hotel_id':
          type: integer
          format: int32
        'ps_valore':
          type: integer
          format: int32
        'refer_clienti_utente_id':
          type: integer
          format: int32
          nullable: true
        'refer_clienti_conto_id':
          type: integer
          format: int32
    ReferClientiPatch:
      type: object
      properties:
        'conto_id':
          type: integer
          format: int32
        'clienti_id':
          type: integer
          format: int32
        'hotel_id':
          type: integer
          format: int32
        'ps_valore':
          type: integer
          format: int32
        'refer_clienti_utente_id':
          type: integer
          format: int32
          nullable: true
        'refer_clienti_conto_id':
          type: integer
          format: int32
    ReferClientiListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ReferClientiRead'
        meta: { type: object }
        links: { type: object }
    ReferClientiCreatedResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            'conto_id':
              type: integer
              format: int32
        meta: { type: object }
        links: { type: object }
