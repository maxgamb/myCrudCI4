openapi: 3.0.3
info:
  title: 'province API'
  version: 1.0.0
paths:
  /api/v1/province:
    get:
      summary: 'Elenco province'
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: sort
          in: query
          schema: { type: string, enum: ['Prov'] }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: Elenco paginato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvinceListResponse'
    post:
      summary: Crea record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProvinceCreate'
      responses:
        '201':
          description: Record creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvinceCreatedResponse'
        '422': { description: Errore di validazione }
  /api/v1/province/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Dettaglio record
      responses:
        '200':
          description: Record trovato
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ProvinceRead'
        '404': { description: Record non trovato }
    put:
      summary: Aggiornamento completo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProvinceUpdate'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    patch:
      summary: Aggiornamento parziale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProvincePatch'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    delete:
      summary: Elimina record
      responses:
        '204': { description: Record eliminato }
components:
  schemas:
    ProvinceRead:
      type: object
      properties:
        'Prov':
          type: string
          nullable: true
          maxLength: 30
        'ColExcel':
          type: string
          nullable: true
          maxLength: 30
    ProvinceCreate:
      type: object
      properties:
        'Prov':
          type: string
          nullable: true
          maxLength: 30
        'ColExcel':
          type: string
          nullable: true
          maxLength: 30
    ProvinceUpdate:
      type: object
      properties:
        'Prov':
          type: string
          nullable: true
          maxLength: 30
        'ColExcel':
          type: string
          nullable: true
          maxLength: 30
    ProvincePatch:
      type: object
      properties:
        'Prov':
          type: string
          nullable: true
          maxLength: 30
        'ColExcel':
          type: string
          nullable: true
          maxLength: 30
    ProvinceListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ProvinceRead'
        meta: { type: object }
        links: { type: object }
    ProvinceCreatedResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            'Prov':
              type: string
              nullable: true
              maxLength: 30
        meta: { type: object }
        links: { type: object }
