openapi: 3.0.3
info:
  title: 'staff API'
  version: 1.0.0
paths:
  /api/v1/staff:
    get:
      summary: 'Elenco staff'
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: 'filter[staff_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: sort
          in: query
          schema: { type: string, enum: ['staff_id'] }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: Elenco paginato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffListResponse'
    post:
      summary: Crea record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffCreate'
      responses:
        '201':
          description: Record creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffCreatedResponse'
        '422': { description: Errore di validazione }
  /api/v1/staff/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Dettaglio record
      responses:
        '200':
          description: Record trovato
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/StaffRead'
        '404': { description: Record non trovato }
    put:
      summary: Aggiornamento completo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffUpdate'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    patch:
      summary: Aggiornamento parziale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffPatch'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    delete:
      summary: Elimina record
      responses:
        '204': { description: Record eliminato }
components:
  schemas:
    StaffRead:
      type: object
      properties:
        'staff_id':
          type: integer
          format: int32
        'cognome':
          type: string
          maxLength: 200
        'nome':
          type: string
          maxLength: 200
        'citta':
          type: string
          maxLength: 200
        'provincia':
          type: string
          maxLength: 100
        'staff_nazione':
          type: string
          maxLength: 50
        'indirizzo':
          type: string
          maxLength: 200
        'telefono':
          type: string
          maxLength: 40
        'cellulare':
          type: string
          maxLength: 40
        'email':
          type: string
          maxLength: 40
        'genere':
          type: string
          maxLength: 2
        'reparto_id':
          type: string
          maxLength: 20
        'staff_stato':
          type: integer
          format: int32
        'staff_datarecod':
          type: string
          format: date-time
        'utente_id':
          type: integer
          format: int32
    StaffCreate:
      type: object
      required:
        - 'cognome'
        - 'nome'
        - 'citta'
        - 'provincia'
