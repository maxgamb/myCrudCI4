          type: string
          maxLength: 100
        'staff_nazione':
          type: string
          maxLength: 50
        'indirizzo':
          type: string
          maxLength: 200
        'telefono':
          type: string
          maxLength: 40
        'cellulare':
          type: string
          maxLength: 40
        'email':
          type: string
          maxLength: 40
        'genere':
          type: string
          maxLength: 2
        'reparto_id':
          type: string
          maxLength: 20
        'staff_stato':
          type: integer
