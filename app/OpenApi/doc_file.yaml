openapi: 3.0.3
info:
  title: 'doc_file API'
  version: 1.0.0
paths:
  /api/v1/doc_file:
    get:
      summary: 'Elenco doc_file'
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: 'filter[doc_files_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[hotel_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: sort
          in: query
          schema: { type: string, enum: ['doc_files_id', 'hotel_id'] }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: Elenco paginato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocFileListResponse'
    post:
      summary: Crea record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocFileCreate'
      responses:
        '201':
          description: Record creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocFileCreatedResponse'
        '422': { description: Errore di validazione }
  /api/v1/doc_file/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Dettaglio record
      responses:
        '200':
          description: Record trovato
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/DocFileRead'
        '404': { description: Record non trovato }
    put:
      summary: Aggiornamento completo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocFileUpdate'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    patch:
      summary: Aggiornamento parziale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocFilePatch'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    delete:
      summary: Elimina record
      responses:
        '204': { description: Record eliminato }
components:
  schemas:
    DocFileRead:
      type: object
      properties:
        'doc_files_id':
          type: integer
          format: int32
        'hotel_id':
          type: integer
          format: int32
        'doc_dipar_id':
          type: integer
          format: int32
        'doc_protocollo':
          type: integer
          format: int32
        'doc_url_file':
          type: string
          maxLength: 255
        'doc_note':
          type: string
          nullable: true
          maxLength: 255
        'doc_utente_id':
          type: integer
          format: int32
        'hotels__hotel_id__label':
          type: string
          nullable: true
    DocFileCreate:
      type: object
      required:
        - 'hotel_id'
        - 'doc_dipar_id'
        - 'doc_protocollo'
        - 'doc_url_file'
        - 'doc_utente_id'
      properties:
        'hotel_id':
          type: integer
          format: int32
        'doc_dipar_id':
          type: integer
          format: int32
        'doc_protocollo':
          type: integer
          format: int32
        'doc_url_file':
          type: string
          maxLength: 255
        'doc_note':
          type: string
          nullable: true
          maxLength: 255
        'doc_utente_id':
          type: integer
          format: int32
    DocFileUpdate:
      type: object
      required:
        - 'hotel_id'
        - 'doc_dipar_id'
        - 'doc_protocollo'
        - 'doc_url_file'
        - 'doc_utente_id'
      properties:
        'hotel_id':
          type: integer
          format: int32
        'doc_dipar_id':
          type: integer
          format: int32
        'doc_protocollo':
          type: integer
          format: int32
        'doc_url_file':
          type: string
          maxLength: 255
        'doc_note':
          type: string
          nullable: true
          maxLength: 255
        'doc_utente_id':
          type: integer
          format: int32
    DocFilePatch:
      type: object
      properties:
        'hotel_id':
          type: integer
          format: int32
        'doc_dipar_id':
          type: integer
          format: int32
        'doc_protocollo':
          type: integer
          format: int32
        'doc_url_file':
          type: string
          maxLength: 255
        'doc_note':
          type: string
          nullable: true
          maxLength: 255
        'doc_utente_id':
          type: integer
          format: int32
    DocFileListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/DocFileRead'
        meta: { type: object }
        links: { type: object }
    DocFileCreatedResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            'doc_files_id':
              type: integer
              format: int32
        meta: { type: object }
        links: { type: object }
