openapi: 3.0.3
info:
  title: 'regioni API'
  version: 1.0.0
paths:
  /api/v1/regioni:
    get:
      summary: 'Elenco regioni'
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: 'filter[regione_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: sort
          in: query
          schema: { type: string, enum: ['regione_id'] }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: Elenco paginato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegioniListResponse'
    post:
      summary: Crea record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegioniCreate'
      responses:
        '201':
          description: Record creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegioniCreatedResponse'
        '422': { description: Errore di validazione }
  /api/v1/regioni/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Dettaglio record
      responses:
        '200':
          description: Record trovato
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/RegioniRead'
        '404': { description: Record non trovato }
    put:
      summary: Aggiornamento completo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegioniUpdate'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    patch:
      summary: Aggiornamento parziale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegioniPatch'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    delete:
      summary: Elimina record
      responses:
        '204': { description: Record eliminato }
components:
  schemas:
    RegioniRead:
      type: object
      properties:
        'regione_id':
          type: integer
          format: int32
        'cod_provincia':
          type: string
          maxLength: 5
        'provincia':
          type: string
          maxLength: 100
        'regione':
          type: string
          maxLength: 100
    RegioniCreate:
      type: object
      required:
        - 'cod_provincia'
        - 'provincia'
        - 'regione'
      properties:
        'cod_provincia':
          type: string
          maxLength: 5
        'provincia':
          type: string
          maxLength: 100
        'regione':
          type: string
          maxLength: 100
    RegioniUpdate:
      type: object
      required:
        - 'cod_provincia'
        - 'provincia'
        - 'regione'
      properties:
        'cod_provincia':
          type: string
          maxLength: 5
        'provincia':
          type: string
          maxLength: 100
        'regione':
          type: string
          maxLength: 100
    RegioniPatch:
      type: object
      properties:
        'cod_provincia':
          type: string
          maxLength: 5
        'provincia':
          type: string
          maxLength: 100
        'regione':
          type: string
          maxLength: 100
    RegioniListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/RegioniRead'
        meta: { type: object }
        links: { type: object }
    RegioniCreatedResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            'regione_id':
              type: integer
              format: int32
        meta: { type: object }
        links: { type: object }
