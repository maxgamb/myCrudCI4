openapi: 3.0.3
info:
  title: 'obmp_payments API'
  version: 1.0.0
paths:
  /api/v1/obmp_payments:
    get:
      summary: 'Elenco obmp_payments'
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: 'filter[obmp_payment_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[obmp_payment_cod]'
          in: query
          schema:
            type: string
        - name: sort
          in: query
          schema: { type: string, enum: ['obmp_payment_id', 'obmp_payment_cod'] }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: Elenco paginato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObmpPaymentsListResponse'
    post:
      summary: Crea record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObmpPaymentsCreate'
      responses:
        '201':
          description: Record creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObmpPaymentsCreatedResponse'
        '422': { description: Errore di validazione }
  /api/v1/obmp_payments/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Dettaglio record
      responses:
        '200':
          description: Record trovato
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ObmpPaymentsRead'
        '404': { description: Record non trovato }
    put:
      summary: Aggiornamento completo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObmpPaymentsUpdate'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    patch:
      summary: Aggiornamento parziale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObmpPaymentsPatch'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    delete:
      summary: Elimina record
      responses:
        '204': { description: Record eliminato }
components:
  schemas:
    ObmpPaymentsRead:
      type: object
      properties:
        'obmp_payment_id':
          type: integer
          format: int32
        'obmp_payment_cod':
          type: string
          maxLength: 6
        'obmp_payment_title':
          type: string
          maxLength: 100
        'obmp_payment':
          type: string
          maxLength: 255
        'obmp_payment_value':
          type: number
          format: double
        'payment_lg':
          type: string
          maxLength: 6
    ObmpPaymentsCreate:
      type: object
      required:
        - 'obmp_payment_cod'
        - 'obmp_payment_title'
        - 'obmp_payment'
        - 'obmp_payment_value'
        - 'payment_lg'
      properties:
        'obmp_payment_cod':
          type: string
          maxLength: 6
        'obmp_payment_title':
          type: string
          maxLength: 100
        'obmp_payment':
          type: string
          maxLength: 255
        'obmp_payment_value':
          type: number
          format: double
        'payment_lg':
          type: string
          maxLength: 6
    ObmpPaymentsUpdate:
      type: object
      required:
        - 'obmp_payment_cod'
        - 'obmp_payment_title'
        - 'obmp_payment'
        - 'obmp_payment_value'
        - 'payment_lg'
      properties:
        'obmp_payment_cod':
          type: string
          maxLength: 6
        'obmp_payment_title':
          type: string
          maxLength: 100
        'obmp_payment':
          type: string
          maxLength: 255
        'obmp_payment_value':
          type: number
          format: double
        'payment_lg':
          type: string
          maxLength: 6
    ObmpPaymentsPatch:
      type: object
      properties:
        'obmp_payment_cod':
          type: string
          maxLength: 6
        'obmp_payment_title':
          type: string
          maxLength: 100
        'obmp_payment':
          type: string
          maxLength: 255
        'obmp_payment_value':
          type: number
          format: double
        'payment_lg':
          type: string
          maxLength: 6
    ObmpPaymentsListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ObmpPaymentsRead'
        meta: { type: object }
        links: { type: object }
    ObmpPaymentsCreatedResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            'obmp_payment_id':
              type: integer
              format: int32
        meta: { type: object }
        links: { type: object }
