openapi: 3.0.3
info:
  title: 'agenda API'
  version: 1.0.0
paths:
  /api/v1/agenda:
    get:
      summary: 'Elenco agenda'
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: 'filter[preno_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[hotel_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[preno_in_data]'
          in: query
          schema:
            type: string
            format: date-time
        - name: 'filter[preno_dal]'
          in: query
          schema:
            type: string
            format: date
        - name: 'filter[preno_al]'
          in: query
          schema:
            type: string
            format: date
        - name: 'filter[preno_cogno]'
          in: query
          schema:
            type: string
        - name: 'filter[preno_agenzia]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[voucher_id]'
          in: query
          schema:
            type: string
        - name: 'filter[preno_stato]'
          in: query
          schema:
            type: integer
            format: int32
        - name: sort
          in: query
          schema: { type: string, enum: ['preno_id', 'hotel_id', 'preno_in_data', 'preno_dal', 'preno_al', 'preno_cogno', 'preno_agenzia', 'voucher_id', 'preno_stato'] }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: Elenco paginato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgendaListResponse'
    post:
      summary: Crea record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgendaCreate'
      responses:
        '201':
          description: Record creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgendaCreatedResponse'
        '422': { description: Errore di validazione }
  /api/v1/agenda/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Dettaglio record
      responses:
        '200':
          description: Record trovato
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AgendaRead'
        '404': { description: Record non trovato }
    put:
      summary: Aggiornamento completo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgendaUpdate'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    patch:
      summary: Aggiornamento parziale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgendaPatch'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    delete:
      summary: Elimina record
      responses:
        '204': { description: Record eliminato }
