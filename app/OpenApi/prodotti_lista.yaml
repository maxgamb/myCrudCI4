  schemas:
    ProdottiListaRead:
      type: object
      properties:
        'prodotti_lista_id':
          type: integer
          format: int32
        'prod_lista_mone':
          type: string
          maxLength: 100
        'prod_lista_descrixione':
          type: string
          nullable: true
          maxLength: 250
        'prod_lista_allergenici':
          type: string
          nullable: true
          maxLength: 250
        'prod_lista_costo_unitario':
          type: number
          format: double
          nullable: true
        'prod_lista_img':
          type: string
          nullable: true
          maxLength: 100
        'prod_lista_data':
          type: string
          format: date
          nullable: true
        'prod_lista_user_id':
          type: integer
          format: int32
          nullable: true
        'prodotti__prodotti_lista_id__label':
          type: string
          nullable: true
    ProdottiListaCreate:
      type: object
      required:
