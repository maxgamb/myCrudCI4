        'prod_lista_user_id':
          type: integer
          format: int32
          nullable: true
    ProdottiListaUpdate:
      type: object
      required:
        - 'prod_lista_mone'
      properties:
        'prod_lista_mone':
          type: string
          maxLength: 100
        'prod_lista_descrixione':
          type: string
          nullable: true
          maxLength: 250
        'prod_lista_allergenici':
          type: string
          nullable: true
          maxLength: 250
        'prod_lista_costo_unitario':
          type: number
