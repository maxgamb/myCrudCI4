openapi: 3.0.3
info:
  title: 'ci_sessions API'
  version: 1.0.0
paths:
  /api/v1/ci_sessions:
    get:
      summary: 'Elenco ci_sessions'
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: 'filter[id]'
          in: query
          schema:
            type: string
        - name: 'filter[timestamp]'
          in: query
          schema:
            type: integer
            format: int32
        - name: sort
          in: query
          schema: { type: string, enum: ['id', 'timestamp'] }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: Elenco paginato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CiSessionsListResponse'
    post:
      summary: Crea record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CiSessionsCreate'
      responses:
        '201':
          description: Record creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CiSessionsCreatedResponse'
        '422': { description: Errore di validazione }
  /api/v1/ci_sessions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Dettaglio record
      responses:
        '200':
          description: Record trovato
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CiSessionsRead'
        '404': { description: Record non trovato }
    put:
      summary: Aggiornamento completo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CiSessionsUpdate'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    patch:
      summary: Aggiornamento parziale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CiSessionsPatch'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    delete:
      summary: Elimina record
      responses:
        '204': { description: Record eliminato }
components:
  schemas:
    CiSessionsRead:
      type: object
      properties:
        'id':
          type: string
          maxLength: 128
        'ip_address':
          type: string
          maxLength: 45
        'timestamp':
          type: integer
          format: int32
    CiSessionsCreate:
      type: object
      required:
        - 'id'
        - 'ip_address'
        - 'data'
      properties:
        'id':
          type: string
          maxLength: 128
        'ip_address':
          type: string
          maxLength: 45
        'timestamp':
          type: integer
          format: int32
        'data':
          type: string
          format: byte
          maxLength: 65535
    CiSessionsUpdate:
      type: object
      required:
        - 'id'
        - 'ip_address'
        - 'data'
      properties:
        'id':
          type: string
          maxLength: 128
        'ip_address':
          type: string
          maxLength: 45
        'timestamp':
          type: integer
          format: int32
        'data':
          type: string
          format: byte
          maxLength: 65535
    CiSessionsPatch:
      type: object
      properties:
        'id':
          type: string
          maxLength: 128
        'ip_address':
          type: string
          maxLength: 45
        'timestamp':
          type: integer
          format: int32
        'data':
          type: string
          format: byte
          maxLength: 65535
    CiSessionsListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CiSessionsRead'
        meta: { type: object }
        links: { type: object }
    CiSessionsCreatedResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            'id':
              type: string
              maxLength: 128
        meta: { type: object }
        links: { type: object }
