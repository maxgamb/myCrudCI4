openapi: 3.0.3
info:
  title: 'images API'
  version: 1.0.0
paths:
  /api/v1/images:
    get:
      summary: 'Elenco images'
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: 'filter[images_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[hotel_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[obmp_cm_rooms_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: sort
          in: query
          schema: { type: string, enum: ['images_id', 'hotel_id', 'obmp_cm_rooms_id'] }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: Elenco paginato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImagesListResponse'
    post:
      summary: Crea record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImagesCreate'
      responses:
        '201':
          description: Record creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImagesCreatedResponse'
        '422': { description: Errore di validazione }
  /api/v1/images/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Dettaglio record
      responses:
        '200':
          description: Record trovato
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ImagesRead'
        '404': { description: Record non trovato }
    put:
      summary: Aggiornamento completo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImagesUpdate'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    patch:
      summary: Aggiornamento parziale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImagesPatch'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    delete:
      summary: Elimina record
      responses:
        '204': { description: Record eliminato }
components:
  schemas:
    ImagesRead:
      type: object
      properties:
        'images_id':
          type: integer
          format: int32
        'hotel_id':
          type: integer
          format: int32
        'camera_id':
          type: integer
          format: int32
          nullable: true
        'obmp_cm_rooms_id':
          type: integer
          format: int32
          nullable: true
        'tipologia_id':
          type: integer
          format: int32
          nullable: true
        'img_small':
          type: string
          nullable: true
          maxLength: 250
        'img_medium':
          type: string
          nullable: true
          maxLength: 250
        'img_large':
          type: string
          nullable: true
          maxLength: 250
        'titolo':
          type: string
          nullable: true
          maxLength: 250
        'utente_id':
          type: integer
          format: int32
          nullable: true
        'obmp_cm_rooms__obmp_cm_rooms_id__label':
          type: string
          nullable: true
    ImagesCreate:
      type: object
      required:
        - 'hotel_id'
      properties:
        'hotel_id':
          type: integer
          format: int32
        'camera_id':
          type: integer
          format: int32
          nullable: true
        'obmp_cm_rooms_id':
          type: integer
          format: int32
          nullable: true
        'tipologia_id':
          type: integer
          format: int32
          nullable: true
        'img_small':
          type: string
          nullable: true
          maxLength: 250
        'img_medium':
          type: string
          nullable: true
          maxLength: 250
        'img_large':
          type: string
          nullable: true
          maxLength: 250
        'titolo':
          type: string
          nullable: true
          maxLength: 250
        'utente_id':
          type: integer
          format: int32
          nullable: true
    ImagesUpdate:
      type: object
      required:
        - 'hotel_id'
      properties:
        'hotel_id':
          type: integer
          format: int32
        'camera_id':
          type: integer
          format: int32
          nullable: true
        'obmp_cm_rooms_id':
          type: integer
          format: int32
          nullable: true
        'tipologia_id':
          type: integer
          format: int32
          nullable: true
        'img_small':
          type: string
          nullable: true
          maxLength: 250
        'img_medium':
          type: string
          nullable: true
          maxLength: 250
        'img_large':
          type: string
          nullable: true
          maxLength: 250
        'titolo':
          type: string
          nullable: true
          maxLength: 250
        'utente_id':
          type: integer
          format: int32
          nullable: true
    ImagesPatch:
      type: object
      properties:
        'hotel_id':
          type: integer
          format: int32
        'camera_id':
          type: integer
          format: int32
          nullable: true
        'obmp_cm_rooms_id':
          type: integer
          format: int32
          nullable: true
        'tipologia_id':
          type: integer
          format: int32
          nullable: true
        'img_small':
          type: string
          nullable: true
          maxLength: 250
        'img_medium':
          type: string
          nullable: true
          maxLength: 250
        'img_large':
          type: string
          nullable: true
          maxLength: 250
        'titolo':
          type: string
          nullable: true
          maxLength: 250
        'utente_id':
          type: integer
          format: int32
          nullable: true
    ImagesListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ImagesRead'
        meta: { type: object }
        links: { type: object }
    ImagesCreatedResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            'images_id':
              type: integer
              format: int32
        meta: { type: object }
        links: { type: object }
