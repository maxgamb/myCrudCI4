openapi: 3.0.3
info:
  title: 'black_list API'
  version: 1.0.0
paths:
  /api/v1/black_list:
    get:
      summary: 'Elenco black_list'
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: 'filter[black_list_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[hotel_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[clienti_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: sort
          in: query
          schema: { type: string, enum: ['black_list_id', 'hotel_id', 'clienti_id'] }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: Elenco paginato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlackListListResponse'
    post:
      summary: Crea record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlackListCreate'
      responses:
        '201':
          description: Record creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlackListCreatedResponse'
        '422': { description: Errore di validazione }
  /api/v1/black_list/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Dettaglio record
      responses:
        '200':
          description: Record trovato
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/BlackListRead'
        '404': { description: Record non trovato }
    put:
      summary: Aggiornamento completo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlackListUpdate'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    patch:
      summary: Aggiornamento parziale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlackListPatch'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    delete:
      summary: Elimina record
      responses:
        '204': { description: Record eliminato }
components:
  schemas:
    BlackListRead:
      type: object
      properties:
        'black_list_id':
          type: integer
          format: int32
        'hotel_id':
          type: integer
          format: int32
        'clienti_id':
          type: integer
          format: int32
        'black_list_stato':
          type: integer
          format: int32
          nullable: true
        'black_list_data':
          type: string
          format: date-time
    BlackListCreate:
      type: object
      properties:
        'hotel_id':
          type: integer
          format: int32
        'clienti_id':
          type: integer
          format: int32
        'black_list_stato':
          type: integer
          format: int32
          nullable: true
        'black_list_data':
          type: string
          format: date-time
    BlackListUpdate:
      type: object
      properties:
        'hotel_id':
          type: integer
          format: int32
        'clienti_id':
          type: integer
          format: int32
        'black_list_stato':
          type: integer
          format: int32
          nullable: true
        'black_list_data':
          type: string
          format: date-time
    BlackListPatch:
      type: object
      properties:
        'hotel_id':
          type: integer
          format: int32
        'clienti_id':
          type: integer
          format: int32
        'black_list_stato':
          type: integer
          format: int32
          nullable: true
        'black_list_data':
          type: string
          format: date-time
    BlackListListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/BlackListRead'
        meta: { type: object }
        links: { type: object }
    BlackListCreatedResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            'black_list_id':
              type: integer
              format: int32
        meta: { type: object }
        links: { type: object }
