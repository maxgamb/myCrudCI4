          type: integer
          format: int32
        'conto_id_ex':
          type: integer
          format: int32
        'conto_id_new':
          type: integer
          format: int32
        'hotel_id':
          type: integer
          format: int32
        'adebito_id':
          type: integer
          format: int32
        'conti_tra_data':
          type: string
          format: date-time
        'adebiti_descrizione':
          type: string
          nullable: true
    ContiTrasferisciCreate:
      type: object
      properties:
        'conto_id_ex':
          type: integer
          format: int32
        'conto_id_new':
          type: integer
          format: int32
        'hotel_id':
          type: integer
          format: int32
        'adebito_id':
          type: integer
          format: int32
        'conti_tra_data':
          type: string
