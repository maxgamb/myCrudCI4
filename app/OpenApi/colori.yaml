openapi: 3.0.3
info:
  title: 'colori API'
  version: 1.0.0
paths:
  /api/v1/colori:
    get:
      summary: 'Elenco colori'
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: 'filter[colore_codice]'
          in: query
          schema:
            type: string
        - name: 'filter[col_preno_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: sort
          in: query
          schema: { type: string, enum: ['colore_nome', 'colore_codice', 'col_preno_id'] }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: Elenco paginato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ColoriListResponse'
    post:
      summary: Crea record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ColoriCreate'
      responses:
        '201':
          description: Record creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ColoriCreatedResponse'
        '422': { description: Errore di validazione }
  /api/v1/colori/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Dettaglio record
      responses:
        '200':
          description: Record trovato
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ColoriRead'
        '404': { description: Record non trovato }
    put:
      summary: Aggiornamento completo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ColoriUpdate'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    patch:
      summary: Aggiornamento parziale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ColoriPatch'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    delete:
      summary: Elimina record
      responses:
        '204': { description: Record eliminato }
components:
  schemas:
    ColoriRead:
      type: object
      properties:
        'colore_nome':
          type: string
          maxLength: 10
        'colore_codice':
          type: string
          maxLength: 10
        'col_preno_id':
          type: integer
          format: int32
          nullable: true
        'agenda__col_preno_id__label':
          type: string
          nullable: true
    ColoriCreate:
      type: object
      properties:
        'colore_nome':
          type: string
          maxLength: 10
        'colore_codice':
          type: string
          maxLength: 10
        'col_preno_id':
          type: integer
          format: int32
          nullable: true
    ColoriUpdate:
      type: object
      properties:
        'colore_nome':
          type: string
          maxLength: 10
        'colore_codice':
          type: string
          maxLength: 10
        'col_preno_id':
          type: integer
          format: int32
          nullable: true
    ColoriPatch:
      type: object
      properties:
        'colore_nome':
          type: string
          maxLength: 10
        'colore_codice':
          type: string
          maxLength: 10
        'col_preno_id':
          type: integer
          format: int32
          nullable: true
    ColoriListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ColoriRead'
        meta: { type: object }
        links: { type: object }
    ColoriCreatedResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            'colore_nome':
              type: string
              maxLength: 10
        meta: { type: object }
        links: { type: object }
