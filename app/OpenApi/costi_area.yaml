openapi: 3.0.3
info:
  title: 'costi_area API'
  version: 1.0.0
paths:
  /api/v1/costi_area:
    get:
      summary: 'Elenco costi_area'
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: 'filter[costi_area_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: sort
          in: query
          schema: { type: string, enum: ['costi_area_id'] }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: Elenco paginato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CostiAreaListResponse'
    post:
      summary: Crea record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CostiAreaCreate'
      responses:
        '201':
          description: Record creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CostiAreaCreatedResponse'
        '422': { description: Errore di validazione }
  /api/v1/costi_area/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Dettaglio record
      responses:
        '200':
          description: Record trovato
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CostiAreaRead'
        '404': { description: Record non trovato }
    put:
      summary: Aggiornamento completo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CostiAreaUpdate'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    patch:
      summary: Aggiornamento parziale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CostiAreaPatch'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    delete:
      summary: Elimina record
      responses:
        '204': { description: Record eliminato }
components:
  schemas:
    CostiAreaRead:
      type: object
      properties:
        'costi_area_id':
          type: integer
          format: int32
        'costi_area_nome':
          type: string
          nullable: true
          maxLength: 225
        'costi_area':
          type: string
          nullable: true
          maxLength: 45
        'utente_id':
          type: integer
          format: int32
          nullable: true
    CostiAreaCreate:
      type: object
      properties:
        'costi_area_nome':
          type: string
          nullable: true
          maxLength: 225
        'costi_area':
          type: string
          nullable: true
          maxLength: 45
        'utente_id':
          type: integer
          format: int32
          nullable: true
    CostiAreaUpdate:
      type: object
      properties:
        'costi_area_nome':
          type: string
          nullable: true
          maxLength: 225
        'costi_area':
          type: string
          nullable: true
          maxLength: 45
        'utente_id':
          type: integer
          format: int32
          nullable: true
    CostiAreaPatch:
      type: object
      properties:
        'costi_area_nome':
          type: string
          nullable: true
          maxLength: 225
        'costi_area':
          type: string
          nullable: true
          maxLength: 45
        'utente_id':
          type: integer
          format: int32
          nullable: true
    CostiAreaListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CostiAreaRead'
        meta: { type: object }
        links: { type: object }
    CostiAreaCreatedResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            'costi_area_id':
              type: integer
              format: int32
        meta: { type: object }
        links: { type: object }
