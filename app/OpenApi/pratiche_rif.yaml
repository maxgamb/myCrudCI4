openapi: 3.0.3
info:
  title: 'pratiche_rif API'
  version: 1.0.0
paths:
  /api/v1/pratiche_rif:
    get:
      summary: 'Elenco pratiche_rif'
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: 'filter[pratica_rif_pratica_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[hotel_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[pratica_rif_conto_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[pratiche_rif_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: sort
          in: query
          schema: { type: string, enum: ['pratica_rif_pratica_id', 'hotel_id', 'pratica_rif_conto_id', 'pratiche_rif_id'] }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: Elenco paginato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PraticheRifListResponse'
    post:
      summary: Crea record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PraticheRifCreate'
      responses:
        '201':
          description: Record creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PraticheRifCreatedResponse'
        '422': { description: Errore di validazione }
  /api/v1/pratiche_rif/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Dettaglio record
      responses:
        '200':
          description: Record trovato
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PraticheRifRead'
        '404': { description: Record non trovato }
    put:
      summary: Aggiornamento completo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PraticheRifUpdate'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    patch:
      summary: Aggiornamento parziale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PraticheRifPatch'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    delete:
      summary: Elimina record
      responses:
        '204': { description: Record eliminato }
