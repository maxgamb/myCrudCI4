openapi: 3.0.3
info:
  title: 'staff_list API'
  version: 1.0.0
paths:
  /api/v1/staff_list:
    get:
      summary: 'Elenco read-only staff_list'
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: sort
          in: query
          schema: { type: string, enum: ['ID'] }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: Elenco paginato read-only
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffListListResponse'
components:
  schemas:
    StaffListRead:
      type: object
      properties:
        'ID':
          type: integer
          format: int32
        'name':
          type: string
          nullable: true
          maxLength: 91
        'address':
          type: string
          maxLength: 50
        'zip code':
          type: string
          nullable: true
          maxLength: 10
        'phone':
          type: string
          maxLength: 20
        'city':
          type: string
          maxLength: 50
        'country':
          type: string
          maxLength: 50
        'SID':
          type: integer
          format: int32
    StaffListListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/StaffListRead'
        meta: { type: object }
        links: { type: object }
