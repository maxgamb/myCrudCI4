openapi: 3.0.3
info:
  title: 'ref_obmp_booking API'
  version: 1.0.0
paths:
  /api/v1/ref_obmp_booking:
    get:
      summary: 'Elenco ref_obmp_booking'
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: 'filter[ref_obm_data]'
          in: query
          schema:
            type: string
            format: date-time
        - name: 'filter[preno_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[obm_cliente_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[hotel_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[ref_site]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[quote_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: sort
          in: query
          schema: { type: string, enum: ['ref_obm_data', 'preno_id', 'obm_cliente_id', 'hotel_id', 'ref_site', 'quote_id'] }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: Elenco paginato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefObmpBookingListResponse'
    post:
      summary: Crea record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefObmpBookingCreate'
      responses:
        '201':
          description: Record creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefObmpBookingCreatedResponse'
        '422': { description: Errore di validazione }
  /api/v1/ref_obmp_booking/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Dettaglio record
      responses:
        '200':
          description: Record trovato
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/RefObmpBookingRead'
        '404': { description: Record non trovato }
    put:
      summary: Aggiornamento completo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefObmpBookingUpdate'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    patch:
      summary: Aggiornamento parziale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefObmpBookingPatch'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    delete:
      summary: Elimina record
      responses:
        '204': { description: Record eliminato }
