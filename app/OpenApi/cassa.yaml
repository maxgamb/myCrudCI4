          format: int32
          nullable: true
        'out_conto':
          type: string
          format: date
          nullable: true
        'conto_id':
          type: integer
          format: int32
          nullable: true
        'totale_importo':
          type: number
          format: double
          nullable: true
        'totale_modificato':
          type: number
          format: double
          nullable: true
        'pagamento_importo_pag':
          type: number
          format: double
          nullable: true
        'pagamento_forma':
          type: string
          nullable: true
          maxLength: 3
        'cassa_stato_camera':
          type: string
          nullable: true
          maxLength: 3
        'sospeso':
          type: string
          nullable: true
          maxLength: 2
        'fattura_numero':
          type: integer
          format: int32
          nullable: true
        'nome_pagante':
          type: string
          nullable: true
          maxLength: 100
        'cassa_utente_id':
          type: integer
          format: int32
          nullable: true
        'divisa':
          type: string
          nullable: true
          maxLength: 50
        'nexi_cod_aut':
          type: string
          nullable: true
          maxLength: 50
        'nexi_codTrans':
          type: string
          nullable: true
          maxLength: 100
        'nexi_pan':
