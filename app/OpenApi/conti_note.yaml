openapi: 3.0.3
info:
  title: 'conti_note API'
  version: 1.0.0
paths:
  /api/v1/conti_note:
    get:
      summary: 'Elenco conti_note'
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: 'filter[conto_nota_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[conto_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: sort
          in: query
          schema: { type: string, enum: ['conto_nota_id', 'conto_id'] }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: Elenco paginato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContiNoteListResponse'
    post:
      summary: Crea record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContiNoteCreate'
      responses:
        '201':
          description: Record creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContiNoteCreatedResponse'
        '422': { description: Errore di validazione }
  /api/v1/conti_note/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Dettaglio record
      responses:
        '200':
          description: Record trovato
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ContiNoteRead'
        '404': { description: Record non trovato }
    put:
      summary: Aggiornamento completo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContiNoteUpdate'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    patch:
      summary: Aggiornamento parziale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContiNotePatch'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    delete:
      summary: Elimina record
      responses:
        '204': { description: Record eliminato }
components:
  schemas:
    ContiNoteRead:
      type: object
      properties:
        'conto_nota_id':
          type: integer
          format: int32
        'conto_id':
          type: integer
          format: int32
        'hotel_id':
          type: integer
          format: int32
        'conto_nota_testo':
          type: string
          maxLength: 4294967295
        'note_conto_utente_id':
          type: integer
          format: int32
          nullable: true
        'conti_trattamento_sog':
          type: string
          nullable: true
    ContiNoteCreate:
      type: object
      required:
        - 'conto_nota_testo'
      properties:
        'conto_id':
          type: integer
          format: int32
        'hotel_id':
          type: integer
          format: int32
        'conto_nota_testo':
          type: string
          maxLength: 4294967295
        'note_conto_utente_id':
          type: integer
          format: int32
          nullable: true
    ContiNoteUpdate:
      type: object
      required:
        - 'conto_nota_testo'
      properties:
        'conto_id':
          type: integer
          format: int32
        'hotel_id':
          type: integer
          format: int32
        'conto_nota_testo':
          type: string
          maxLength: 4294967295
        'note_conto_utente_id':
          type: integer
          format: int32
          nullable: true
    ContiNotePatch:
      type: object
      properties:
        'conto_id':
          type: integer
          format: int32
        'hotel_id':
          type: integer
          format: int32
        'conto_nota_testo':
          type: string
          maxLength: 4294967295
        'note_conto_utente_id':
          type: integer
          format: int32
          nullable: true
    ContiNoteListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ContiNoteRead'
        meta: { type: object }
        links: { type: object }
    ContiNoteCreatedResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            'conto_nota_id':
              type: integer
              format: int32
        meta: { type: object }
        links: { type: object }
