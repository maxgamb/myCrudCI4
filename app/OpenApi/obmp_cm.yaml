            format: int32
        - name: sort
          in: query
          schema: { type: string, enum: ['obmp_cm_id', 'hotel_id', 'agenzia_id', 'obmp_cm_attiva'] }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc] }
