openapi: 3.0.3
info:
  title: 'prezzi API'
  version: 1.0.0
paths:
  /api/v1/prezzi:
    get:
      summary: 'Elenco prezzi'
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: 'filter[prezzo_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: sort
          in: query
          schema: { type: string, enum: ['prezzo_id'] }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: Elenco paginato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrezziListResponse'
    post:
      summary: Crea record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrezziCreate'
      responses:
        '201':
          description: Record creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrezziCreatedResponse'
        '422': { description: Errore di validazione }
  /api/v1/prezzi/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Dettaglio record
      responses:
        '200':
          description: Record trovato
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PrezziRead'
        '404': { description: Record non trovato }
    put:
      summary: Aggiornamento completo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrezziUpdate'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    patch:
      summary: Aggiornamento parziale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrezziPatch'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    delete:
      summary: Elimina record
      responses:
        '204': { description: Record eliminato }
components:
  schemas:
    PrezziRead:
      type: object
      properties:
        'prezzo_id':
          type: integer
          format: int32
        'hotel_id':
          type: integer
          format: int32
        'conto_id':
          type: integer
          format: int32
        'prezzo_dal':
          type: string
          format: date
        'prezzo_al':
          type: string
          format: date
        'prezzo_valore':
          type: number
          format: double
        'libero':
          type: string
          maxLength: 10
        'prezzi_utente_id':
          type: integer
          format: int32
          nullable: true
    PrezziCreate:
      type: object
      required:
        - 'prezzo_dal'
        - 'prezzo_al'
      properties:
        'hotel_id':
          type: integer
          format: int32
        'conto_id':
          type: integer
          format: int32
        'prezzo_dal':
          type: string
          format: date
        'prezzo_al':
          type: string
          format: date
        'prezzo_valore':
          type: number
          format: double
        'libero':
          type: string
          maxLength: 10
        'prezzi_utente_id':
          type: integer
          format: int32
          nullable: true
    PrezziUpdate:
      type: object
      required:
        - 'prezzo_dal'
        - 'prezzo_al'
      properties:
        'hotel_id':
          type: integer
          format: int32
        'conto_id':
          type: integer
          format: int32
        'prezzo_dal':
          type: string
          format: date
        'prezzo_al':
          type: string
          format: date
        'prezzo_valore':
          type: number
          format: double
        'libero':
          type: string
          maxLength: 10
        'prezzi_utente_id':
          type: integer
          format: int32
          nullable: true
    PrezziPatch:
      type: object
      properties:
        'hotel_id':
          type: integer
          format: int32
        'conto_id':
          type: integer
          format: int32
        'prezzo_dal':
          type: string
          format: date
        'prezzo_al':
          type: string
          format: date
        'prezzo_valore':
          type: number
          format: double
        'libero':
          type: string
          maxLength: 10
        'prezzi_utente_id':
          type: integer
          format: int32
          nullable: true
    PrezziListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PrezziRead'
        meta: { type: object }
        links: { type: object }
    PrezziCreatedResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            'prezzo_id':
              type: integer
              format: int32
        meta: { type: object }
        links: { type: object }
