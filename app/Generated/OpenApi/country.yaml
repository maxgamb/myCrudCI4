openapi: 3.0.3
info:
  title: 'country API'
  version: 1.0.0
paths:
  /api/v1/country:
    get:
      summary: 'Elenco country'
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: 'filter[country_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: sort
          in: query
          schema: { type: string, enum: ['country_id'] }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: Elenco paginato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountryListResponse'
    post:
      summary: Crea record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CountryCreate'
      responses:
        '201':
          description: Record creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountryCreatedResponse'
        '422': { description: Errore di validazione }
  /api/v1/country/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Dettaglio record
      responses:
        '200':
          description: Record trovato
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CountryRead'
        '404': { description: Record non trovato }
    put:
      summary: Aggiornamento completo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CountryUpdate'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    patch:
      summary: Aggiornamento parziale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CountryPatch'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    delete:
      summary: Elimina record
      responses:
        '204': { description: Record eliminato }
components:
  schemas:
    CountryRead:
      type: object
      properties:
        'country_id':
          type: integer
          format: int32
        'country':
          type: string
          maxLength: 50
        'last_update':
          type: string
          format: date-time
    CountryCreate:
      type: object
      required:
        - 'country'
      properties:
        'country':
          type: string
          maxLength: 50
    CountryUpdate:
      type: object
      required:
        - 'country'
      properties:
        'country':
          type: string
          maxLength: 50
    CountryPatch:
      type: object
      properties:
        'country':
          type: string
          maxLength: 50
    CountryListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CountryRead'
        meta: { type: object }
        links: { type: object }
    CountryCreatedResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            'country_id':
              type: integer
              format: int32
        meta: { type: object }
        links: { type: object }
