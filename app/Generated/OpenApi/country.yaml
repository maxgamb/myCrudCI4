          schema:
            $ref: '#/components/schemas/CountryErrorResponse'
    NotFound:
      description: Record not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CountryErrorResponse'
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CountryErrorResponse'
    InternalError:
      description: Internal server error
      content:
