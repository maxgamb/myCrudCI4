components:
  schemas:
    CountryRead:
      type: object
      properties:
        'country_id':
          type: integer
          format: int32
        'country':
          type: string
          maxLength: 50
        'last_update':
          type: string
          format: date-time
    CountryCreate:
      type: object
      required:
        - 'country'
      properties:
        'country':
          type: string
          maxLength: 50
    CountryUpdate:
      type: object
      required:
        - 'country'
      properties:
        'country':
          type: string
          maxLength: 50
    CountryPatch:
      type: object
      properties:
        'country':
          type: string
          maxLength: 50
    CountryResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/CountryRead'
        meta: { type: object }
        links: { type: object }
    CountryListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CountryRead'
        meta:
          type: object
          properties:
            page: { type: integer }
            perPage: { type: integer }
            total: { type: integer }
            pageCount: { type: integer }
        links:
          type: object
          properties:
            self: { type: string, nullable: true }
            next: { type: string, nullable: true }
            prev: { type: string, nullable: true }
    CountryCreatedResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            'country_id':
              type: integer
              format: int32
        meta: { type: object }
        links: { type: object }
    CountryErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            fields:
              type: object
              additionalProperties:
                type: string
  responses:
    BadRequest:
