        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: 'filter[country_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: sort
          in: query
          schema: { type: string, enum: ['country_id'] }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc], default: asc }
