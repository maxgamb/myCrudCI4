              schema:
                $ref: '#/components/schemas/CountryListResponse'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: ['Country']
      operationId: createCountry
      summary: 'Create country record'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CountryCreate'
      responses:
