          type: string
          maxLength: 5
        'nazioni_EN':
          type: string
          maxLength: 100
        'nazioni_ES':
          type: string
          maxLength: 100
        'nazioni_FR':
          type: string
          maxLength: 100
        'nazioni_DE':
          type: string
