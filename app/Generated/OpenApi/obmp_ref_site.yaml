openapi: 3.0.3
info:
  title: 'obmp_ref_site API'
  version: 1.0.0
paths:
  /api/v1/obmp_ref_site:
    get:
      summary: 'Elenco obmp_ref_site'
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: 'filter[ref_site_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[hotel_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[obmp_affiliati_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: sort
          in: query
          schema: { type: string, enum: ['ref_site_id', 'hotel_id', 'obmp_affiliati_id'] }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: Elenco paginato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObmpRefSiteListResponse'
    post:
      summary: Crea record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObmpRefSiteCreate'
      responses:
        '201':
          description: Record creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObmpRefSiteCreatedResponse'
        '422': { description: Errore di validazione }
  /api/v1/obmp_ref_site/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Dettaglio record
      responses:
        '200':
          description: Record trovato
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ObmpRefSiteRead'
        '404': { description: Record non trovato }
    put:
      summary: Aggiornamento completo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObmpRefSiteUpdate'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    patch:
      summary: Aggiornamento parziale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObmpRefSitePatch'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    delete:
      summary: Elimina record
      responses:
        '204': { description: Record eliminato }
components:
  schemas:
    ObmpRefSiteRead:
      type: object
      properties:
        'ref_site_id':
          type: integer
          format: int32
        'hotel_id':
          type: integer
          format: int32
        'obmp_affiliati_id':
          type: integer
          format: int32
          nullable: true
        'ref_site_nome':
          type: string
          maxLength: 200
        'ref_site_date_record':
          type: string
          format: date-time
    ObmpRefSiteCreate:
      type: object
      properties:
        'hotel_id':
          type: integer
          format: int32
        'obmp_affiliati_id':
          type: integer
          format: int32
          nullable: true
        'ref_site_nome':
          type: string
          maxLength: 200
        'ref_site_date_record':
          type: string
          format: date-time
    ObmpRefSiteUpdate:
      type: object
      properties:
        'hotel_id':
          type: integer
          format: int32
        'obmp_affiliati_id':
          type: integer
          format: int32
          nullable: true
        'ref_site_nome':
          type: string
          maxLength: 200
        'ref_site_date_record':
          type: string
          format: date-time
    ObmpRefSitePatch:
      type: object
      properties:
        'hotel_id':
          type: integer
          format: int32
        'obmp_affiliati_id':
          type: integer
          format: int32
          nullable: true
        'ref_site_nome':
          type: string
          maxLength: 200
        'ref_site_date_record':
          type: string
          format: date-time
    ObmpRefSiteListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ObmpRefSiteRead'
        meta: { type: object }
        links: { type: object }
    ObmpRefSiteCreatedResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            'ref_site_id':
              type: integer
              format: int32
        meta: { type: object }
        links: { type: object }
