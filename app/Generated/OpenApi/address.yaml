openapi: 3.0.3
info:
  title: 'address API'
  version: 1.0.0
paths:
  /api/v1/address:
    get:
      summary: 'Elenco address'
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: 'filter[address_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[city_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: sort
          in: query
          schema: { type: string, enum: ['address_id', 'city_id'] }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: Elenco paginato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressListResponse'
    post:
      summary: Crea record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressCreate'
      responses:
        '201':
          description: Record creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressCreatedResponse'
        '422': { description: Errore di validazione }
  /api/v1/address/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Dettaglio record
      responses:
        '200':
          description: Record trovato
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AddressRead'
        '404': { description: Record non trovato }
    put:
      summary: Aggiornamento completo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressUpdate'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    patch:
      summary: Aggiornamento parziale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressPatch'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    delete:
      summary: Elimina record
      responses:
        '204': { description: Record eliminato }
components:
  schemas:
    AddressRead:
      type: object
      properties:
        'address_id':
          type: integer
          format: int32
        'address':
          type: string
          maxLength: 50
        'address2':
          type: string
          nullable: true
          maxLength: 50
        'district':
          type: string
          maxLength: 20
        'city_id':
          type: integer
          format: int32
        'postal_code':
          type: string
          nullable: true
          maxLength: 10
        'phone':
          type: string
          maxLength: 20
        'last_update':
          type: string
          format: date-time
        'city_id__label':
          type: string
          nullable: true
    AddressCreate:
      type: object
      required:
        - 'address'
        - 'district'
        - 'city_id'
        - 'phone'
      properties:
        'address':
          type: string
          maxLength: 50
        'address2':
          type: string
          nullable: true
          maxLength: 50
        'district':
          type: string
          maxLength: 20
        'city_id':
          type: integer
          format: int32
        'postal_code':
          type: string
          nullable: true
          maxLength: 10
        'phone':
          type: string
          maxLength: 20
    AddressUpdate:
      type: object
      required:
        - 'address'
        - 'district'
        - 'city_id'
        - 'phone'
      properties:
        'address':
          type: string
          maxLength: 50
        'address2':
          type: string
          nullable: true
          maxLength: 50
        'district':
          type: string
          maxLength: 20
        'city_id':
          type: integer
          format: int32
        'postal_code':
          type: string
          nullable: true
          maxLength: 10
        'phone':
          type: string
          maxLength: 20
    AddressPatch:
      type: object
      properties:
        'address':
          type: string
          maxLength: 50
        'address2':
          type: string
          nullable: true
          maxLength: 50
        'district':
          type: string
          maxLength: 20
        'city_id':
          type: integer
          format: int32
        'postal_code':
          type: string
          nullable: true
          maxLength: 10
        'phone':
          type: string
          maxLength: 20
    AddressListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AddressRead'
        meta: { type: object }
        links: { type: object }
    AddressCreatedResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            'address_id':
              type: integer
              format: int32
        meta: { type: object }
        links: { type: object }
