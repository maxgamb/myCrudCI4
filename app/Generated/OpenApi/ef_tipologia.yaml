openapi: 3.0.3
info:
  title: 'ef_tipologia API'
  version: 1.0.0
paths:
  /api/v1/ef_tipologia:
    get:
      summary: 'Elenco ef_tipologia'
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: 'filter[pax]'
          in: query
          schema:
            type: integer
            format: int32
        - name: sort
          in: query
          schema: { type: string, enum: ['pax'] }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: Elenco paginato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EfTipologiaListResponse'
    post:
      summary: Crea record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EfTipologiaCreate'
      responses:
        '201':
          description: Record creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EfTipologiaCreatedResponse'
        '422': { description: Errore di validazione }
  /api/v1/ef_tipologia/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Dettaglio record
      responses:
        '200':
          description: Record trovato
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/EfTipologiaRead'
        '404': { description: Record non trovato }
    put:
      summary: Aggiornamento completo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EfTipologiaUpdate'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    patch:
      summary: Aggiornamento parziale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EfTipologiaPatch'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    delete:
      summary: Elimina record
      responses:
        '204': { description: Record eliminato }
components:
  schemas:
    EfTipologiaRead:
      type: object
      properties:
        'pax':
          type: integer
          format: int32
        '4':
          type: integer
          format: int32
        '3':
          type: integer
          format: int32
        '2':
          type: integer
          format: int32
        '1':
          type: integer
          format: int32
    EfTipologiaCreate:
      type: object
      required:
        - 'pax'
        - '4'
        - '3'
        - '2'
        - '1'
      properties:
        'pax':
          type: integer
          format: int32
        '4':
          type: integer
          format: int32
        '3':
          type: integer
          format: int32
        '2':
          type: integer
          format: int32
        '1':
          type: integer
          format: int32
    EfTipologiaUpdate:
      type: object
      required:
        - 'pax'
        - '4'
        - '3'
        - '2'
        - '1'
      properties:
        'pax':
          type: integer
          format: int32
        '4':
          type: integer
          format: int32
        '3':
          type: integer
          format: int32
        '2':
          type: integer
          format: int32
        '1':
          type: integer
          format: int32
    EfTipologiaPatch:
      type: object
      properties:
        'pax':
          type: integer
          format: int32
        '4':
          type: integer
          format: int32
        '3':
          type: integer
          format: int32
        '2':
          type: integer
          format: int32
        '1':
          type: integer
          format: int32
    EfTipologiaListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/EfTipologiaRead'
        meta: { type: object }
        links: { type: object }
    EfTipologiaCreatedResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            'pax':
              type: integer
              format: int32
        meta: { type: object }
        links: { type: object }
