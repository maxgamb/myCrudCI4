openapi: 3.0.3
info:
  title: 'camere API'
  version: 1.0.0
paths:
  /api/v1/camere:
    get:
      summary: 'Elenco camere'
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: 'filter[camera_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[hotel_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[numero_camera]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[tipologia_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: sort
          in: query
          schema: { type: string, enum: ['camera_id', 'hotel_id', 'numero_camera', 'tipologia_id'] }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: Elenco paginato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CamereListResponse'
    post:
      summary: Crea record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CamereCreate'
      responses:
        '201':
          description: Record creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CamereCreatedResponse'
        '422': { description: Errore di validazione }
  /api/v1/camere/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Dettaglio record
      responses:
        '200':
          description: Record trovato
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CamereRead'
        '404': { description: Record non trovato }
    put:
      summary: Aggiornamento completo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CamereUpdate'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    patch:
      summary: Aggiornamento parziale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CamerePatch'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    delete:
      summary: Elimina record
      responses:
        '204': { description: Record eliminato }
components:
  schemas:
    CamereRead:
      type: object
      properties:
        'camera_id':
          type: integer
          format: int32
        'hotel_id':
          type: integer
          format: int32
        'numero_camera':
          type: integer
          format: int32
        'tipologia_camera':
          type: string
          maxLength: 100
        'tipologia_id':
          type: integer
          format: int32
        'camere_max_pax':
          type: integer
          format: int32
          nullable: true
        'camere_metri_quadri':
          type: number
          format: double
          nullable: true
        'camere_vista':
          type: string
          nullable: true
          maxLength: 100
        'camere_piano':
          type: number
          format: double
          nullable: true
        'camere_bagno':
          type: string
          nullable: true
          maxLength: 100
        'camere_edificio':
          type: string
          nullable: true
          maxLength: 3
        'review_tot':
          type: number
          format: double
          nullable: true
        'camere_utente_id':
          type: integer
          format: int32
          nullable: true
        'tipologia_camera_nome_tipologia':
          type: string
          nullable: true
    CamereCreate:
      type: object
      required:
        - 'camera_id'
      properties:
        'camera_id':
          type: integer
          format: int32
        'hotel_id':
          type: integer
          format: int32
        'numero_camera':
          type: integer
          format: int32
        'tipologia_camera':
          type: string
          maxLength: 100
        'tipologia_id':
          type: integer
          format: int32
        'camere_max_pax':
          type: integer
          format: int32
          nullable: true
        'camere_metri_quadri':
          type: number
          format: double
          nullable: true
        'camere_vista':
          type: string
          nullable: true
          maxLength: 100
        'camere_piano':
          type: number
          format: double
          nullable: true
        'camere_bagno':
          type: string
          nullable: true
          maxLength: 100
        'camere_edificio':
          type: string
          nullable: true
          maxLength: 3
        'review_tot':
          type: number
          format: double
          nullable: true
        'camere_utente_id':
          type: integer
          format: int32
          nullable: true
    CamereUpdate:
      type: object
      required:
        - 'camera_id'
      properties:
        'camera_id':
          type: integer
          format: int32
        'hotel_id':
          type: integer
          format: int32
        'numero_camera':
          type: integer
          format: int32
        'tipologia_camera':
          type: string
          maxLength: 100
        'tipologia_id':
          type: integer
          format: int32
        'camere_max_pax':
          type: integer
          format: int32
          nullable: true
        'camere_metri_quadri':
          type: number
          format: double
          nullable: true
        'camere_vista':
          type: string
          nullable: true
          maxLength: 100
        'camere_piano':
          type: number
          format: double
          nullable: true
        'camere_bagno':
          type: string
          nullable: true
          maxLength: 100
        'camere_edificio':
          type: string
          nullable: true
          maxLength: 3
        'review_tot':
          type: number
          format: double
          nullable: true
        'camere_utente_id':
          type: integer
          format: int32
          nullable: true
    CamerePatch:
      type: object
      properties:
        'camera_id':
          type: integer
          format: int32
        'hotel_id':
          type: integer
          format: int32
        'numero_camera':
          type: integer
          format: int32
        'tipologia_camera':
          type: string
          maxLength: 100
        'tipologia_id':
          type: integer
          format: int32
        'camere_max_pax':
          type: integer
          format: int32
          nullable: true
        'camere_metri_quadri':
          type: number
          format: double
          nullable: true
        'camere_vista':
          type: string
          nullable: true
          maxLength: 100
        'camere_piano':
          type: number
          format: double
          nullable: true
        'camere_bagno':
          type: string
          nullable: true
          maxLength: 100
        'camere_edificio':
          type: string
          nullable: true
          maxLength: 3
        'review_tot':
          type: number
          format: double
          nullable: true
        'camere_utente_id':
          type: integer
          format: int32
          nullable: true
    CamereListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CamereRead'
        meta: { type: object }
        links: { type: object }
    CamereCreatedResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            'camera_id':
              type: integer
              format: int32
        meta: { type: object }
        links: { type: object }
