openapi: 3.0.3
info:
  title: 'language API'
  version: 1.0.0
paths:
  /api/v1/language:
    get:
      summary: 'Elenco language'
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: 'filter[language_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: sort
          in: query
          schema: { type: string, enum: ['language_id'] }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: Elenco paginato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LanguageListResponse'
    post:
      summary: Crea record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LanguageCreate'
      responses:
        '201':
          description: Record creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LanguageCreatedResponse'
        '422': { description: Errore di validazione }
  /api/v1/language/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Dettaglio record
      responses:
        '200':
          description: Record trovato
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/LanguageRead'
        '404': { description: Record non trovato }
    put:
      summary: Aggiornamento completo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LanguageUpdate'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    patch:
      summary: Aggiornamento parziale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LanguagePatch'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    delete:
      summary: Elimina record
      responses:
        '204': { description: Record eliminato }
components:
  schemas:
    LanguageRead:
      type: object
      properties:
        'language_id':
          type: integer
          format: int32
        'name':
          type: string
          maxLength: 20
        'last_update':
          type: string
          format: date-time
    LanguageCreate:
      type: object
      required:
        - 'name'
      properties:
        'name':
          type: string
          maxLength: 20
    LanguageUpdate:
      type: object
      required:
        - 'name'
      properties:
        'name':
          type: string
          maxLength: 20
    LanguagePatch:
      type: object
      properties:
        'name':
          type: string
          maxLength: 20
    LanguageListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/LanguageRead'
        meta: { type: object }
        links: { type: object }
    LanguageCreatedResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            'language_id':
              type: integer
              format: int32
        meta: { type: object }
        links: { type: object }
