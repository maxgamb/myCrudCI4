openapi: 3.0.3
info:
  title: 'nazioni_bandiera API'
  version: 1.0.0
paths:
  /api/v1/nazioni_bandiera:
    get:
      summary: 'Elenco nazioni_bandiera'
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: 'filter[nazione_iso2]'
          in: query
          schema:
            type: string
        - name: sort
          in: query
          schema: { type: string, enum: ['nazione_iso2'] }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: Elenco paginato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NazioniBandieraListResponse'
    post:
      summary: Crea record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NazioniBandieraCreate'
      responses:
        '201':
          description: Record creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NazioniBandieraCreatedResponse'
        '422': { description: Errore di validazione }
  /api/v1/nazioni_bandiera/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Dettaglio record
      responses:
        '200':
          description: Record trovato
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/NazioniBandieraRead'
        '404': { description: Record non trovato }
    put:
      summary: Aggiornamento completo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NazioniBandieraUpdate'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    patch:
      summary: Aggiornamento parziale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NazioniBandieraPatch'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    delete:
      summary: Elimina record
      responses:
        '204': { description: Record eliminato }
components:
  schemas:
    NazioniBandieraRead:
      type: object
      properties:
        'nazione_iso2':
          type: string
          maxLength: 4
        'Nazioni_Codice':
          type: integer
          format: int32
        'emoji':
          type: string
          nullable: true
          maxLength: 8
        'cod_emoji':
          type: string
          nullable: true
          maxLength: 18
    NazioniBandieraCreate:
      type: object
      required:
        - 'Nazioni_Codice'
      properties:
        'nazione_iso2':
          type: string
          maxLength: 4
        'Nazioni_Codice':
          type: integer
          format: int32
        'emoji':
          type: string
          nullable: true
          maxLength: 8
        'cod_emoji':
          type: string
          nullable: true
          maxLength: 18
    NazioniBandieraUpdate:
      type: object
      required:
        - 'Nazioni_Codice'
      properties:
        'nazione_iso2':
          type: string
          maxLength: 4
        'Nazioni_Codice':
          type: integer
          format: int32
        'emoji':
          type: string
          nullable: true
          maxLength: 8
        'cod_emoji':
          type: string
          nullable: true
          maxLength: 18
    NazioniBandieraPatch:
      type: object
      properties:
        'nazione_iso2':
          type: string
          maxLength: 4
        'Nazioni_Codice':
          type: integer
          format: int32
        'emoji':
          type: string
          nullable: true
          maxLength: 8
        'cod_emoji':
          type: string
          nullable: true
          maxLength: 18
    NazioniBandieraListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/NazioniBandieraRead'
        meta: { type: object }
        links: { type: object }
    NazioniBandieraCreatedResponse:
      type: object
      properties:
        data:
          type: object
