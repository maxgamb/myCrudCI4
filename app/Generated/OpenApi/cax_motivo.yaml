openapi: 3.0.3
info:
  title: 'cax_motivo API'
  version: 1.0.0
paths:
  /api/v1/cax_motivo:
    get:
      summary: 'Elenco cax_motivo'
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: 'filter[cax_motivo_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: sort
          in: query
          schema: { type: string, enum: ['cax_motivo_id'] }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: Elenco paginato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaxMotivoListResponse'
    post:
      summary: Crea record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaxMotivoCreate'
      responses:
        '201':
          description: Record creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaxMotivoCreatedResponse'
        '422': { description: Errore di validazione }
  /api/v1/cax_motivo/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Dettaglio record
      responses:
        '200':
          description: Record trovato
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CaxMotivoRead'
        '404': { description: Record non trovato }
    put:
      summary: Aggiornamento completo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaxMotivoUpdate'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    patch:
      summary: Aggiornamento parziale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaxMotivoPatch'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    delete:
      summary: Elimina record
      responses:
        '204': { description: Record eliminato }
components:
  schemas:
    CaxMotivoRead:
      type: object
      properties:
        'cax_motivo_id':
          type: integer
          format: int32
        'etichetta':
          type: string
          maxLength: 250
        'data':
          type: string
          format: date-time
    CaxMotivoCreate:
      type: object
      required:
        - 'etichetta'
      properties:
        'etichetta':
          type: string
          maxLength: 250
        'data':
          type: string
          format: date-time
    CaxMotivoUpdate:
      type: object
      required:
        - 'etichetta'
      properties:
        'etichetta':
          type: string
          maxLength: 250
        'data':
          type: string
          format: date-time
    CaxMotivoPatch:
      type: object
      properties:
        'etichetta':
          type: string
          maxLength: 250
        'data':
          type: string
          format: date-time
    CaxMotivoListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CaxMotivoRead'
        meta: { type: object }
        links: { type: object }
    CaxMotivoCreatedResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            'cax_motivo_id':
              type: integer
              format: int32
        meta: { type: object }
        links: { type: object }
