openapi: 3.0.3
info:
  title: 'tip_doc API'
  version: 1.0.0
paths:
  /api/v1/tip_doc:
    get:
      summary: 'Elenco tip_doc'
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: 'filter[tip_doc_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[Doc_CodMin]'
          in: query
          schema:
            type: string
        - name: 'filter[Doc_Descrizione]'
          in: query
          schema:
            type: string
        - name: sort
          in: query
          schema: { type: string, enum: ['tip_doc_id', 'Doc_CodMin', 'Doc_Descrizione'] }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: Elenco paginato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TipDocListResponse'
    post:
      summary: Crea record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TipDocCreate'
      responses:
        '201':
          description: Record creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TipDocCreatedResponse'
        '422': { description: Errore di validazione }
  /api/v1/tip_doc/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Dettaglio record
      responses:
        '200':
          description: Record trovato
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/TipDocRead'
        '404': { description: Record non trovato }
    put:
      summary: Aggiornamento completo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TipDocUpdate'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    patch:
      summary: Aggiornamento parziale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TipDocPatch'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    delete:
      summary: Elimina record
      responses:
        '204': { description: Record eliminato }
components:
  schemas:
    TipDocRead:
      type: object
      properties:
        'tip_doc_id':
          type: integer
          format: int32
        'Doc_CodMin':
          type: string
          nullable: true
          maxLength: 30
        'Doc_Descrizione':
          type: string
          nullable: true
          maxLength: 250
    TipDocCreate:
      type: object
      properties:
        'Doc_CodMin':
          type: string
          nullable: true
          maxLength: 30
        'Doc_Descrizione':
          type: string
          nullable: true
          maxLength: 250
    TipDocUpdate:
      type: object
      properties:
        'Doc_CodMin':
          type: string
          nullable: true
          maxLength: 30
        'Doc_Descrizione':
          type: string
          nullable: true
          maxLength: 250
    TipDocPatch:
      type: object
      properties:
        'Doc_CodMin':
          type: string
          nullable: true
          maxLength: 30
        'Doc_Descrizione':
          type: string
          nullable: true
          maxLength: 250
    TipDocListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TipDocRead'
        meta: { type: object }
        links: { type: object }
    TipDocCreatedResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            'tip_doc_id':
              type: integer
              format: int32
        meta: { type: object }
        links: { type: object }
