openapi: 3.0.3
info:
  title: 'agenzia_listini API'
  version: 1.0.0
paths:
  /api/v1/agenzia_listini:
    get:
      summary: 'Elenco agenzia_listini'
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: 'filter[agenzia_listini_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[hotel_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: sort
          in: query
          schema: { type: string, enum: ['agenzia_listini_id', 'hotel_id'] }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: Elenco paginato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgenziaListiniListResponse'
    post:
      summary: Crea record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgenziaListiniCreate'
      responses:
        '201':
          description: Record creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgenziaListiniCreatedResponse'
        '422': { description: Errore di validazione }
  /api/v1/agenzia_listini/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Dettaglio record
      responses:
        '200':
          description: Record trovato
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AgenziaListiniRead'
        '404': { description: Record non trovato }
    put:
      summary: Aggiornamento completo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgenziaListiniUpdate'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    patch:
      summary: Aggiornamento parziale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgenziaListiniPatch'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    delete:
      summary: Elimina record
      responses:
        '204': { description: Record eliminato }
components:
  schemas:
    AgenziaListiniRead:
      type: object
      properties:
        'agenzia_listini_id':
          type: integer
          format: int32
        'hotel_id':
          type: integer
          format: int32
        'agenzia_listini_nome':
          type: string
          maxLength: 200
        'agenzia_listini_note':
          type: string
          maxLength: 250
        'agenzia_listini_datarecord':
          type: string
          format: date-time
    AgenziaListiniCreate:
      type: object
      properties:
        'hotel_id':
          type: integer
          format: int32
        'agenzia_listini_nome':
          type: string
          maxLength: 200
        'agenzia_listini_note':
          type: string
          maxLength: 250
        'agenzia_listini_datarecord':
          type: string
          format: date-time
    AgenziaListiniUpdate:
      type: object
      properties:
        'hotel_id':
          type: integer
          format: int32
        'agenzia_listini_nome':
          type: string
          maxLength: 200
        'agenzia_listini_note':
          type: string
          maxLength: 250
        'agenzia_listini_datarecord':
          type: string
          format: date-time
    AgenziaListiniPatch:
      type: object
      properties:
        'hotel_id':
          type: integer
          format: int32
        'agenzia_listini_nome':
          type: string
          maxLength: 200
        'agenzia_listini_note':
          type: string
          maxLength: 250
        'agenzia_listini_datarecord':
          type: string
          format: date-time
    AgenziaListiniListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AgenziaListiniRead'
        meta: { type: object }
        links: { type: object }
    AgenziaListiniCreatedResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            'agenzia_listini_id':
              type: integer
              format: int32
        meta: { type: object }
        links: { type: object }
