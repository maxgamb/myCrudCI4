openapi: 3.0.3
info:
  title: 'store API'
  version: 1.0.0
  description: 'Generated by myCrudCI4 from the current database schema and persisted CRUD configuration.'
tags:
  - name: 'Store'
    description: 'Operations for store'
paths:
  /api/v1/store:
    get:
      tags: ['Store']
      operationId: listStore
      summary: 'List store'
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: 'filter[store_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[manager_staff_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[address_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: sort
          in: query
          schema: { type: string, enum: ['store_id', 'manager_staff_id', 'address_id'] }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc], default: asc }
      responses:
        '200':
          description: Paginated list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreListResponse'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: ['Store']
      operationId: createStore
      summary: 'Create store record'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreCreatedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/store/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
    get:
      tags: ['Store']
      operationId: getStore
      summary: 'Get store record'
      responses:
        '200':
          description: Record found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: ['Store']
      operationId: updateStore
      summary: 'Replace/update store record'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: ['Store']
      operationId: patchStore
      summary: 'Partially update store record'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StorePatch'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: ['Store']
      operationId: deleteStore
      summary: 'Delete store record'
      responses:
        '204': { description: Deleted }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  schemas:
    StoreRead:
      type: object
      properties:
        'store_id':
          type: integer
          format: int32
        'manager_staff_id':
          type: integer
          format: int32
        'address_id':
          type: integer
          format: int32
        'last_update':
          type: string
          format: date-time
        'address_id__label':
          type: string
          nullable: true
        'manager_staff_id__label':
          type: string
          nullable: true
    StoreCreate:
      type: object
      required:
        - 'manager_staff_id'
        - 'address_id'
      properties:
        'manager_staff_id':
          type: integer
          format: int32
        'address_id':
          type: integer
          format: int32
    StoreUpdate:
      type: object
      required:
        - 'manager_staff_id'
        - 'address_id'
      properties:
        'manager_staff_id':
          type: integer
          format: int32
        'address_id':
          type: integer
          format: int32
    StorePatch:
      type: object
      properties:
        'manager_staff_id':
          type: integer
          format: int32
        'address_id':
          type: integer
          format: int32
    StoreResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/StoreRead'
        meta: { type: object }
        links: { type: object }
    StoreListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/StoreRead'
        meta:
          type: object
          properties:
            page: { type: integer }
            perPage: { type: integer }
            total: { type: integer }
            pageCount: { type: integer }
        links:
          type: object
          properties:
            self: { type: string, nullable: true }
            next: { type: string, nullable: true }
            prev: { type: string, nullable: true }
    StoreCreatedResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            'store_id':
              type: integer
              format: int32
        meta: { type: object }
        links: { type: object }
    StoreErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            fields:
              type: object
              additionalProperties:
                type: string
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StoreErrorResponse'
    NotFound:
      description: Record not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StoreErrorResponse'
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StoreErrorResponse'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StoreErrorResponse'
