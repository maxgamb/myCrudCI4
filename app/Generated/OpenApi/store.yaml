openapi: 3.0.3
info:
  title: 'store API'
  version: 1.0.0
paths:
  /api/v1/store:
    get:
      summary: 'Elenco store'
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: 'filter[store_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[manager_staff_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[address_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: sort
          in: query
          schema: { type: string, enum: ['store_id', 'manager_staff_id', 'address_id'] }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: Elenco paginato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreListResponse'
    post:
      summary: Crea record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreCreate'
      responses:
        '201':
          description: Record creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreCreatedResponse'
        '422': { description: Errore di validazione }
  /api/v1/store/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Dettaglio record
      responses:
        '200':
          description: Record trovato
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/StoreRead'
        '404': { description: Record non trovato }
    put:
      summary: Aggiornamento completo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreUpdate'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    patch:
      summary: Aggiornamento parziale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StorePatch'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    delete:
      summary: Elimina record
      responses:
        '204': { description: Record eliminato }
components:
  schemas:
    StoreRead:
      type: object
      properties:
        'store_id':
          type: integer
          format: int32
        'manager_staff_id':
          type: integer
          format: int32
        'address_id':
          type: integer
          format: int32
        'last_update':
          type: string
          format: date-time
        'address_id__label':
          type: string
          nullable: true
        'manager_staff_id__label':
          type: string
          nullable: true
    StoreCreate:
      type: object
      required:
        - 'manager_staff_id'
        - 'address_id'
      properties:
        'manager_staff_id':
          type: integer
          format: int32
        'address_id':
          type: integer
          format: int32
    StoreUpdate:
      type: object
      required:
        - 'manager_staff_id'
        - 'address_id'
      properties:
        'manager_staff_id':
          type: integer
          format: int32
        'address_id':
          type: integer
          format: int32
    StorePatch:
      type: object
      properties:
        'manager_staff_id':
          type: integer
          format: int32
        'address_id':
          type: integer
          format: int32
    StoreListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/StoreRead'
        meta: { type: object }
        links: { type: object }
    StoreCreatedResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            'store_id':
              type: integer
              format: int32
        meta: { type: object }
        links: { type: object }
