openapi: 3.0.3
info:
  title: 'conti API'
  version: 1.0.0
paths:
  /api/v1/conti:
    get:
      summary: 'Elenco conti'
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: 'filter[conto_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[hotel_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[foglio_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[in_conto]'
          in: query
          schema:
            type: string
            format: date
        - name: 'filter[out_preno]'
          in: query
          schema:
            type: string
            format: date
        - name: 'filter[out_conto]'
          in: query
          schema:
            type: string
            format: date
        - name: 'filter[preno_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[camera_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[tipologia_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[conti_stato_camere]'
          in: query
          schema:
            type: integer
            format: int32
        - name: sort
          in: query
          schema: { type: string, enum: ['conto_id', 'hotel_id', 'foglio_id', 'in_conto', 'out_preno', 'out_conto', 'preno_id', 'camera_id', 'tipologia_id', 'conti_stato_camere'] }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: Elenco paginato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContiListResponse'
    post:
      summary: Crea record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContiCreate'
      responses:
        '201':
          description: Record creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContiCreatedResponse'
        '422': { description: Errore di validazione }
  /api/v1/conti/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Dettaglio record
      responses:
        '200':
          description: Record trovato
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ContiRead'
        '404': { description: Record non trovato }
    put:
      summary: Aggiornamento completo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContiUpdate'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    patch:
      summary: Aggiornamento parziale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContiPatch'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    delete:
      summary: Elimina record
      responses:
        '204': { description: Record eliminato }
