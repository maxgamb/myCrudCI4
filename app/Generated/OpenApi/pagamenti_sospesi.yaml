openapi: 3.0.3
info:
  title: 'pagamenti_sospesi API'
  version: 1.0.0
paths:
  /api/v1/pagamenti_sospesi:
    get:
      summary: 'Elenco pagamenti_sospesi'
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: 'filter[pagamento_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[hotel_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[sospeso_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: sort
          in: query
          schema: { type: string, enum: ['pagamento_id', 'hotel_id', 'sospeso_id'] }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: Elenco paginato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagamentiSospesiListResponse'
    post:
      summary: Crea record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PagamentiSospesiCreate'
      responses:
        '201':
          description: Record creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagamentiSospesiCreatedResponse'
        '422': { description: Errore di validazione }
  /api/v1/pagamenti_sospesi/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Dettaglio record
      responses:
        '200':
          description: Record trovato
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PagamentiSospesiRead'
        '404': { description: Record non trovato }
    put:
      summary: Aggiornamento completo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PagamentiSospesiUpdate'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    patch:
      summary: Aggiornamento parziale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PagamentiSospesiPatch'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    delete:
      summary: Elimina record
      responses:
        '204': { description: Record eliminato }
components:
  schemas:
    PagamentiSospesiRead:
      type: object
      properties:
        'pagamento_id':
          type: integer
          format: int32
        'hotel_id':
          type: integer
          format: int32
        'sospeso_id':
          type: integer
          format: int32
        'paga_sosp_importo':
          type: number
          format: double
        'data_pagamento':
          type: string
          format: date
        'paga_modalita':
          type: string
          nullable: true
          maxLength: 10
        'data_rec_paga_sosp':
          type: string
          format: date-time
        'pagamenti_sospesi_utente_id':
          type: integer
          format: int32
          nullable: true
        'sospesi_sospeso_id':
          type: string
          nullable: true
    PagamentiSospesiCreate:
      type: object
      required:
        - 'data_pagamento'
      properties:
        'hotel_id':
          type: integer
          format: int32
        'sospeso_id':
          type: integer
          format: int32
        'paga_sosp_importo':
          type: number
          format: double
        'data_pagamento':
          type: string
          format: date
        'paga_modalita':
          type: string
          nullable: true
          maxLength: 10
        'data_rec_paga_sosp':
          type: string
          format: date-time
        'pagamenti_sospesi_utente_id':
          type: integer
          format: int32
          nullable: true
    PagamentiSospesiUpdate:
      type: object
      required:
        - 'data_pagamento'
      properties:
        'hotel_id':
          type: integer
          format: int32
        'sospeso_id':
          type: integer
          format: int32
        'paga_sosp_importo':
          type: number
          format: double
        'data_pagamento':
          type: string
          format: date
        'paga_modalita':
          type: string
          nullable: true
          maxLength: 10
        'data_rec_paga_sosp':
          type: string
          format: date-time
        'pagamenti_sospesi_utente_id':
          type: integer
          format: int32
          nullable: true
    PagamentiSospesiPatch:
      type: object
      properties:
        'hotel_id':
          type: integer
          format: int32
        'sospeso_id':
          type: integer
          format: int32
        'paga_sosp_importo':
          type: number
          format: double
        'data_pagamento':
          type: string
          format: date
        'paga_modalita':
          type: string
          nullable: true
          maxLength: 10
        'data_rec_paga_sosp':
          type: string
          format: date-time
        'pagamenti_sospesi_utente_id':
          type: integer
          format: int32
          nullable: true
    PagamentiSospesiListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PagamentiSospesiRead'
        meta: { type: object }
        links: { type: object }
    PagamentiSospesiCreatedResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            'pagamento_id':
              type: integer
              format: int32
        meta: { type: object }
        links: { type: object }
