openapi: 3.0.3
info:
  title: 'token API'
  version: 1.0.0
paths:
  /api/v1/token:
    get:
      summary: 'Elenco token'
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: 'filter[token_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[token_data]'
          in: query
          schema:
            type: string
            format: date
        - name: sort
          in: query
          schema: { type: string, enum: ['token_id', 'token_data'] }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: Elenco paginato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenListResponse'
    post:
      summary: Crea record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenCreate'
      responses:
        '201':
          description: Record creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenCreatedResponse'
        '422': { description: Errore di validazione }
  /api/v1/token/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Dettaglio record
      responses:
        '200':
          description: Record trovato
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/TokenRead'
        '404': { description: Record non trovato }
    put:
      summary: Aggiornamento completo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenUpdate'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    patch:
      summary: Aggiornamento parziale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenPatch'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    delete:
      summary: Elimina record
      responses:
        '204': { description: Record eliminato }
components:
  schemas:
    TokenRead:
      type: object
      properties:
        'token_id':
          type: integer
          format: int32
        'hotel_id':
          type: integer
          format: int32
        'token':
          type: string
          maxLength: 250
        'token_data':
          type: string
          format: date
    TokenCreate:
      type: object
      required:
        - 'hotel_id'
        - 'token'
        - 'token_data'
      properties:
        'hotel_id':
          type: integer
          format: int32
        'token':
          type: string
          maxLength: 250
        'token_data':
          type: string
          format: date
    TokenUpdate:
      type: object
      required:
        - 'hotel_id'
        - 'token'
        - 'token_data'
      properties:
        'hotel_id':
          type: integer
          format: int32
        'token':
          type: string
          maxLength: 250
        'token_data':
          type: string
          format: date
    TokenPatch:
      type: object
      properties:
        'hotel_id':
          type: integer
          format: int32
        'token':
          type: string
          maxLength: 250
        'token_data':
          type: string
          format: date
    TokenListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TokenRead'
        meta: { type: object }
        links: { type: object }
    TokenCreatedResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            'token_id':
              type: integer
              format: int32
        meta: { type: object }
        links: { type: object }
