openapi: 3.0.3
info:
  title: 'rental API'
  version: 1.0.0
paths:
  /api/v1/rental:
    get:
      summary: 'Elenco rental'
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: 'filter[rental_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[rental_date]'
          in: query
          schema:
            type: string
            format: date-time
        - name: 'filter[inventory_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[customer_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[staff_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: sort
          in: query
          schema: { type: string, enum: ['rental_id', 'rental_date', 'inventory_id', 'customer_id', 'staff_id'] }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: Elenco paginato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentalListResponse'
    post:
      summary: Crea record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RentalCreate'
      responses:
        '201':
          description: Record creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentalCreatedResponse'
        '422': { description: Errore di validazione }
  /api/v1/rental/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Dettaglio record
      responses:
        '200':
          description: Record trovato
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/RentalRead'
        '404': { description: Record non trovato }
    put:
      summary: Aggiornamento completo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RentalUpdate'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    patch:
      summary: Aggiornamento parziale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RentalPatch'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    delete:
      summary: Elimina record
      responses:
        '204': { description: Record eliminato }
components:
  schemas:
    RentalRead:
      type: object
      properties:
        'rental_id':
          type: integer
          format: int32
        'rental_date':
          type: string
          format: date-time
        'inventory_id':
          type: integer
          format: int32
        'customer_id':
          type: integer
          format: int32
        'return_date':
          type: string
          format: date-time
          nullable: true
        'staff_id':
          type: integer
          format: int32
        'last_update':
          type: string
          format: date-time
        'customer_id__label':
          type: string
          nullable: true
        'inventory_id__label':
          type: string
          nullable: true
        'staff_id__label':
          type: string
          nullable: true
    RentalCreate:
      type: object
      required:
        - 'rental_date'
        - 'inventory_id'
        - 'customer_id'
        - 'staff_id'
      properties:
        'rental_date':
          type: string
          format: date-time
        'inventory_id':
          type: integer
          format: int32
        'customer_id':
          type: integer
          format: int32
        'return_date':
          type: string
          format: date-time
          nullable: true
        'staff_id':
          type: integer
          format: int32
    RentalUpdate:
      type: object
      required:
        - 'rental_date'
        - 'inventory_id'
        - 'customer_id'
        - 'staff_id'
      properties:
        'rental_date':
          type: string
          format: date-time
        'inventory_id':
          type: integer
          format: int32
        'customer_id':
          type: integer
          format: int32
        'return_date':
          type: string
          format: date-time
          nullable: true
        'staff_id':
          type: integer
          format: int32
    RentalPatch:
      type: object
      properties:
        'rental_date':
          type: string
          format: date-time
        'inventory_id':
          type: integer
          format: int32
        'customer_id':
          type: integer
          format: int32
        'return_date':
          type: string
          format: date-time
          nullable: true
        'staff_id':
          type: integer
          format: int32
    RentalListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/RentalRead'
        meta: { type: object }
        links: { type: object }
    RentalCreatedResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            'rental_id':
              type: integer
              format: int32
        meta: { type: object }
        links: { type: object }
