openapi: 3.0.3
info:
  title: 'staff API'
  version: 1.0.0
paths:
  /api/v1/staff:
    get:
      summary: 'Elenco staff'
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: 'filter[staff_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[address_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[store_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: sort
          in: query
          schema: { type: string, enum: ['staff_id', 'address_id', 'store_id'] }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: Elenco paginato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffListResponse'
    post:
      summary: Crea record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffCreate'
      responses:
        '201':
          description: Record creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffCreatedResponse'
        '422': { description: Errore di validazione }
  /api/v1/staff/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Dettaglio record
      responses:
        '200':
          description: Record trovato
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/StaffRead'
        '404': { description: Record non trovato }
    put:
      summary: Aggiornamento completo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffUpdate'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    patch:
      summary: Aggiornamento parziale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffPatch'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    delete:
      summary: Elimina record
      responses:
        '204': { description: Record eliminato }
components:
  schemas:
    StaffRead:
      type: object
      properties:
        'staff_id':
          type: integer
          format: int32
        'first_name':
          type: string
          maxLength: 45
        'last_name':
          type: string
          maxLength: 45
        'address_id':
          type: integer
          format: int32
        'email':
          type: string
          nullable: true
          maxLength: 50
        'store_id':
          type: integer
          format: int32
        'active':
          type: boolean
        'username':
          type: string
          maxLength: 16
        'password':
          type: string
          nullable: true
          maxLength: 40
        'last_update':
          type: string
          format: date-time
        'address_id__label':
          type: string
          nullable: true
        'store_id__label':
          type: string
          nullable: true
    StaffCreate:
      type: object
      required:
        - 'first_name'
        - 'last_name'
        - 'address_id'
        - 'store_id'
        - 'username'
      properties:
        'first_name':
          type: string
          maxLength: 45
        'last_name':
          type: string
          maxLength: 45
        'address_id':
          type: integer
          format: int32
        'picture':
          type: string
          format: byte
          nullable: true
          maxLength: 65535
        'email':
          type: string
          nullable: true
          maxLength: 50
        'store_id':
          type: integer
          format: int32
        'active':
          type: boolean
        'username':
          type: string
          maxLength: 16
        'password':
          type: string
          nullable: true
          maxLength: 40
    StaffUpdate:
      type: object
      required:
        - 'first_name'
        - 'last_name'
        - 'address_id'
        - 'store_id'
        - 'username'
      properties:
        'first_name':
          type: string
          maxLength: 45
        'last_name':
          type: string
          maxLength: 45
        'address_id':
          type: integer
          format: int32
        'picture':
          type: string
          format: byte
          nullable: true
          maxLength: 65535
        'email':
          type: string
          nullable: true
          maxLength: 50
        'store_id':
          type: integer
          format: int32
        'active':
          type: boolean
        'username':
          type: string
          maxLength: 16
        'password':
          type: string
          nullable: true
          maxLength: 40
    StaffPatch:
      type: object
      properties:
        'first_name':
          type: string
          maxLength: 45
        'last_name':
          type: string
          maxLength: 45
        'address_id':
          type: integer
          format: int32
        'picture':
          type: string
          format: byte
          nullable: true
          maxLength: 65535
        'email':
          type: string
          nullable: true
          maxLength: 50
        'store_id':
          type: integer
          format: int32
        'active':
          type: boolean
        'username':
          type: string
          maxLength: 16
        'password':
          type: string
          nullable: true
          maxLength: 40
    StaffListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/StaffRead'
        meta: { type: object }
        links: { type: object }
    StaffCreatedResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            'staff_id':
              type: integer
              format: int32
        meta: { type: object }
        links: { type: object }
