openapi: 3.0.3
info:
  title: 'actor_info API'
  version: 1.0.0
paths:
  /api/v1/actor_info:
    get:
      summary: 'Elenco read-only actor_info'
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: sort
          in: query
          schema: { type: string, enum: ['actor_id'] }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: Elenco paginato read-only
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActorInfoListResponse'
components:
  schemas:
    ActorInfoRead:
      type: object
      properties:
        'actor_id':
          type: integer
          format: int32
        'first_name':
          type: string
          maxLength: 45
        'last_name':
          type: string
          maxLength: 45
        'film_info':
          type: string
          nullable: true
          maxLength: 65535
    ActorInfoListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ActorInfoRead'
        meta: { type: object }
        links: { type: object }
