openapi: 3.0.3
info:
  title: 'tipoallogiati API'
  version: 1.0.0
paths:
  /api/v1/tipoallogiati:
    get:
      summary: 'Elenco tipoallogiati'
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: sort
          in: query
          schema: { type: string, enum: ['Tip_all_Cod'] }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: Elenco paginato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TipoallogiatiListResponse'
    post:
      summary: Crea record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TipoallogiatiCreate'
      responses:
        '201':
          description: Record creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TipoallogiatiCreatedResponse'
        '422': { description: Errore di validazione }
  /api/v1/tipoallogiati/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Dettaglio record
      responses:
        '200':
          description: Record trovato
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/TipoallogiatiRead'
        '404': { description: Record non trovato }
    put:
      summary: Aggiornamento completo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TipoallogiatiUpdate'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    patch:
      summary: Aggiornamento parziale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TipoallogiatiPatch'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    delete:
      summary: Elimina record
      responses:
        '204': { description: Record eliminato }
components:
  schemas:
    TipoallogiatiRead:
      type: object
      properties:
        'Tip_all_Cod':
          type: string
          nullable: true
          maxLength: 30
        'Tip_all_Descrizione':
          type: string
          nullable: true
          maxLength: 250
    TipoallogiatiCreate:
      type: object
      properties:
        'Tip_all_Cod':
          type: string
          nullable: true
          maxLength: 30
        'Tip_all_Descrizione':
          type: string
          nullable: true
          maxLength: 250
    TipoallogiatiUpdate:
      type: object
      properties:
        'Tip_all_Cod':
          type: string
          nullable: true
          maxLength: 30
        'Tip_all_Descrizione':
          type: string
          nullable: true
          maxLength: 250
    TipoallogiatiPatch:
      type: object
      properties:
        'Tip_all_Cod':
          type: string
          nullable: true
          maxLength: 30
        'Tip_all_Descrizione':
          type: string
          nullable: true
          maxLength: 250
    TipoallogiatiListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TipoallogiatiRead'
        meta: { type: object }
        links: { type: object }
    TipoallogiatiCreatedResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            'Tip_all_Cod':
              type: string
              nullable: true
              maxLength: 30
        meta: { type: object }
        links: { type: object }
