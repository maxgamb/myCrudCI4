openapi: 3.0.3
info:
  title: 'codici_stato API'
  version: 1.0.0
paths:
  /api/v1/codici_stato:
    get:
      summary: 'Elenco codici_stato'
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: sort
          in: query
          schema: { type: string, enum: ['cod_stato'] }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: Elenco paginato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodiciStatoListResponse'
    post:
      summary: Crea record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodiciStatoCreate'
      responses:
        '201':
          description: Record creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodiciStatoCreatedResponse'
        '422': { description: Errore di validazione }
  /api/v1/codici_stato/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Dettaglio record
      responses:
        '200':
          description: Record trovato
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CodiciStatoRead'
        '404': { description: Record non trovato }
    put:
      summary: Aggiornamento completo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodiciStatoUpdate'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    patch:
      summary: Aggiornamento parziale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodiciStatoPatch'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    delete:
      summary: Elimina record
      responses:
        '204': { description: Record eliminato }
components:
  schemas:
    CodiciStatoRead:
      type: object
      properties:
        'cod_stato':
          type: string
          maxLength: 3
        'stato':
          type: string
          maxLength: 100
        'stato_commento':
          type: string
          maxLength: 200
    CodiciStatoCreate:
      type: object
      properties:
        'cod_stato':
          type: string
          maxLength: 3
        'stato':
          type: string
          maxLength: 100
        'stato_commento':
          type: string
          maxLength: 200
    CodiciStatoUpdate:
      type: object
      properties:
        'cod_stato':
          type: string
          maxLength: 3
        'stato':
          type: string
          maxLength: 100
        'stato_commento':
          type: string
          maxLength: 200
    CodiciStatoPatch:
      type: object
      properties:
        'cod_stato':
          type: string
          maxLength: 3
        'stato':
          type: string
          maxLength: 100
        'stato_commento':
          type: string
          maxLength: 200
    CodiciStatoListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CodiciStatoRead'
        meta: { type: object }
        links: { type: object }
    CodiciStatoCreatedResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            'cod_stato':
              type: string
              maxLength: 3
        meta: { type: object }
        links: { type: object }
