openapi: 3.0.3
info:
  title: 'city API'
  version: 1.0.0
  description: 'Generated by myCrudCI4 from the current database schema and persisted CRUD configuration.'
tags:
  - name: 'City'
    description: 'Operations for city'
paths:
  /api/v1/city:
    get:
      tags: ['City']
      operationId: listCity
      summary: 'List city'
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: 'filter[city_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[country_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: sort
          in: query
          schema: { type: string, enum: ['city_id', 'country_id'] }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc], default: asc }
      responses:
        '200':
          description: Paginated list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CityListResponse'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: ['City']
      operationId: createCity
      summary: 'Create city record'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CityCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CityCreatedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/city/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
    get:
      tags: ['City']
      operationId: getCity
      summary: 'Get city record'
      responses:
        '200':
          description: Record found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CityResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: ['City']
      operationId: updateCity
      summary: 'Replace/update city record'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CityUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CityResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: ['City']
      operationId: patchCity
      summary: 'Partially update city record'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CityPatch'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CityResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: ['City']
      operationId: deleteCity
      summary: 'Delete city record'
      responses:
        '204': { description: Deleted }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  schemas:
    CityRead:
      type: object
      properties:
        'city_id':
          type: integer
          format: int32
        'city':
          type: string
          maxLength: 50
        'country_id':
          type: integer
          format: int32
        'last_update':
          type: string
          format: date-time
        'country_id__label':
          type: string
          nullable: true
    CityCreate:
      type: object
      required:
        - 'city'
        - 'country_id'
      properties:
        'city':
          type: string
          maxLength: 50
        'country_id':
          type: integer
          format: int32
    CityUpdate:
      type: object
      required:
        - 'city'
        - 'country_id'
      properties:
        'city':
          type: string
          maxLength: 50
        'country_id':
          type: integer
          format: int32
    CityPatch:
      type: object
      properties:
        'city':
          type: string
          maxLength: 50
        'country_id':
          type: integer
          format: int32
    CityResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/CityRead'
        meta: { type: object }
        links: { type: object }
    CityListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CityRead'
        meta:
          type: object
          properties:
            page: { type: integer }
            perPage: { type: integer }
            total: { type: integer }
            pageCount: { type: integer }
        links:
          type: object
          properties:
            self: { type: string, nullable: true }
            next: { type: string, nullable: true }
            prev: { type: string, nullable: true }
    CityCreatedResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            'city_id':
              type: integer
              format: int32
        meta: { type: object }
        links: { type: object }
    CityErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            fields:
              type: object
              additionalProperties:
                type: string
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CityErrorResponse'
    NotFound:
      description: Record not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CityErrorResponse'
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CityErrorResponse'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CityErrorResponse'
