openapi: 3.0.3
info:
  title: 'tex_lingue API'
  version: 1.0.0
paths:
  /api/v1/tex_lingue:
    get:
      summary: 'Elenco tex_lingue'
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: 'filter[tex_lingue_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[etichetta_lg]'
          in: query
          schema:
            type: string
        - name: 'filter[reparto_id]'
          in: query
          schema:
            type: string
        - name: sort
          in: query
          schema: { type: string, enum: ['tex_lingue_id', 'etichetta_lg', 'reparto_id'] }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: Elenco paginato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TexLingueListResponse'
    post:
      summary: Crea record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TexLingueCreate'
      responses:
        '201':
          description: Record creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TexLingueCreatedResponse'
        '422': { description: Errore di validazione }
  /api/v1/tex_lingue/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Dettaglio record
      responses:
        '200':
          description: Record trovato
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/TexLingueRead'
        '404': { description: Record non trovato }
    put:
      summary: Aggiornamento completo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TexLingueUpdate'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    patch:
      summary: Aggiornamento parziale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TexLinguePatch'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    delete:
      summary: Elimina record
      responses:
        '204': { description: Record eliminato }
