          type: string
          maxLength: 255
        'en':
          type: string
          maxLength: 16777215
        'it':
          type: string
          maxLength: 16777215
        'es':
          type: string
          maxLength: 16777215
        'fr':
          type: string
          maxLength: 16777215
        'de':
          type: string
          maxLength: 16777215
        'reparto_id':
          type: string
          nullable: true
          maxLength: 50
    TexLinguePatch:
      type: object
