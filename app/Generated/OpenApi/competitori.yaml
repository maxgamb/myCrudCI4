openapi: 3.0.3
info:
  title: 'competitori API'
  version: 1.0.0
paths:
  /api/v1/competitori:
    get:
      summary: 'Elenco competitori'
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: 'filter[competitore_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[hotel_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: sort
          in: query
          schema: { type: string, enum: ['competitore_id', 'hotel_id'] }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: Elenco paginato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompetitoriListResponse'
    post:
      summary: Crea record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompetitoriCreate'
      responses:
        '201':
          description: Record creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompetitoriCreatedResponse'
        '422': { description: Errore di validazione }
  /api/v1/competitori/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Dettaglio record
      responses:
        '200':
          description: Record trovato
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CompetitoriRead'
        '404': { description: Record non trovato }
    put:
      summary: Aggiornamento completo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompetitoriUpdate'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    patch:
      summary: Aggiornamento parziale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompetitoriPatch'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    delete:
      summary: Elimina record
      responses:
        '204': { description: Record eliminato }
components:
  schemas:
    CompetitoriRead:
      type: object
      properties:
        'competitore_id':
          type: integer
          format: int32
        'hotel_id':
          type: integer
          format: int32
        'livello_dicompetizione':
          type: integer
          format: int32
        'competitore_nome':
          type: string
          maxLength: 250
        'competitore_venere_id':
          type: integer
          format: int32
        'qualita_trivago':
          type: integer
          format: int32
    CompetitoriCreate:
      type: object
      required:
        - 'hotel_id'
        - 'livello_dicompetizione'
        - 'competitore_nome'
        - 'competitore_venere_id'
        - 'qualita_trivago'
      properties:
        'hotel_id':
          type: integer
          format: int32
        'livello_dicompetizione':
          type: integer
          format: int32
        'competitore_nome':
          type: string
          maxLength: 250
        'competitore_venere_id':
          type: integer
          format: int32
        'qualita_trivago':
          type: integer
          format: int32
    CompetitoriUpdate:
      type: object
      required:
        - 'hotel_id'
        - 'livello_dicompetizione'
        - 'competitore_nome'
        - 'competitore_venere_id'
        - 'qualita_trivago'
      properties:
        'hotel_id':
          type: integer
          format: int32
        'livello_dicompetizione':
          type: integer
          format: int32
        'competitore_nome':
          type: string
          maxLength: 250
        'competitore_venere_id':
          type: integer
          format: int32
        'qualita_trivago':
          type: integer
          format: int32
    CompetitoriPatch:
      type: object
      properties:
        'hotel_id':
          type: integer
          format: int32
        'livello_dicompetizione':
          type: integer
          format: int32
        'competitore_nome':
          type: string
          maxLength: 250
        'competitore_venere_id':
          type: integer
          format: int32
        'qualita_trivago':
          type: integer
          format: int32
    CompetitoriListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CompetitoriRead'
        meta: { type: object }
        links: { type: object }
    CompetitoriCreatedResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            'competitore_id':
              type: integer
              format: int32
        meta: { type: object }
        links: { type: object }
