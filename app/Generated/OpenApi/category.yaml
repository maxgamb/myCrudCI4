openapi: 3.0.3
info:
  title: 'category API'
  version: 1.0.0
paths:
  /api/v1/category:
    get:
      summary: 'Elenco category'
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: 'filter[category_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: sort
          in: query
          schema: { type: string, enum: ['category_id'] }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: Elenco paginato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryListResponse'
    post:
      summary: Crea record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryCreate'
      responses:
        '201':
          description: Record creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryCreatedResponse'
        '422': { description: Errore di validazione }
  /api/v1/category/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Dettaglio record
      responses:
        '200':
          description: Record trovato
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CategoryRead'
        '404': { description: Record non trovato }
    put:
      summary: Aggiornamento completo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryUpdate'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    patch:
      summary: Aggiornamento parziale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryPatch'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    delete:
      summary: Elimina record
      responses:
        '204': { description: Record eliminato }
components:
  schemas:
    CategoryRead:
      type: object
      properties:
        'category_id':
          type: integer
          format: int32
        'name':
          type: string
          maxLength: 25
        'last_update':
          type: string
          format: date-time
    CategoryCreate:
      type: object
      required:
        - 'name'
      properties:
        'name':
          type: string
          maxLength: 25
    CategoryUpdate:
      type: object
      required:
        - 'name'
      properties:
        'name':
          type: string
          maxLength: 25
    CategoryPatch:
      type: object
      properties:
        'name':
          type: string
          maxLength: 25
    CategoryListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CategoryRead'
        meta: { type: object }
        links: { type: object }
    CategoryCreatedResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            'category_id':
              type: integer
              format: int32
        meta: { type: object }
        links: { type: object }
