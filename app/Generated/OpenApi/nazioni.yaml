openapi: 3.0.3
info:
  title: 'nazioni API'
  version: 1.0.0
paths:
  /api/v1/nazioni:
    get:
      summary: 'Elenco nazioni'
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: 'filter[Nazioni_Id_Codice]'
          in: query
          schema:
            type: string
        - name: sort
          in: query
          schema: { type: string, enum: ['Nazioni_Id_Codice'] }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: Elenco paginato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NazioniListResponse'
    post:
      summary: Crea record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NazioniCreate'
      responses:
        '201':
          description: Record creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NazioniCreatedResponse'
        '422': { description: Errore di validazione }
  /api/v1/nazioni/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Dettaglio record
      responses:
        '200':
          description: Record trovato
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/NazioniRead'
        '404': { description: Record non trovato }
    put:
      summary: Aggiornamento completo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NazioniUpdate'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    patch:
      summary: Aggiornamento parziale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NazioniPatch'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    delete:
      summary: Elimina record
      responses:
        '204': { description: Record eliminato }
components:
  schemas:
    NazioniRead:
      type: object
      properties:
        'Nazioni_Id_Codice':
          type: string
          maxLength: 30
        'Nazioni_Codice':
          type: string
          nullable: true
          maxLength: 30
        'Nazioni_Descrizione':
          type: string
          nullable: true
          maxLength: 250
        'Nazioni_Targa':
          type: string
          nullable: true
          maxLength: 30
        'Nazioni_ColExcel':
          type: string
          nullable: true
          maxLength: 30
        'EN_Country':
          type: string
          nullable: true
          maxLength: 250
    NazioniCreate:
      type: object
      properties:
        'Nazioni_Id_Codice':
          type: string
          maxLength: 30
        'Nazioni_Codice':
          type: string
          nullable: true
          maxLength: 30
        'Nazioni_Descrizione':
          type: string
          nullable: true
          maxLength: 250
        'Nazioni_Targa':
          type: string
          nullable: true
          maxLength: 30
        'Nazioni_ColExcel':
          type: string
          nullable: true
          maxLength: 30
        'EN_Country':
          type: string
          nullable: true
          maxLength: 250
    NazioniUpdate:
      type: object
      properties:
        'Nazioni_Id_Codice':
          type: string
          maxLength: 30
        'Nazioni_Codice':
          type: string
          nullable: true
          maxLength: 30
        'Nazioni_Descrizione':
          type: string
          nullable: true
          maxLength: 250
        'Nazioni_Targa':
          type: string
          nullable: true
          maxLength: 30
        'Nazioni_ColExcel':
          type: string
          nullable: true
          maxLength: 30
        'EN_Country':
          type: string
          nullable: true
          maxLength: 250
    NazioniPatch:
      type: object
      properties:
        'Nazioni_Id_Codice':
          type: string
          maxLength: 30
        'Nazioni_Codice':
          type: string
          nullable: true
          maxLength: 30
        'Nazioni_Descrizione':
          type: string
          nullable: true
          maxLength: 250
        'Nazioni_Targa':
          type: string
          nullable: true
          maxLength: 30
        'Nazioni_ColExcel':
          type: string
          nullable: true
          maxLength: 30
        'EN_Country':
          type: string
          nullable: true
          maxLength: 250
    NazioniListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/NazioniRead'
        meta: { type: object }
        links: { type: object }
    NazioniCreatedResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            'Nazioni_Id_Codice':
              type: string
              maxLength: 30
        meta: { type: object }
        links: { type: object }
