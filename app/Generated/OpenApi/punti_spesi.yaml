openapi: 3.0.3
info:
  title: 'punti_spesi API'
  version: 1.0.0
paths:
  /api/v1/punti_spesi:
    get:
      summary: 'Elenco punti_spesi'
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: 'filter[punti_spesi_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[hotel_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[cliente_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[conto_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: sort
          in: query
          schema: { type: string, enum: ['punti_spesi_id', 'hotel_id', 'cliente_id', 'conto_id'] }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: Elenco paginato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PuntiSpesiListResponse'
    post:
      summary: Crea record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PuntiSpesiCreate'
      responses:
        '201':
          description: Record creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PuntiSpesiCreatedResponse'
        '422': { description: Errore di validazione }
  /api/v1/punti_spesi/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Dettaglio record
      responses:
        '200':
          description: Record trovato
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PuntiSpesiRead'
        '404': { description: Record non trovato }
    put:
      summary: Aggiornamento completo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PuntiSpesiUpdate'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    patch:
      summary: Aggiornamento parziale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PuntiSpesiPatch'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    delete:
      summary: Elimina record
      responses:
        '204': { description: Record eliminato }
components:
  schemas:
    PuntiSpesiRead:
      type: object
      properties:
        'punti_spesi_id':
          type: integer
          format: int32
        'hotel_id':
          type: integer
          format: int32
        'cliente_id':
          type: integer
          format: int32
        'conto_id':
          type: integer
          format: int32
        'punti':
          type: integer
          format: int32
        'data':
          type: string
          format: date
        'utente_id':
          type: integer
          format: int32
        'clienti_camara_tipologia':
          type: string
          nullable: true
        'conti_trattamento_sog':
          type: string
          nullable: true
    PuntiSpesiCreate:
      type: object
      required:
        - 'hotel_id'
        - 'cliente_id'
        - 'conto_id'
        - 'punti'
        - 'data'
        - 'utente_id'
      properties:
        'hotel_id':
          type: integer
          format: int32
        'cliente_id':
          type: integer
          format: int32
        'conto_id':
          type: integer
          format: int32
        'punti':
          type: integer
          format: int32
        'data':
          type: string
          format: date
        'utente_id':
          type: integer
          format: int32
    PuntiSpesiUpdate:
      type: object
      required:
        - 'hotel_id'
        - 'cliente_id'
        - 'conto_id'
        - 'punti'
        - 'data'
        - 'utente_id'
      properties:
        'hotel_id':
          type: integer
          format: int32
        'cliente_id':
          type: integer
          format: int32
        'conto_id':
          type: integer
          format: int32
        'punti':
          type: integer
          format: int32
        'data':
          type: string
          format: date
        'utente_id':
          type: integer
          format: int32
    PuntiSpesiPatch:
      type: object
      properties:
        'hotel_id':
          type: integer
          format: int32
        'cliente_id':
          type: integer
          format: int32
        'conto_id':
          type: integer
          format: int32
        'punti':
          type: integer
          format: int32
        'data':
          type: string
          format: date
        'utente_id':
          type: integer
          format: int32
    PuntiSpesiListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PuntiSpesiRead'
        meta: { type: object }
        links: { type: object }
    PuntiSpesiCreatedResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            'punti_spesi_id':
              type: integer
              format: int32
        meta: { type: object }
        links: { type: object }
