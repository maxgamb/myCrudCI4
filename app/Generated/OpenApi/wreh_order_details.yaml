openapi: 3.0.3
info:
  title: 'wreh_order_details API'
  version: 1.0.0
paths:
  /api/v1/wreh_order_details:
    get:
      summary: 'Elenco wreh_order_details'
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: 'filter[order_detail_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[order_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[product_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: sort
          in: query
          schema: { type: string, enum: ['order_detail_id', 'order_id', 'product_id'] }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: Elenco paginato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WrehOrderDetailsListResponse'
    post:
      summary: Crea record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WrehOrderDetailsCreate'
      responses:
        '201':
          description: Record creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WrehOrderDetailsCreatedResponse'
        '422': { description: Errore di validazione }
  /api/v1/wreh_order_details/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Dettaglio record
      responses:
        '200':
          description: Record trovato
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/WrehOrderDetailsRead'
        '404': { description: Record non trovato }
    put:
      summary: Aggiornamento completo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WrehOrderDetailsUpdate'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    patch:
      summary: Aggiornamento parziale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WrehOrderDetailsPatch'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    delete:
      summary: Elimina record
      responses:
        '204': { description: Record eliminato }
components:
  schemas:
    WrehOrderDetailsRead:
      type: object
      properties:
        'order_detail_id':
          type: integer
          format: int32
        'order_id':
          type: integer
          format: int32
          nullable: true
        'product_id':
          type: integer
          format: int32
          nullable: true
        'quantity':
          type: integer
          format: int32
        'price':
          type: number
          format: double
        'utente_id':
          type: integer
          format: int32
          nullable: true
        'wreh_orders_status':
          type: string
          nullable: true
        'wreh_products_name':
          type: string
          nullable: true
    WrehOrderDetailsCreate:
      type: object
      required:
        - 'quantity'
        - 'price'
      properties:
        'order_id':
          type: integer
          format: int32
          nullable: true
        'product_id':
          type: integer
          format: int32
          nullable: true
        'quantity':
          type: integer
          format: int32
        'price':
          type: number
          format: double
        'utente_id':
          type: integer
          format: int32
          nullable: true
    WrehOrderDetailsUpdate:
      type: object
      required:
        - 'quantity'
        - 'price'
      properties:
        'order_id':
          type: integer
          format: int32
          nullable: true
        'product_id':
          type: integer
          format: int32
          nullable: true
        'quantity':
          type: integer
          format: int32
        'price':
          type: number
          format: double
        'utente_id':
          type: integer
          format: int32
          nullable: true
    WrehOrderDetailsPatch:
      type: object
      properties:
        'order_id':
          type: integer
          format: int32
          nullable: true
        'product_id':
          type: integer
          format: int32
          nullable: true
        'quantity':
          type: integer
          format: int32
        'price':
          type: number
          format: double
        'utente_id':
          type: integer
          format: int32
          nullable: true
    WrehOrderDetailsListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WrehOrderDetailsRead'
        meta: { type: object }
        links: { type: object }
    WrehOrderDetailsCreatedResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            'order_detail_id':
              type: integer
              format: int32
        meta: { type: object }
        links: { type: object }
