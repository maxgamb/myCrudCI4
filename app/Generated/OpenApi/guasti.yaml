openapi: 3.0.3
info:
  title: 'guasti API'
  version: 1.0.0
paths:
  /api/v1/guasti:
    get:
      summary: 'Elenco guasti'
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: 'filter[guasto_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[hotel_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[camera_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[guasto_stato]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[guasto_data]'
          in: query
          schema:
            type: string
            format: date
        - name: sort
          in: query
          schema: { type: string, enum: ['guasto_id', 'hotel_id', 'camera_id', 'guasto_stato', 'guasto_data'] }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: Elenco paginato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuastiListResponse'
    post:
      summary: Crea record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuastiCreate'
      responses:
        '201':
          description: Record creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuastiCreatedResponse'
        '422': { description: Errore di validazione }
  /api/v1/guasti/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Dettaglio record
      responses:
        '200':
          description: Record trovato
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/GuastiRead'
        '404': { description: Record non trovato }
    put:
      summary: Aggiornamento completo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuastiUpdate'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    patch:
      summary: Aggiornamento parziale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuastiPatch'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    delete:
      summary: Elimina record
      responses:
        '204': { description: Record eliminato }
components:
  schemas:
    GuastiRead:
      type: object
      properties:
        'guasto_id':
          type: integer
          format: int32
        'hotel_id':
          type: integer
          format: int32
        'camera_id':
          type: integer
          format: int32
          nullable: true
        'guasto_priorita':
          type: integer
          format: int32
          nullable: true
        'guasto_area':
          type: string
          nullable: true
          maxLength: 250
        'guasto_piano':
          type: string
          nullable: true
          maxLength: 250
        'guasto_note':
          type: string
          nullable: true
          maxLength: 250
        'guasto_stato':
          type: integer
          format: int32
          nullable: true
        'guasto_data':
          type: string
          format: date
          nullable: true
        'guasto_utente_id':
          type: integer
          format: int32
        'camere_tipologia_camera':
          type: string
          nullable: true
        'hotels_nome_hotel':
          type: string
          nullable: true
    GuastiCreate:
      type: object
      required:
        - 'hotel_id'
        - 'guasto_utente_id'
      properties:
        'hotel_id':
          type: integer
          format: int32
        'camera_id':
          type: integer
          format: int32
          nullable: true
        'guasto_priorita':
          type: integer
          format: int32
          nullable: true
        'guasto_area':
          type: string
          nullable: true
          maxLength: 250
        'guasto_piano':
          type: string
          nullable: true
          maxLength: 250
        'guasto_note':
          type: string
          nullable: true
          maxLength: 250
        'guasto_stato':
          type: integer
          format: int32
          nullable: true
        'guasto_data':
          type: string
          format: date
          nullable: true
        'guasto_utente_id':
          type: integer
          format: int32
    GuastiUpdate:
      type: object
      required:
        - 'hotel_id'
        - 'guasto_utente_id'
      properties:
        'hotel_id':
          type: integer
          format: int32
        'camera_id':
          type: integer
          format: int32
          nullable: true
        'guasto_priorita':
          type: integer
          format: int32
          nullable: true
        'guasto_area':
          type: string
          nullable: true
          maxLength: 250
        'guasto_piano':
          type: string
          nullable: true
          maxLength: 250
        'guasto_note':
          type: string
          nullable: true
          maxLength: 250
        'guasto_stato':
          type: integer
          format: int32
          nullable: true
        'guasto_data':
          type: string
          format: date
          nullable: true
        'guasto_utente_id':
          type: integer
          format: int32
    GuastiPatch:
      type: object
      properties:
        'hotel_id':
          type: integer
          format: int32
        'camera_id':
          type: integer
          format: int32
          nullable: true
        'guasto_priorita':
          type: integer
          format: int32
          nullable: true
        'guasto_area':
          type: string
          nullable: true
          maxLength: 250
        'guasto_piano':
          type: string
          nullable: true
          maxLength: 250
        'guasto_note':
          type: string
          nullable: true
          maxLength: 250
        'guasto_stato':
          type: integer
          format: int32
          nullable: true
        'guasto_data':
          type: string
          format: date
          nullable: true
        'guasto_utente_id':
          type: integer
          format: int32
    GuastiListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/GuastiRead'
        meta: { type: object }
        links: { type: object }
    GuastiCreatedResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            'guasto_id':
              type: integer
              format: int32
        meta: { type: object }
        links: { type: object }
