openapi: 3.0.3
info:
  title: 'shifts API'
  version: 1.0.0
paths:
  /api/v1/shifts:
    get:
      summary: 'Elenco shifts'
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: 'filter[id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[staff_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[hotel_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[shift_date]'
          in: query
          schema:
            type: string
            format: date
        - name: sort
          in: query
          schema: { type: string, enum: ['id', 'staff_id', 'hotel_id', 'shift_date'] }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: Elenco paginato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShiftsListResponse'
    post:
      summary: Crea record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShiftsCreate'
      responses:
        '201':
          description: Record creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShiftsCreatedResponse'
        '422': { description: Errore di validazione }
  /api/v1/shifts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Dettaglio record
      responses:
        '200':
          description: Record trovato
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ShiftsRead'
        '404': { description: Record non trovato }
    put:
      summary: Aggiornamento completo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShiftsUpdate'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    patch:
      summary: Aggiornamento parziale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShiftsPatch'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    delete:
      summary: Elimina record
      responses:
        '204': { description: Record eliminato }
components:
  schemas:
    ShiftsRead:
      type: object
      properties:
        'id':
          type: integer
          format: int32
        'staff_id':
          type: integer
          format: int32
        'hotel_id':
          type: integer
          format: int32
        'shift_date':
          type: string
          format: date
        'position':
          type: integer
          format: int32
        'shift_time':
          type: string
        'staff_nome':
          type: string
          nullable: true
    ShiftsCreate:
      type: object
      required:
        - 'staff_id'
        - 'hotel_id'
        - 'shift_date'
        - 'position'
        - 'shift_time'
      properties:
        'staff_id':
          type: integer
          format: int32
        'hotel_id':
          type: integer
          format: int32
        'shift_date':
          type: string
          format: date
        'position':
          type: integer
          format: int32
        'shift_time':
          type: string
    ShiftsUpdate:
      type: object
      required:
        - 'staff_id'
        - 'hotel_id'
        - 'shift_date'
        - 'position'
        - 'shift_time'
      properties:
        'staff_id':
          type: integer
          format: int32
        'hotel_id':
          type: integer
          format: int32
        'shift_date':
          type: string
          format: date
        'position':
          type: integer
          format: int32
        'shift_time':
          type: string
    ShiftsPatch:
      type: object
      properties:
        'staff_id':
          type: integer
          format: int32
        'hotel_id':
          type: integer
          format: int32
        'shift_date':
          type: string
          format: date
        'position':
          type: integer
          format: int32
        'shift_time':
          type: string
    ShiftsListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ShiftsRead'
        meta: { type: object }
        links: { type: object }
    ShiftsCreatedResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            'id':
              type: integer
              format: int32
        meta: { type: object }
        links: { type: object }
