openapi: 3.0.3
info:
  title: 'film API'
  version: 1.0.0
paths:
  /api/v1/film:
    get:
      summary: 'Elenco film'
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: 'filter[film_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[title]'
          in: query
          schema:
            type: string
        - name: 'filter[language_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[original_language_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: sort
          in: query
          schema: { type: string, enum: ['film_id', 'title', 'language_id', 'original_language_id'] }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: Elenco paginato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilmListResponse'
    post:
      summary: Crea record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FilmCreate'
      responses:
        '201':
          description: Record creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilmCreatedResponse'
        '422': { description: Errore di validazione }
  /api/v1/film/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Dettaglio record
      responses:
        '200':
          description: Record trovato
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/FilmRead'
        '404': { description: Record non trovato }
    put:
      summary: Aggiornamento completo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FilmUpdate'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    patch:
      summary: Aggiornamento parziale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FilmPatch'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    delete:
      summary: Elimina record
      responses:
        '204': { description: Record eliminato }
components:
  schemas:
    FilmRead:
      type: object
      properties:
        'film_id':
          type: integer
          format: int32
        'title':
          type: string
          maxLength: 128
        'description':
          type: string
          nullable: true
          maxLength: 65535
        'release_year':
          type: string
          nullable: true
        'language_id':
          type: integer
          format: int32
        'original_language_id':
          type: integer
          format: int32
          nullable: true
        'rental_duration':
          type: integer
          format: int32
        'rental_rate':
          type: number
          format: double
        'length':
          type: integer
          format: int32
          nullable: true
        'replacement_cost':
          type: number
          format: double
        'rating':
          type: string
          nullable: true
          maxLength: 5
        'special_features':
          type: string
          nullable: true
          maxLength: 54
        'last_update':
          type: string
          format: date-time
        'language_id__label':
          type: string
          nullable: true
        'original_language_id__label':
          type: string
          nullable: true
    FilmCreate:
      type: object
      required:
        - 'title'
        - 'language_id'
      properties:
        'title':
          type: string
          maxLength: 128
        'description':
          type: string
          nullable: true
          maxLength: 65535
        'release_year':
          type: string
          nullable: true
        'language_id':
          type: integer
          format: int32
        'original_language_id':
          type: integer
          format: int32
          nullable: true
        'rental_duration':
          type: integer
          format: int32
        'rental_rate':
          type: number
          format: double
        'length':
          type: integer
          format: int32
          nullable: true
        'replacement_cost':
          type: number
          format: double
        'rating':
          type: string
          nullable: true
          maxLength: 5
        'special_features':
          type: string
          nullable: true
          maxLength: 54
    FilmUpdate:
      type: object
      required:
        - 'title'
        - 'language_id'
      properties:
        'title':
          type: string
          maxLength: 128
        'description':
          type: string
          nullable: true
          maxLength: 65535
        'release_year':
          type: string
          nullable: true
        'language_id':
          type: integer
          format: int32
        'original_language_id':
          type: integer
          format: int32
          nullable: true
        'rental_duration':
          type: integer
          format: int32
        'rental_rate':
          type: number
          format: double
        'length':
          type: integer
          format: int32
          nullable: true
        'replacement_cost':
          type: number
          format: double
        'rating':
          type: string
          nullable: true
          maxLength: 5
        'special_features':
          type: string
          nullable: true
          maxLength: 54
    FilmPatch:
      type: object
      properties:
        'title':
          type: string
          maxLength: 128
        'description':
          type: string
          nullable: true
          maxLength: 65535
        'release_year':
          type: string
          nullable: true
        'language_id':
          type: integer
          format: int32
        'original_language_id':
          type: integer
          format: int32
          nullable: true
        'rental_duration':
          type: integer
          format: int32
        'rental_rate':
          type: number
          format: double
        'length':
          type: integer
          format: int32
          nullable: true
        'replacement_cost':
          type: number
          format: double
        'rating':
          type: string
          nullable: true
          maxLength: 5
        'special_features':
          type: string
          nullable: true
          maxLength: 54
    FilmListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/FilmRead'
        meta: { type: object }
        links: { type: object }
    FilmCreatedResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            'film_id':
              type: integer
              format: int32
        meta: { type: object }
        links: { type: object }
