openapi: 3.0.3
info:
  title: 'wreh_orders API'
  version: 1.0.0
paths:
  /api/v1/wreh_orders:
    get:
      summary: 'Elenco wreh_orders'
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: 'filter[order_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: sort
          in: query
          schema: { type: string, enum: ['order_id'] }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: Elenco paginato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WrehOrdersListResponse'
    post:
      summary: Crea record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WrehOrdersCreate'
      responses:
        '201':
          description: Record creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WrehOrdersCreatedResponse'
        '422': { description: Errore di validazione }
  /api/v1/wreh_orders/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Dettaglio record
      responses:
        '200':
          description: Record trovato
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/WrehOrdersRead'
        '404': { description: Record non trovato }
    put:
      summary: Aggiornamento completo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WrehOrdersUpdate'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    patch:
      summary: Aggiornamento parziale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WrehOrdersPatch'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    delete:
      summary: Elimina record
      responses:
        '204': { description: Record eliminato }
components:
  schemas:
    WrehOrdersRead:
      type: object
      properties:
        'order_id':
          type: integer
          format: int32
        'hotel_id':
          type: integer
          format: int32
          nullable: true
        'order_date':
          type: string
          format: date-time
        'status':
          type: string
          nullable: true
          maxLength: 50
        'utente_id':
          type: integer
          format: int32
          nullable: true
    WrehOrdersCreate:
      type: object
      required:
        - 'order_date'
      properties:
        'hotel_id':
          type: integer
          format: int32
          nullable: true
        'order_date':
          type: string
          format: date-time
        'status':
          type: string
          nullable: true
          maxLength: 50
        'utente_id':
          type: integer
          format: int32
          nullable: true
    WrehOrdersUpdate:
      type: object
      required:
        - 'order_date'
      properties:
        'hotel_id':
          type: integer
          format: int32
          nullable: true
        'order_date':
          type: string
          format: date-time
        'status':
          type: string
          nullable: true
          maxLength: 50
        'utente_id':
          type: integer
          format: int32
          nullable: true
    WrehOrdersPatch:
      type: object
      properties:
        'hotel_id':
          type: integer
          format: int32
          nullable: true
        'order_date':
          type: string
          format: date-time
        'status':
          type: string
          nullable: true
          maxLength: 50
        'utente_id':
          type: integer
          format: int32
          nullable: true
    WrehOrdersListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WrehOrdersRead'
        meta: { type: object }
        links: { type: object }
    WrehOrdersCreatedResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            'order_id':
              type: integer
              format: int32
        meta: { type: object }
        links: { type: object }
