openapi: 3.0.3
info:
  title: 'payment API'
  version: 1.0.0
paths:
  /api/v1/payment:
    get:
      summary: 'Elenco payment'
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: 'filter[payment_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[customer_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[staff_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[rental_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: sort
          in: query
          schema: { type: string, enum: ['payment_id', 'customer_id', 'staff_id', 'rental_id'] }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: Elenco paginato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentListResponse'
    post:
      summary: Crea record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentCreate'
      responses:
        '201':
          description: Record creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentCreatedResponse'
        '422': { description: Errore di validazione }
  /api/v1/payment/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Dettaglio record
      responses:
        '200':
          description: Record trovato
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PaymentRead'
        '404': { description: Record non trovato }
    put:
      summary: Aggiornamento completo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentUpdate'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    patch:
      summary: Aggiornamento parziale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentPatch'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    delete:
      summary: Elimina record
      responses:
        '204': { description: Record eliminato }
components:
  schemas:
    PaymentRead:
      type: object
      properties:
        'payment_id':
          type: integer
          format: int32
        'customer_id':
          type: integer
          format: int32
        'staff_id':
          type: integer
          format: int32
        'rental_id':
          type: integer
          format: int32
          nullable: true
        'amount':
          type: number
          format: double
        'payment_date':
          type: string
          format: date-time
        'last_update':
          type: string
          format: date-time
          nullable: true
        'customer_id__label':
          type: string
          nullable: true
        'rental_id__label':
          type: string
          nullable: true
        'staff_id__label':
          type: string
          nullable: true
    PaymentCreate:
      type: object
      required:
        - 'customer_id'
        - 'staff_id'
        - 'amount'
        - 'payment_date'
      properties:
        'customer_id':
          type: integer
          format: int32
        'staff_id':
          type: integer
          format: int32
        'rental_id':
          type: integer
          format: int32
          nullable: true
        'amount':
          type: number
          format: double
        'payment_date':
          type: string
          format: date-time
    PaymentUpdate:
      type: object
      required:
        - 'customer_id'
        - 'staff_id'
        - 'amount'
        - 'payment_date'
      properties:
        'customer_id':
          type: integer
          format: int32
        'staff_id':
          type: integer
          format: int32
        'rental_id':
          type: integer
          format: int32
          nullable: true
        'amount':
          type: number
          format: double
        'payment_date':
          type: string
          format: date-time
    PaymentPatch:
      type: object
      properties:
        'customer_id':
          type: integer
          format: int32
        'staff_id':
          type: integer
          format: int32
        'rental_id':
          type: integer
          format: int32
          nullable: true
        'amount':
          type: number
          format: double
        'payment_date':
          type: string
          format: date-time
    PaymentListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PaymentRead'
        meta: { type: object }
        links: { type: object }
    PaymentCreatedResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            'payment_id':
              type: integer
              format: int32
        meta: { type: object }
        links: { type: object }
