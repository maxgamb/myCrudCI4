openapi: 3.0.3
info:
  title: 'payment API'
  version: 1.0.0
  description: 'Generated by myCrudCI4 from the current database schema and persisted CRUD configuration.'
tags:
  - name: 'Payment'
    description: 'Operations for payment'
paths:
  /api/v1/payment:
    get:
      tags: ['Payment']
      operationId: listPayment
      summary: 'List payment'
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: 'filter[payment_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[customer_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[staff_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[rental_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: sort
          in: query
          schema: { type: string, enum: ['payment_id', 'customer_id', 'staff_id', 'rental_id'] }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc], default: asc }
      responses:
        '200':
          description: Paginated list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentListResponse'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: ['Payment']
      operationId: createPayment
      summary: 'Create payment record'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentCreatedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/payment/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
    get:
      tags: ['Payment']
      operationId: getPayment
      summary: 'Get payment record'
      responses:
        '200':
          description: Record found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: ['Payment']
      operationId: updatePayment
      summary: 'Replace/update payment record'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: ['Payment']
      operationId: patchPayment
      summary: 'Partially update payment record'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentPatch'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: ['Payment']
      operationId: deletePayment
      summary: 'Delete payment record'
      responses:
        '204': { description: Deleted }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  schemas:
    PaymentRead:
      type: object
      properties:
        'payment_id':
          type: integer
          format: int32
        'customer_id':
          type: integer
          format: int32
        'staff_id':
          type: integer
          format: int32
        'rental_id':
          type: integer
          format: int32
          nullable: true
        'amount':
          type: number
          format: double
        'payment_date':
          type: string
          format: date-time
        'last_update':
          type: string
          format: date-time
          nullable: true
        'customer_id__label':
          type: string
          nullable: true
        'rental_id__label':
          type: string
          nullable: true
        'staff_id__label':
          type: string
          nullable: true
    PaymentCreate:
      type: object
      required:
        - 'customer_id'
        - 'staff_id'
        - 'amount'
        - 'payment_date'
      properties:
        'customer_id':
          type: integer
          format: int32
        'staff_id':
          type: integer
          format: int32
        'rental_id':
          type: integer
          format: int32
          nullable: true
        'amount':
          type: number
          format: double
        'payment_date':
          type: string
          format: date-time
    PaymentUpdate:
      type: object
      required:
        - 'customer_id'
        - 'staff_id'
        - 'amount'
        - 'payment_date'
      properties:
        'customer_id':
          type: integer
          format: int32
        'staff_id':
          type: integer
          format: int32
        'rental_id':
          type: integer
          format: int32
          nullable: true
        'amount':
          type: number
          format: double
        'payment_date':
          type: string
          format: date-time
    PaymentPatch:
      type: object
      properties:
        'customer_id':
          type: integer
          format: int32
        'staff_id':
          type: integer
          format: int32
        'rental_id':
          type: integer
          format: int32
          nullable: true
        'amount':
          type: number
          format: double
        'payment_date':
          type: string
          format: date-time
    PaymentResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/PaymentRead'
        meta: { type: object }
        links: { type: object }
    PaymentListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PaymentRead'
        meta:
          type: object
          properties:
            page: { type: integer }
            perPage: { type: integer }
            total: { type: integer }
            pageCount: { type: integer }
        links:
          type: object
          properties:
            self: { type: string, nullable: true }
            next: { type: string, nullable: true }
            prev: { type: string, nullable: true }
    PaymentCreatedResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            'payment_id':
              type: integer
              format: int32
        meta: { type: object }
        links: { type: object }
    PaymentErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            fields:
              type: object
              additionalProperties:
                type: string
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PaymentErrorResponse'
    NotFound:
      description: Record not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PaymentErrorResponse'
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PaymentErrorResponse'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PaymentErrorResponse'
