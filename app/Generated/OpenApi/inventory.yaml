openapi: 3.0.3
info:
  title: 'inventory API'
  version: 1.0.0
  description: 'Generated by myCrudCI4 from the current database schema and persisted CRUD configuration.'
tags:
  - name: 'Inventory'
    description: 'Operations for inventory'
paths:
  /api/v1/inventory:
    get:
      tags: ['Inventory']
      operationId: listInventory
      summary: 'List inventory'
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: 'filter[inventory_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[film_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[store_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: sort
          in: query
          schema: { type: string, enum: ['inventory_id', 'film_id', 'store_id'] }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc], default: asc }
      responses:
        '200':
          description: Paginated list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryListResponse'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: ['Inventory']
      operationId: createInventory
      summary: 'Create inventory record'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryCreatedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/inventory/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
    get:
      tags: ['Inventory']
      operationId: getInventory
      summary: 'Get inventory record'
      responses:
        '200':
          description: Record found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: ['Inventory']
      operationId: updateInventory
      summary: 'Replace/update inventory record'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: ['Inventory']
      operationId: patchInventory
      summary: 'Partially update inventory record'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryPatch'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: ['Inventory']
      operationId: deleteInventory
      summary: 'Delete inventory record'
      responses:
        '204': { description: Deleted }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  schemas:
    InventoryRead:
      type: object
      properties:
        'inventory_id':
          type: integer
          format: int32
        'film_id':
          type: integer
          format: int32
        'store_id':
          type: integer
          format: int32
        'last_update':
          type: string
          format: date-time
        'film_id__label':
          type: string
          nullable: true
        'store_id__label':
          type: string
          nullable: true
    InventoryCreate:
      type: object
      required:
        - 'film_id'
        - 'store_id'
      properties:
        'film_id':
          type: integer
          format: int32
        'store_id':
          type: integer
          format: int32
    InventoryUpdate:
      type: object
      required:
        - 'film_id'
        - 'store_id'
      properties:
        'film_id':
          type: integer
          format: int32
        'store_id':
          type: integer
          format: int32
    InventoryPatch:
      type: object
      properties:
        'film_id':
          type: integer
          format: int32
        'store_id':
          type: integer
          format: int32
    InventoryResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/InventoryRead'
        meta: { type: object }
        links: { type: object }
    InventoryListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/InventoryRead'
        meta:
          type: object
          properties:
            page: { type: integer }
            perPage: { type: integer }
            total: { type: integer }
            pageCount: { type: integer }
        links:
          type: object
          properties:
            self: { type: string, nullable: true }
            next: { type: string, nullable: true }
            prev: { type: string, nullable: true }
    InventoryCreatedResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            'inventory_id':
              type: integer
              format: int32
        meta: { type: object }
        links: { type: object }
    InventoryErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            fields:
              type: object
              additionalProperties:
                type: string
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InventoryErrorResponse'
    NotFound:
      description: Record not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InventoryErrorResponse'
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InventoryErrorResponse'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InventoryErrorResponse'
