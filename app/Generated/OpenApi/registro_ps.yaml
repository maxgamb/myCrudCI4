openapi: 3.0.3
info:
  title: 'registro_ps API'
  version: 1.0.0
paths:
  /api/v1/registro_ps:
    get:
      summary: 'Elenco registro_ps'
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: 'filter[registro_ps_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: sort
          in: query
          schema: { type: string, enum: ['registro_ps_id'] }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: Elenco paginato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistroPsListResponse'
    post:
      summary: Crea record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistroPsCreate'
      responses:
        '201':
          description: Record creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistroPsCreatedResponse'
        '422': { description: Errore di validazione }
  /api/v1/registro_ps/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Dettaglio record
      responses:
        '200':
          description: Record trovato
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/RegistroPsRead'
        '404': { description: Record non trovato }
    put:
      summary: Aggiornamento completo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistroPsUpdate'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    patch:
      summary: Aggiornamento parziale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistroPsPatch'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    delete:
      summary: Elimina record
      responses:
        '204': { description: Record eliminato }
components:
  schemas:
    RegistroPsRead:
      type: object
      properties:
        'registro_ps_id':
          type: integer
          format: int32
        'registro_ps_hotel_id':
          type: integer
          format: int32
        'registro_ps_valore':
          type: integer
          format: int32
        'registro_ps_utente_id':
          type: integer
          format: int32
          nullable: true
    RegistroPsCreate:
      type: object
      properties:
        'registro_ps_hotel_id':
          type: integer
          format: int32
        'registro_ps_valore':
          type: integer
          format: int32
        'registro_ps_utente_id':
          type: integer
          format: int32
          nullable: true
    RegistroPsUpdate:
      type: object
      properties:
        'registro_ps_hotel_id':
          type: integer
          format: int32
        'registro_ps_valore':
          type: integer
          format: int32
        'registro_ps_utente_id':
          type: integer
          format: int32
          nullable: true
    RegistroPsPatch:
      type: object
      properties:
        'registro_ps_hotel_id':
          type: integer
          format: int32
        'registro_ps_valore':
          type: integer
          format: int32
        'registro_ps_utente_id':
          type: integer
          format: int32
          nullable: true
    RegistroPsListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/RegistroPsRead'
        meta: { type: object }
        links: { type: object }
    RegistroPsCreatedResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            'registro_ps_id':
              type: integer
              format: int32
        meta: { type: object }
        links: { type: object }
