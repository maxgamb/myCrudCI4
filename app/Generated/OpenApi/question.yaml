openapi: 3.0.3
info:
  title: 'question API'
  version: 1.0.0
paths:
  /api/v1/question:
    get:
      summary: 'Elenco question'
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: 'filter[question_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: sort
          in: query
          schema: { type: string, enum: ['question_id'] }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: Elenco paginato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionListResponse'
    post:
      summary: Crea record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionCreate'
      responses:
        '201':
          description: Record creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionCreatedResponse'
        '422': { description: Errore di validazione }
  /api/v1/question/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Dettaglio record
      responses:
        '200':
          description: Record trovato
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/QuestionRead'
        '404': { description: Record non trovato }
    put:
      summary: Aggiornamento completo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionUpdate'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    patch:
      summary: Aggiornamento parziale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionPatch'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    delete:
      summary: Elimina record
      responses:
        '204': { description: Record eliminato }
components:
  schemas:
    QuestionRead:
      type: object
      properties:
        'question_id':
          type: integer
          format: int32
        'title':
          type: string
          nullable: true
          maxLength: 240
        'tex_lingue_id_pro':
          type: integer
          format: int32
          nullable: true
        'tex_lingue_id_con':
          type: integer
          format: int32
          nullable: true
        'tex_pro':
          type: string
          maxLength: 200
        'tex_no':
          type: string
          maxLength: 200
    QuestionCreate:
      type: object
      required:
        - 'tex_pro'
        - 'tex_no'
      properties:
        'title':
          type: string
          nullable: true
          maxLength: 240
        'tex_lingue_id_pro':
          type: integer
          format: int32
          nullable: true
        'tex_lingue_id_con':
          type: integer
          format: int32
          nullable: true
        'tex_pro':
          type: string
          maxLength: 200
        'tex_no':
          type: string
          maxLength: 200
    QuestionUpdate:
      type: object
      required:
        - 'tex_pro'
        - 'tex_no'
      properties:
        'title':
          type: string
          nullable: true
          maxLength: 240
        'tex_lingue_id_pro':
          type: integer
          format: int32
          nullable: true
        'tex_lingue_id_con':
          type: integer
          format: int32
          nullable: true
        'tex_pro':
          type: string
          maxLength: 200
        'tex_no':
          type: string
          maxLength: 200
    QuestionPatch:
      type: object
      properties:
        'title':
          type: string
          nullable: true
          maxLength: 240
        'tex_lingue_id_pro':
          type: integer
          format: int32
          nullable: true
        'tex_lingue_id_con':
          type: integer
          format: int32
          nullable: true
        'tex_pro':
          type: string
          maxLength: 200
        'tex_no':
          type: string
          maxLength: 200
    QuestionListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/QuestionRead'
        meta: { type: object }
        links: { type: object }
    QuestionCreatedResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            'question_id':
              type: integer
              format: int32
        meta: { type: object }
        links: { type: object }
