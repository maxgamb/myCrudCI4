        'nazione_iso3':
          type: string
          maxLength: 5
    ComuniListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ComuniRead'
        meta: { type: object }
        links: { type: object }
    ComuniCreatedResponse:
      type: object
