        'Comuni_ColExcel':
          type: string
          maxLength: 250
        'Comuni_Nazione':
          type: string
          maxLength: 100
        'Comuni_Lingua':
          type: string
          maxLength: 4
        'nazione_iso2':
          type: string
          maxLength: 5
        'nazione_iso3':
          type: string
          maxLength: 5
    ComuniPatch:
      type: object
      properties:
        'Comuni_Codice':
          type: string
          maxLength: 250
        'Comuni_Nome':
          type: string
          nullable: true
          maxLength: 250
        'Comuni_Prov':
          type: string
