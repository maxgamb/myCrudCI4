openapi: 3.0.3
info:
  title: 'actor API'
  version: 1.0.0
paths:
  /api/v1/actor:
    get:
      summary: 'Elenco actor'
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: 'filter[actor_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[last_name]'
          in: query
          schema:
            type: string
        - name: sort
          in: query
          schema: { type: string, enum: ['actor_id', 'last_name'] }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: Elenco paginato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActorListResponse'
    post:
      summary: Crea record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActorCreate'
      responses:
        '201':
          description: Record creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActorCreatedResponse'
        '422': { description: Errore di validazione }
  /api/v1/actor/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Dettaglio record
      responses:
        '200':
          description: Record trovato
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ActorRead'
        '404': { description: Record non trovato }
    put:
      summary: Aggiornamento completo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActorUpdate'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    patch:
      summary: Aggiornamento parziale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActorPatch'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    delete:
      summary: Elimina record
      responses:
        '204': { description: Record eliminato }
components:
  schemas:
    ActorRead:
      type: object
      properties:
        'actor_id':
          type: integer
          format: int32
        'first_name':
          type: string
          maxLength: 45
        'last_name':
          type: string
          maxLength: 45
        'last_update':
          type: string
          format: date-time
    ActorCreate:
      type: object
      required:
        - 'first_name'
        - 'last_name'
      properties:
        'first_name':
          type: string
          maxLength: 45
        'last_name':
          type: string
          maxLength: 45
    ActorUpdate:
      type: object
      required:
        - 'first_name'
        - 'last_name'
      properties:
        'first_name':
          type: string
          maxLength: 45
        'last_name':
          type: string
          maxLength: 45
    ActorPatch:
      type: object
      properties:
        'first_name':
          type: string
          maxLength: 45
        'last_name':
          type: string
          maxLength: 45
    ActorListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ActorRead'
        meta: { type: object }
        links: { type: object }
    ActorCreatedResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            'actor_id':
              type: integer
              format: int32
        meta: { type: object }
        links: { type: object }
