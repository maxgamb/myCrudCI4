openapi: 3.0.3
info:
  title: 'actor API'
  version: 1.0.0
  description: 'Generated by myCrudCI4 from the current database schema and persisted CRUD configuration.'
tags:
  - name: 'Actor'
    description: 'Operations for actor'
paths:
  /api/v1/actor:
    get:
      tags: ['Actor']
      operationId: listActor
      summary: 'List actor'
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: 'filter[actor_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[last_name]'
          in: query
          schema:
            type: string
        - name: sort
          in: query
          schema: { type: string, enum: ['actor_id', 'last_name'] }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc], default: asc }
      responses:
        '200':
          description: Paginated list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActorListResponse'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: ['Actor']
      operationId: createActor
      summary: 'Create actor record'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActorCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActorCreatedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/actor/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
    get:
      tags: ['Actor']
      operationId: getActor
      summary: 'Get actor record'
      responses:
        '200':
          description: Record found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: ['Actor']
      operationId: updateActor
      summary: 'Replace/update actor record'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActorUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActorResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: ['Actor']
      operationId: patchActor
      summary: 'Partially update actor record'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActorPatch'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActorResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: ['Actor']
      operationId: deleteActor
      summary: 'Delete actor record'
      responses:
        '204': { description: Deleted }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  schemas:
    ActorRead:
      type: object
      properties:
        'actor_id':
          type: integer
          format: int32
        'first_name':
          type: string
          maxLength: 45
        'last_name':
          type: string
          maxLength: 45
        'last_update':
          type: string
          format: date-time
    ActorCreate:
      type: object
      required:
        - 'first_name'
        - 'last_name'
      properties:
        'first_name':
          type: string
          maxLength: 45
        'last_name':
          type: string
          maxLength: 45
    ActorUpdate:
      type: object
      required:
        - 'first_name'
        - 'last_name'
      properties:
        'first_name':
          type: string
          maxLength: 45
        'last_name':
          type: string
          maxLength: 45
    ActorPatch:
      type: object
      properties:
        'first_name':
          type: string
          maxLength: 45
        'last_name':
          type: string
          maxLength: 45
    ActorResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/ActorRead'
        meta: { type: object }
        links: { type: object }
    ActorListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ActorRead'
        meta:
          type: object
          properties:
            page: { type: integer }
            perPage: { type: integer }
            total: { type: integer }
            pageCount: { type: integer }
        links:
          type: object
          properties:
            self: { type: string, nullable: true }
            next: { type: string, nullable: true }
            prev: { type: string, nullable: true }
    ActorCreatedResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            'actor_id':
              type: integer
              format: int32
        meta: { type: object }
        links: { type: object }
    ActorErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            fields:
              type: object
              additionalProperties:
                type: string
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ActorErrorResponse'
    NotFound:
      description: Record not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ActorErrorResponse'
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ActorErrorResponse'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ActorErrorResponse'
