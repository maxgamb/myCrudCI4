openapi: 3.0.3
info:
  title: 'camere_nesting API'
  version: 1.0.0
paths:
  /api/v1/camere_nesting:
    get:
      summary: 'Elenco camere_nesting'
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: 'filter[nesting_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[camara_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: 'filter[tipologia_id]'
          in: query
          schema:
            type: integer
            format: int32
        - name: sort
          in: query
          schema: { type: string, enum: ['nesting_id', 'camara_id', 'tipologia_id'] }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: Elenco paginato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CamereNestingListResponse'
    post:
      summary: Crea record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CamereNestingCreate'
      responses:
        '201':
          description: Record creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CamereNestingCreatedResponse'
        '422': { description: Errore di validazione }
  /api/v1/camere_nesting/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Dettaglio record
      responses:
        '200':
          description: Record trovato
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CamereNestingRead'
        '404': { description: Record non trovato }
    put:
      summary: Aggiornamento completo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CamereNestingUpdate'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    patch:
      summary: Aggiornamento parziale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CamereNestingPatch'
      responses:
        '200': { description: Record aggiornato }
        '422': { description: Errore di validazione }
    delete:
      summary: Elimina record
      responses:
        '204': { description: Record eliminato }
components:
  schemas:
    CamereNestingRead:
      type: object
      properties:
        'nesting_id':
          type: integer
          format: int32
        'camara_id':
          type: integer
          format: int32
        'tipologia_id':
          type: integer
          format: int32
        'voto':
          type: integer
          format: int32
        'nesting_utente_id':
          type: integer
          format: int32
    CamereNestingCreate:
      type: object
      required:
        - 'camara_id'
        - 'tipologia_id'
        - 'voto'
        - 'nesting_utente_id'
      properties:
        'camara_id':
          type: integer
          format: int32
        'tipologia_id':
          type: integer
          format: int32
        'voto':
          type: integer
          format: int32
        'nesting_utente_id':
          type: integer
          format: int32
    CamereNestingUpdate:
      type: object
      required:
        - 'camara_id'
        - 'tipologia_id'
        - 'voto'
        - 'nesting_utente_id'
      properties:
        'camara_id':
          type: integer
          format: int32
        'tipologia_id':
          type: integer
          format: int32
        'voto':
          type: integer
          format: int32
        'nesting_utente_id':
          type: integer
          format: int32
    CamereNestingPatch:
      type: object
      properties:
        'camara_id':
          type: integer
          format: int32
        'tipologia_id':
          type: integer
          format: int32
        'voto':
          type: integer
          format: int32
        'nesting_utente_id':
          type: integer
          format: int32
    CamereNestingListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CamereNestingRead'
        meta: { type: object }
        links: { type: object }
    CamereNestingCreatedResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            'nesting_id':
              type: integer
              format: int32
        meta: { type: object }
        links: { type: object }
